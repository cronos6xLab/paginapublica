<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteo Fisico de Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg:#0e1015; --bg2:#161920; --card:#1c2029; --card2:#222733;
            --border:#2a2f40; --fg:#e4e6ec; --muted:#7c829a;
            --accent:#d9883b; --accent2:#efb055; --accent-glow:rgba(217,136,59,.12);
            --red:#e05050; --red-bg:rgba(224,80,80,.09); --red-bdr:rgba(224,80,80,.40);
            --amber:#e0a830; --amber-bg:rgba(224,168,48,.09); --amber-bdr:rgba(224,168,48,.40);
            --green:#3ab876; --green-bg:rgba(58,184,118,.09); --green-bdr:rgba(58,184,118,.40);
            --r:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}

        .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .bg-fx .o{position:absolute;border-radius:50%;filter:blur(130px);opacity:.1;animation:orbF 22s ease-in-out infinite alternate}
        .bg-fx .o:nth-child(1){width:550px;height:550px;background:var(--accent);top:-180px;left:-80px}
        .bg-fx .o:nth-child(2){width:450px;height:450px;background:#c0392b;bottom:-120px;right:-80px;animation-delay:-8s}
        .bg-fx .o:nth-child(3){width:350px;height:350px;background:#16a085;top:50%;left:55%;animation-delay:-15s}
        @keyframes orbF{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}100%{transform:translate(-15px,15px) scale(.94)}}

        .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:16px 14px 110px}

        header{text-align:center;padding:20px 0 16px}
        header .ico{width:50px;height:50px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin-bottom:10px;box-shadow:0 6px 24px rgba(217,136,59,.3)}
        header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.4rem,4.5vw,2.1rem);font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,var(--fg),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        header p{color:var(--muted);margin-top:3px;font-size:.84rem}

        .top-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .top-row .fld{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px}
        .top-row label{display:block;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
        .top-row input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;color:var(--fg);font-family:'DM Sans',sans-serif;font-size:.84rem;outline:none;transition:border .2s}
        .top-row input:focus{border-color:var(--accent)}

        /* Progreso + Resumen */
        .stats-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .stat-card{flex:1;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;text-align:center}
        .stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700}
        .stat-card .lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
        .stat-card.s-total .num{color:var(--accent2)}
        .stat-card.s-ok .num{color:var(--green)}
        .stat-card.s-low .num{color:var(--red)}
        .stat-card.s-high .num{color:var(--amber)}

        .prog-wrap{margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px}
        .prog-lbl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:5px}
        .prog-lbl strong{color:var(--accent2);font-size:.82rem}
        .prog-trk{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .35s ease;width:0%}

        /* Leyenda */
        .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);font-size:.72rem;color:var(--muted)}
        .legend i{margin-right:3px}
        .lg-red{color:var(--red)}.lg-amber{color:var(--amber)}.lg-ok{color:var(--accent2)}

        /* Buscador */
        .search-bar{margin-bottom:14px;position:relative}
        .search-bar input{width:100%;padding:10px 14px 10px 38px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:.86rem;outline:none;transition:border .2s}
        .search-bar input:focus{border-color:var(--accent)}
        .search-bar input::placeholder{color:var(--muted)}
        .search-bar .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}

        /* Tabs */
        .tabs{display:flex;gap:3px;margin-bottom:16px;background:var(--bg2);border-radius:9px;padding:3px;overflow-x:auto}
        .tab-btn{flex:1;min-width:fit-content;padding:8px 12px;background:0;border:0;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;border-radius:6px;cursor:pointer;transition:.2s;white-space:nowrap}
        .tab-btn:hover{color:var(--fg);background:var(--card)}
        .tab-btn.on{color:#fff;background:var(--accent);font-weight:700;box-shadow:0 2px 10px rgba(217,136,59,.25)}
        .tpanel{display:none;animation:fi .25s ease}.tpanel.on{display:block}
        @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

        /* Categoría */
        .cat-sec{margin-bottom:20px}
        .cat-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px;padding-bottom:7px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none}
        .cat-hd:hover .ct{color:var(--accent)}
        .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
        .cat-nm{font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:-.3px}
        .cat-cnt{font-size:.65rem;color:var(--muted);background:var(--bg2);padding:2px 7px;border-radius:16px;margin-left:auto}
        .ct{color:var(--muted);font-size:.6rem;transition:.2s;margin-left:4px}
        .cat-body{transition:.2s}.cat-body.hide{display:none}

        /* Fila producto */
        .prow{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:5px;transition:.2s}
        .prow:hover{background:var(--card2)}
        .prow.st-low{background:var(--red-bg);border-color:var(--red-bdr);border-left:3px solid var(--red)}
        .prow.st-high{background:var(--amber-bg);border-color:var(--amber-bdr);border-left:3px solid var(--amber)}
        .prow.st-ok{background:var(--green-bg);border-color:var(--green-bdr);border-left:3px solid var(--green)}
        .prow.hidden{display:none}

        .pn{flex:1;font-size:.78rem;font-weight:500;min-width:0;line-height:1.25}
        .pn .pr{font-size:.6rem;color:var(--muted);margin-top:1px}

        .badge{font-size:.52rem;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--bg2);color:var(--muted);flex-shrink:0;white-space:nowrap}
        .prow.st-low .badge{background:var(--red);color:#fff}
        .prow.st-high .badge{background:var(--amber);color:#1a1a1a}
        .prow.st-ok .badge{background:var(--green);color:#fff}

        .igrp{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;transition:border .2s}
        .igrp:focus-within{border-color:var(--accent)}
        .igrp input[type=number]{width:72px;padding:6px 7px;background:0;border:0;color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;text-align:right;outline:0;-moz-appearance:textfield}
        .igrp input::-webkit-inner-spin-button,.igrp input::-webkit-outer-spin-button{-webkit-appearance:none}
        .igrp .usel{padding:6px 4px;background:var(--card);border:0;border-left:1px solid var(--border);color:var(--accent2);font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:700;cursor:pointer;outline:0;min-width:38px}
        .igrp .usel option{background:var(--bg2);color:var(--fg)}

        /* Acciones */
        .act-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg) 65%,transparent);padding:14px 14px 10px;display:flex;gap:7px;flex-wrap:wrap;z-index:10;justify-content:center;max-width:940px;margin:0 auto}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:0;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s}
        .btn:active{transform:scale(.96)}
        .btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(217,136,59,.3)}
        .btn-p:hover{box-shadow:0 6px 22px rgba(217,136,59,.4)}
        .btn-s{background:var(--card);color:var(--fg);border:1px solid var(--border)}
        .btn-s:hover{border-color:var(--accent)}
        .btn-d{background:0;color:var(--red);border:1px solid rgba(224,80,80,.3)}
        .btn-d:hover{background:var(--red);color:#fff}
        .act-bar .btn{flex:1;min-width:110px;justify-content:center}

        /* Modal */
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:flex-start;padding:16px;overflow-y:auto}
        .modal-bg.show{display:flex}
        .modal-box{background:#fff;color:#1a1a1a;border-radius:10px;width:100%;max-width:820px;margin-top:16px;animation:mi .25s ease}
        @keyframes mi{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
        .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e0e0e0}
        .modal-hd h2{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700}
        .modal-x{width:32px;height:32px;background:#f0f0f0;border:0;border-radius:50%;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:.2s}
        .modal-x:hover{background:#e0e0e0}
        .modal-bd{padding:18px;max-height:62vh;overflow-y:auto}
        .modal-ft{display:flex;gap:7px;padding:12px 18px;border-top:1px solid #e0e0e0}
        .modal-ft .btn{flex:1;justify-content:center}
        .btn-pr{background:#1a1a1a;color:#fff}.btn-pf{background:var(--red);color:#fff}

        /* Reporte */
        .rpt .rh{text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #1a1a1a}
        .rpt .rh h2{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700}
        .rpt .rm{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;margin-top:5px;font-size:.74rem;color:#666}
        .rpt table{width:100%;border-collapse:collapse;font-size:.72rem}
        .rpt thead th{background:#1a1a1a;color:#fff;padding:6px 8px;text-align:left;font-weight:700;font-size:.64rem;text-transform:uppercase;letter-spacing:.4px}
        .rpt .cr td{background:#f4f4f4;padding:5px 8px;font-weight:700;font-size:.72rem;color:#333;border-bottom:2px solid #ddd}
        .rpt tbody td{padding:4px 8px;border-bottom:1px solid #eee}
        .rpt tbody tr:nth-child(even) td{background:#fafafa}
        .rpt .cl{color:#c0392b;font-weight:700}.rpt .ch{color:#d4880f;font-weight:700}.rpt .co{color:#1a1a1a;font-weight:600}
        .rpt .ev{color:#ccc;font-style:italic}
        .rpt .tr td{background:#1a1a1a;color:#fff;padding:8px;font-weight:700;font-size:.72rem}

        /* Historial */
        .hlist{display:flex;flex-direction:column;gap:7px}
        .hcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px}
        .hcard:hover{border-color:var(--accent);background:var(--card2)}
        .hico{width:36px;height:36px;background:var(--accent-glow);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:.9rem;flex-shrink:0}
        .hinfo{flex:1}.hinfo h4{font-size:.84rem;font-weight:700}.hinfo p{font-size:.68rem;color:var(--muted);margin-top:1px}
        .hacts{display:flex;gap:4px}
        .hacts button{width:28px;height:28px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-size:.7rem;transition:.2s}
        .hacts button:hover{color:var(--fg);border-color:var(--accent)}
        .hacts button.del:hover{color:var(--red);border-color:var(--red)}
        .empty{text-align:center;padding:40px 16px;color:var(--muted)}
        .empty i{font-size:2.2rem;margin-bottom:10px;opacity:.3}.empty h3{font-size:.95rem;margin-bottom:3px;color:var(--fg)}

        /* Toast */
        .toast-c{position:fixed;top:14px;right:14px;z-index:2000;display:flex;flex-direction:column;gap:5px}
        .toast{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 14px;font-size:.8rem;color:var(--fg);display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:ti .25s ease,to .25s ease 2.7s forwards;min-width:200px}
        .toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red)}
        .toast.ok i{color:var(--green)}.toast.err i{color:var(--red)}
        @keyframes ti{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:translateX(0)}}
        @keyframes to{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}

        @media(max-width:600px){
            .prow{flex-wrap:wrap;gap:3px;padding:6px 8px}
            .pn{width:100%;margin-bottom:1px}
            .igrp{margin-left:auto}
            .modal-box{border-radius:0;margin-top:0}
            .stats-bar{gap:5px}.stat-card{min-width:70px;padding:7px 8px}.stat-card .num{font-size:1rem}
        }
        @media print{
            body{background:#fff!important}
            .wrap,.modal-bg,.bg-fx,.toast-c,.act-bar,.tabs{display:none!important}
            #printArea{display:block!important;position:fixed;inset:0;background:#fff;z-index:99999;padding:14px}
        }
        #printArea{display:none}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    </style>
</head>
<body>
<div class="bg-fx"><div class="o"></div><div class="o"></div><div class="o"></div></div>
<div class="wrap">
    <header>
        <div class="ico"><i class="fas fa-clipboard-check"></i></div>
        <h1>Conteo Fisico de Inventario</h1>
        <p>Registra, verifica minimos/maximos, guarda e imprime</p>
    </header>

    <div class="top-row">
        <div class="fld"><label>Fecha</label><input type="date" id="cDate"></div>
        <div class="fld"><label>Responsable</label><input type="text" id="cResp" placeholder="Nombre"></div>
        <div class="fld"><label>Sede</label><input type="text" id="cLoc" placeholder="Sucursal"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-card s-total"><div class="num" id="sTotal">0</div><div class="lbl">Total Productos</div></div>
        <div class="stat-card s-ok"><div class="num" id="sOk">0</div><div class="lbl">En Rango</div></div>
        <div class="stat-card s-low"><div class="num" id="sLow">0</div><div class="lbl">Bajo Minimo</div></div>
        <div class="stat-card s-high"><div class="num" id="sHigh">0</div><div class="lbl">Sobre Maximo</div></div>
    </div>

    <div class="prog-wrap">
        <div class="prog-lbl"><span>Progreso del conteo</span><strong id="pTxt">0 / 0</strong></div>
        <div class="prog-trk"><div class="prog-fill" id="pFill"></div></div>
    </div>

    <div class="legend">
        <span><i class="fas fa-circle lg-red"></i> Bajo minimo (reabastecer)</span>
        <span><i class="fas fa-circle lg-amber"></i> Sobre maximo (exceso)</span>
        <span><i class="fas fa-circle lg-ok"></i> En rango correcto</span>
    </div>

    <div class="search-bar">
        <i class="fas fa-search si"></i>
        <input type="text" id="searchInput" placeholder="Buscar producto...">
    </div>

    <nav class="tabs" id="navTabs">
        <button class="tab-btn on" data-tab="conteo"><i class="fas fa-pen"></i> Conteo</button>
        <button class="tab-btn" data-tab="historial"><i class="fas fa-clock-rotate-left"></i> Historial</button>
    </nav>

    <div class="tpanel on" id="p-conteo"><main id="invForm"></main></div>
    <div class="tpanel" id="p-historial"><div id="histCont"></div></div>
</div>

<div class="act-bar">
    <button class="btn btn-d" onclick="clearAll()"><i class="fas fa-eraser"></i> Limpiar</button>
    <button class="btn btn-s" onclick="saveCount()"><i class="fas fa-floppy-disk"></i> Guardar</button>
    <button class="btn btn-p" onclick="genReport()"><i class="fas fa-file-lines"></i> Vista / PDF</button>
</div>

<div class="modal-bg" id="rptModal">
    <div class="modal-box">
        <div class="modal-hd"><h2><i class="fas fa-file-lines"></i> Reporte de Conteo</h2><button class="modal-x" onclick="closeMod()"><i class="fas fa-xmark"></i></button></div>
        <div class="modal-bd"><div class="rpt" id="rptCont"></div></div>
        <div class="modal-ft">
            <button class="btn btn-s" onclick="closeMod()"><i class="fas fa-xmark"></i> Cerrar</button>
            <button class="btn btn-pr" onclick="printRpt()"><i class="fas fa-print"></i> Imprimir</button>
            <button class="btn btn-pf" onclick="dlPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
    </div>
</div>

<div id="printArea"></div>
<div class="toast-c" id="toastC"></div>

<script>
// ====================================================
// BASE DE DATOS - EXACTAMENTE los 158 productos enviados
// Sin códigos OP, solo nombre, min, max, unidad por defecto
// Unidades: Pza=piezas, Kg=kilos, L=litros
// ====================================================

]},
{c:"Salsas (Produccion)",clr:"#e74c3c",ico:"fa-pepper-hot",items:[

{n:"Salsa Hood Sauce (Produccion)",mn:1.68,mx:2.10,u:"Kg"},
{n:"Salsa Bufalo (Produccion)",mn:2.24,mx:2.80,u:"Kg"},
{n:"Salsa Korean Spicy (Produccion)",mn:1.68,mx:2.10,u:"Kg"},
{n:"Salsa Tonkatsu (Produccion)",mn:.96,mx:1.20,u:"Kg"},
{n:"Salsa Bbq Chipotle (Produccion)",mn:.96,mx:1.20,u:"Kg"},
{n:"Salsa Bbq Ciruela Piña (Produccion)",mn:.96,mx:1.20,u:"Kg"},

]},
{c:"Aderezos y Mermeladas (Produccion)",clr:"#9b59b6",ico:"fa-jar",items:[

const UNITS=["Pza","Kg","g","L","ml","Oz","Caja","Bolsa","Rollo","Paq"];

// ====== Funciones ======

function init(){document.getElementById('cDate').value=new Date().toISOString().split('T')[0];buildForm();renderHist()}

function fmtN(n){return n==null?'--':n.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2})}

// Construir formulario
function buildForm(){
    const C=document.getElementById('invForm');C.innerHTML='';
    let total=0;
    DB.forEach((cat,ci)=>{
        total+=cat.items.length;
        const sec=document.createElement('div');sec.className='cat-sec';
        sec.innerHTML=`<div class="cat-hd" onclick="togCat(${ci})"><div class="cat-dot" style="background:${cat.clr}"></div><span class="cat-nm"><i class="fas ${cat.ico}"></i> ${cat.c}</span><span class="cat-cnt" id="cc${ci}">${cat.items.length}</span><i class="fas fa-chevron-down ct" id="ct${ci}"></i></div><div class="cat-body" id="cb${ci}"></div>`;
        C.appendChild(sec);
        const body=sec.querySelector('.cat-body');
        cat.items.forEach((p,pi)=>{body.insertAdjacentHTML('beforeend',mkRow(ci,pi,p))});
    });
    // Conectar eventos
    C.querySelectorAll('input[type=number]').forEach(inp=>{
        inp.addEventListener('input',()=>{updRow(inp);updStats()});
    });
    document.getElementById('sTotal').textContent=total;
    updStats();
}

function mkRow(ci,pi,p){
    const opts=UNITS.map(u=>`<option value="${u}"${u===p.u?' selected':''}>${u}</option>`).join('');
    return `<div class="prow" id="r${ci}_${pi}" data-name="${p.n.toLowerCase()}">
        <div class="pn">${p.n}<div class="pr">Min: ${fmtN(p.mn)} / Max: ${fmtN(p.mx)}</div></div>
        <span class="badge" id="b${ci}_${pi}">--</span>
        <div class="igrp">
            <input type="number" id="q${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            <select class="usel" id="u${ci}_${pi}" data-c="${ci}" data-p="${pi}">${opts}</select>
        </div>
    </div>`;
}

// Actualizar color y badge de una fila
function updRow(inp){
    const ci=+inp.dataset.c, pi=+inp.dataset.p;
    const row=document.getElementById(`r${ci}_${pi}`);
    const badge=document.getElementById(`b${ci}_${pi}`);
    const val=parseFloat(inp.value);
    const p=DB[ci].items[pi];

    row.classList.remove('st-low','st-high','st-ok');

    if(isNaN(val)||val===0){badge.textContent='--';badge.style.background='';badge.style.color='';return}

    if(val<p.mn){
        row.classList.add('st-low');badge.textContent='BAJO';badge.style.background='var(--red)';badge.style.color='#fff';
    }else if(val>p.mx){
        row.classList.add('st-high');badge.textContent='EXCESO';badge.style.background='var(--amber)';badge.style.color='#1a1a1a';
    }else{
        row.classList.add('st-ok');badge.textContent='OK';badge.style.background='var(--green)';badge.style.color='#fff';
    }
}

// Actualizar estadísticas
function updStats(){
    let filled=0,low=0,high=0,ok=0,total=0;
    DB.forEach((cat,ci)=>{
        cat.items.forEach((p,pi)=>{
            total++;
            const inp=document.getElementById(`q${ci}_${pi}`);
            if(inp&&inp.value&&parseFloat(inp.value)>0){
                filled++;
                const v=parseFloat(inp.value);
                if(v<p.mn)low++;else if(v>p.mx)high++;else ok++;
            }
        });
    });
    const pct=total>0?(filled/total*100):0;
    document.getElementById('pFill').style.width=pct+'%';
    document.getElementById('pTxt').textContent=`${filled} / ${total}`;
    document.getElementById('sOk').textContent=ok;
    document.getElementById('sLow').textContent=low;
    document.getElementById('sHigh').textContent=high;
}

// Colapsar categoría
function togCat(ci){
    const body=document.getElementById(`cb${ci}`);
    const tog=document.getElementById(`ct${ci}`);
    body.classList.toggle('hide');
    tog.style.transform=body.classList.contains('hide')?'rotate(-90deg)':'';
}

// Buscador
document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    document.querySelectorAll('.prow').forEach(row=>{
        const name=row.dataset.name||'';
        row.classList.toggle('hidden',q!==''&&!name.includes(q));
    });
    // Mostrar/ocultar categorías vacías
    DB.forEach((cat,ci)=>{
        const body=document.getElementById(`cb${ci}`);
        if(!body)return;
        const visible=body.querySelectorAll('.prow:not(.hidden)');
        const sec=body.closest('.cat-sec');
        sec.style.display=visible.length===0&&q!==''?'none':'';
    });
});

// Recoger datos
function collect(){
    return{
        date:document.getElementById('cDate').value,
        resp:document.getElementById('cResp').value,
        loc:document.getElementById('cLoc').value,
        ts:new Date().toISOString(),
        cats:DB.map((cat,ci)=>({
            name:cat.c,clr:cat.clr,
            items:cat.items.map((p,pi)=>{
                const qi=document.getElementById(`q${ci}_${pi}`);
                const ui=document.getElementById(`u${ci}_${pi}`);
                const qty=qi?parseFloat(qi.value)||0:0;
                const unit=ui?ui.value:p.u;
                let status='--';
                if(qty>0){if(qty<p.mn)status='BAJO';else if(qty>p.mx)status='EXCESO';else status='OK'}
                return{n:p.n,mn:p.mn,mx:p.mx,qty,unit,status}
            })
        }))
    };
}

// Guardar
function saveCount(){
    const d=collect();
    if(!d.date){toast('Selecciona una fecha','err');return}
    const hasAny=d.cats.some(c=>c.items.some(p=>p.qty>0));
    if(!hasAny){toast('Ingresa al menos una cantidad','err');return}
    let h=JSON.parse(localStorage.getItem('invHist')||'[]');
    d.id='cnt_'+Date.now();
    d.summary={
        total:d.cats.reduce((s,c)=>s+c.items.length,0),
        filled:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.qty>0).length,0),
        low:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='BAJO').length,0),
        high:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='EXCESO').length,0),
        ok:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='OK').length,0)
    };
    h.unshift(d);localStorage.setItem('invHist',JSON.stringify(h));
    toast('Conteo guardado correctamente','ok');renderHist();
}

// Limpiar
function clearAll(){
    confirm2('¿Limpiar todos los campos del conteo actual?').then(y=>{
        if(!y)return;
        document.querySelectorAll('#invForm input[type=number]').forEach(inp=>{
            inp.value='';const row=inp.closest('.prow');
            row.classList.remove('st-low','st-high','st-ok');
            const badge=row.querySelector('.badge');badge.textContent='--';badge.style.background='';badge.style.color='';
        });
        document.getElementById('cResp').value='';document.getElementById('cLoc').value='';
        updStats();toast('Campos limpiados','ok');
    });
}

// Confirmación sin alert/confirm
function confirm2(msg){
    return new Promise(res=>{
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center';
        ov.innerHTML=`<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 24px;max-width:340px;text-align:center"><i class="fas fa-triangle-exclamation" style="font-size:1.6rem;color:var(--accent);margin-bottom:10px"></i><p style="color:var(--fg);font-size:.86rem;margin-bottom:14px">${msg}</p><div style="display:flex;gap:7px"><button class="btn btn-s" style="flex:1" id="cfN">Cancelar</button><button class="btn btn-d" style="flex:1" id="cfY">Confirmar</button></div></div>`;
        document.body.appendChild(ov);
        ov.querySelector('#cfY').onclick=()=>{ov.remove();res(true)};
        ov.querySelector('#cfN').onclick=()=>{ov.remove();res(false)};
    });
}

// ====== Reporte ======
function genReport(saved){
    const d=saved||collect();
    const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'Sin fecha';
    let tot=0,fill=0,low=0,high=0,ok=0,rows='';
    d.cats.forEach(cat=>{
        rows+=`<tr class="cr"><td colspan="6"><i class="fas fa-circle" style="font-size:6px;color:${cat.clr};margin-right:4px"></i>${cat.name}</td></tr>`;
        cat.items.forEach(p=>{
            tot++;
            let qd,sc='co';
            if(p.qty>0){
                fill++;
                if(p.status==='BAJO'||p.qty<p.mn){sc='cl';low++}
                else if(p.status==='EXCESO'||p.qty>p.mx){sc='ch';high++}
                else{ok++}
                qd=`<span class="${sc}">${fmtN(p.qty)}</span>`;
            }else{qd='<span class="ev">--</span>'}
            const stTxt=p.qty>0?(p.qty<p.mn?'<span style="color:#c0392b">BAJO</span>':p.qty>p.mx?'<span style="color:#d4880f">EXCESO</span>':'<span style="color:#3ab876">OK</span>'):'';
            rows+=`<tr><td style="padding-left:16px">${p.n}</td><td style="text-align:right">${fmtN(p.mn)}</td><td style="text-align:right">${fmtN(p.mx)}</td><td style="text-align:center">${p.unit}</td><td style="text-align:right">${qd}</td><td style="text-align:center;font-size:.66rem">${stTxt}</td></tr>`;
        });
    });
    document.getElementById('rptCont').innerHTML=`
        <div class="rh"><h2>CONTEO FISICO DE INVENTARIO</h2>
        <div class="rm"><span><strong>Fecha:</strong> ${ds}</span><span><strong>Responsable:</strong> ${d.resp||'No asignado'}</span><span><strong>Sede:</strong> ${d.loc||'No asignada'}</span></div></div>
        <table><thead><tr><th>Producto</th><th style="text-align:right">Min</th><th style="text-align:right">Max</th><th style="text-align:center">Unidad</th><th style="text-align:right">Cantidad</th><th style="text-align:center">Estado</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="tr"><td colspan="2">Total: ${tot} | Contados: ${fill}</td><td>OK: ${ok}</td><td>Bajo: ${low}</td><td style="text-align:right">Exceso: ${high}</td><td style="text-align:center">${Math.round(fill/tot*100)}%</td></tr></tfoot></table>`;
    document.getElementById('rptModal').classList.add('show');
}

function closeMod(){document.getElementById('rptModal').classList.remove('show')}
function printRpt(){
    const c=document.getElementById('rptCont').innerHTML;
    const pa=document.getElementById('printArea');
    pa.innerHTML=`<div class="rpt" style="padding:14px;font-family:'DM Sans',sans-serif;color:#1a1a1a">${c}</div>`;
    pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none'},800);
}
function dlPDF(){
    const dv=document.getElementById('cDate').value||'sin_fecha';
    html2pdf().set({margin:[8,8,8,8],filename:`conteo_inventario_${dv}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}}).from(document.getElementById('rptCont')).save();
    toast('PDF generado','ok');
}

// ====== Historial ======
function renderHist(){
    const C=document.getElementById('histCont');
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');
    if(!h.length){C.innerHTML='<div class="empty"><i class="fas fa-clock-rotate-left"></i><h3>Sin registros</h3><p>Guarda un conteo para verlo aqui</p></div>';return}
    C.innerHTML='<div class="hlist">'+h.map((item,i)=>{
        const dt=new Date(item.ts).toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        const s=item.summary||{};
        return`<div class="hcard" onclick="viewHist(${i})"><div class="hico"><i class="fas fa-clipboard-check"></i></div><div class="hinfo"><h4>${item.date||'Sin fecha'}</h4><p>${item.resp||'Sin responsable'} · ${item.loc||'Sin sede'} · ${s.filled||0}/${s.total||0} contados · ${s.low||0} bajo · ${s.high||0} exceso</p></div><div class="hacts"><button onclick="event.stopPropagation();loadHist(${i})" title="Cargar"><i class="fas fa-upload"></i></button><button class="del" onclick="event.stopPropagation();delHist(${i})" title="Eliminar"><i class="fas fa-trash"></i></button></div></div>`
    }).join('')+'</div>';
}

function viewHist(i){const h=JSON.parse(localStorage.getItem('invHist')||'[]');if(h[i])genReport(h[i])}

function loadHist(i){
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');const item=h[i];if(!item)return;
    document.getElementById('cDate').value=item.date||'';
    document.getElementById('cResp').value=item.resp||'';
    document.getElementById('cLoc').value=item.loc||'';
    item.cats.forEach((cat,ci)=>{
        if(!DB[ci])return;
        cat.items.forEach((p,pi)=>{
            if(!DB[ci].items[pi])return;
            const qi=document.getElementById(`q${ci}_${pi}`);
            const ui=document.getElementById(`u${ci}_${pi}`);
            if(qi){qi.value=p.qty>0?p.qty:'';updRow(qi)}
            if(ui)ui.value=p.unit;
        });
    });
    updStats();
    // Cambiar a tab conteo
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab=conteo]').classList.add('on');
    document.getElementById('p-conteo').classList.add('on');
    toast('Registro cargado','ok');
}

function delHist(i){
    confirm2('¿Eliminar este registro del historial?').then(y=>{
        if(!y)return;
        let h=JSON.parse(localStorage.getItem('invHist')||'[]');
        h.splice(i,1);localStorage.setItem('invHist',JSON.stringify(h));
        renderHist();toast('Registro eliminado','ok');
    });
}

// ====== Navegación tabs ======
document.querySelectorAll('.tab-btn').forEach(t=>{
    t.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
        document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
        t.classList.add('on');
        document.getElementById('p-'+t.dataset.tab).classList.add('on');
        if(t.dataset.tab==='historial')renderHist();
    });
});

// ====== Toast ======
function toast(msg,type='ok'){
    const C=document.getElementById('toastC');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const ic=type==='ok'?'fa-check-circle':'fa-exclamation-circle';
    t.innerHTML=`<i class="fas ${ic}"></i><span>${msg}</span>`;
    C.appendChild(t);setTimeout(()=>t.remove(),3100);
}

// Cerrar modal
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
document.getElementById('rptModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMod()});

// Iniciar
init();
</script>
</body>
</html>
