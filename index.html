<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteo Fisico de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* ============================================================
       FOUNDRY STYLE — dark canvas, monospace chrome, sharp corners
       Accent: ember green (replaces orange #ff4d00 -> #55C800)
       ============================================================ */
    :root{
        /* Foundry neutrals */
        --canvas:#121212;
        --canvas-2:#171717;
        --canvas-3:#1c1c1c;
        --bone:#efefef;
        --chalk:#e2e8f0;
        --soot:#3a3a3a;
        --ash:#747474;

        /* Ember GREEN (accent) — replaces #ff4d00 */
        --ember:#55C800;
        --ember-2:#48aa00;
        --ember-3:#3c8c00;
        --ember-soft:rgba(85,200,0,.12);
        --ember-line:rgba(85,200,0,.55);

        /* Status colors */
        --red:#ef4444;
        --amber:#f59e0b;
        --ok:#22c55e;

        /* Border hairlines — chalk at low opacity */
        --hair:rgba(226,232,240,.14);
        --hair-strong:rgba(226,232,240,.28);
        --hair-softer:rgba(226,232,240,.08);

        /* Radii — signature sharp */
        --r-sm:2.8px;
        --r-lg:8px;

        /* Motion — brisk */
        --ease:cubic-bezier(0,0,.2,1);
        --dur:.2s;

        /* Fonts */
        --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
        --sans:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
        font-family:var(--mono);
        background:var(--canvas);
        color:var(--bone);
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-size:14px;
        line-height:1.4;
        letter-spacing:-.005em;
    }

    /* ============ BACKGROUND (subtle ember glow, no texture) ============ */
    .bg-fx{
        position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
        background:
            radial-gradient(900px 500px at 0% 0%, rgba(85,200,0,.045), transparent 60%),
            radial-gradient(700px 500px at 100% 100%, rgba(85,200,0,.025), transparent 60%),
            var(--canvas);
    }
    .bg-fx .o{display:none}

    /* ============ LAYOUT ============ */
    .wrap{
        position:relative;z-index:1;
        max-width:1200px;margin:0 auto;
        padding:20px 20px 130px;
    }

    /* ============ HEADER — Foundry title block ============ */
    header{
        display:flex;align-items:flex-start;gap:18px;
        padding:22px 22px 22px;
        background:var(--canvas-2);
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        margin-bottom:20px;
        position:relative;
    }
    header::before{
        content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
        background:var(--ember);
    }
    header .ico{
        width:52px;height:52px;
        background:transparent;
        border:1px solid var(--ember);
        border-radius:var(--r-sm);
        display:flex;align-items:center;justify-content:center;
        font-size:20px;color:var(--ember);
        flex-shrink:0;
        transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    header .ico:hover{background:var(--ember);color:var(--canvas)}
    header .htxt{flex:1;min-width:0}
    header h1{
        font-family:var(--mono);
        font-size:clamp(1rem,2.4vw,1.35rem);
        font-weight:700;
        letter-spacing:.14em;
        text-transform:uppercase;
        line-height:1.15;
        color:var(--bone);
    }
    header h1 .dot{color:var(--ember)}
    header p{
        color:var(--ash);
        margin-top:6px;
        font-size:12px;
        font-weight:400;
        text-transform:uppercase;
        letter-spacing:.06em;
        line-height:1.5;
    }
    header .badge-top{
        font-size:10px;
        color:var(--ember);
        text-transform:uppercase;
        letter-spacing:.14em;
        font-weight:700;
        border:1px solid var(--ember-line);
        padding:5px 9px;
        border-radius:var(--r-sm);
        flex-shrink:0;
        align-self:flex-start;
    }

    /* ============ TOP FORM (metadata strip) ============ */
    .top-row{
        display:flex;gap:0;flex-wrap:wrap;
        margin-bottom:20px;
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        overflow:hidden;
        background:var(--canvas-2);
    }
    .top-row .fld{
        flex:1;min-width:160px;
        padding:12px 16px;
        border-right:1px solid var(--hair);
        transition:background var(--dur) var(--ease);
    }
    .top-row .fld:last-child{border-right:0}
    .top-row .fld:hover{background:rgba(255,255,255,.015)}
    .top-row label{
        display:block;
        font-family:var(--mono);
        font-size:10px;
        color:var(--ash);
        text-transform:uppercase;
        letter-spacing:.14em;
        font-weight:700;
        margin-bottom:6px;
    }
    .top-row input{
        width:100%;
        background:transparent;
        border:0;
        border-bottom:1px solid var(--hair);
        padding:4px 0 6px;
        color:var(--bone);
        font-family:var(--mono);
        font-size:13px;
        outline:none;
        border-radius:0;
        transition:border-color var(--dur) var(--ease);
    }
    .top-row input:hover{border-bottom-color:var(--hair-strong)}
    .top-row input:focus{border-bottom-color:var(--ember)}
    .top-row input::placeholder{color:var(--soot);font-size:12px}

    /* ============ STATS STRIP ============ */
    .stats-bar{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:0;
        margin-bottom:20px;
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        overflow:hidden;
        background:var(--canvas-2);
    }
    .stat-card{
        padding:16px 18px;
        border-right:1px solid var(--hair);
        transition:background var(--dur) var(--ease);
        position:relative;
    }
    .stat-card:last-child{border-right:0}
    .stat-card:hover{background:rgba(255,255,255,.015)}
    .stat-card .num{
        font-family:var(--mono);
        font-size:1.65rem;
        font-weight:700;
        line-height:1;
        letter-spacing:-.02em;
    }
    .stat-card .lbl{
        font-family:var(--mono);
        font-size:10px;
        color:var(--ash);
        text-transform:uppercase;
        letter-spacing:.14em;
        margin-top:8px;
        font-weight:400;
    }
    .stat-card.s-total .num{color:var(--ember)}
    .stat-card.s-ok .num{color:var(--ok)}
    .stat-card.s-low .num{color:var(--red)}
    .stat-card.s-high .num{color:var(--amber)}

    /* ============ PROGRESS ============ */
    .prog-wrap{
        margin-bottom:20px;
        padding:14px 18px;
        background:var(--canvas-2);
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
    }
    .prog-lbl{
        display:flex;justify-content:space-between;
        font-family:var(--mono);
        font-size:11px;color:var(--ash);
        text-transform:uppercase;letter-spacing:.1em;
        margin-bottom:10px;font-weight:400;
    }
    .prog-lbl strong{
        color:var(--ember);
        font-size:12px;font-weight:700;
        letter-spacing:.06em;
    }
    .prog-trk{
        height:4px;
        background:var(--soot);
        border-radius:0;
        overflow:hidden;
    }
    .prog-fill{
        height:100%;
        background:var(--ember);
        border-radius:0;
        transition:width .35s var(--ease);
        width:0%;
    }

    /* ============ LEGEND ============ */
    .legend{
        display:flex;gap:22px;flex-wrap:wrap;
        margin-bottom:20px;
        padding:11px 18px;
        background:transparent;
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        font-family:var(--mono);
        font-size:11px;
        color:var(--ash);
        text-transform:uppercase;
        letter-spacing:.06em;
        font-weight:400;
    }
    .legend i{margin-right:6px;font-size:8px;vertical-align:middle}
    .lg-red{color:var(--red)}
    .lg-amber{color:var(--amber)}
    .lg-ok{color:var(--ok)}

    /* ============ SEARCH ============ */
    .search-bar{position:relative;margin-bottom:20px}
    .search-bar input{
        width:100%;
        padding:12px 16px 12px 42px;
        background:var(--canvas-2);
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        color:var(--bone);
        font-family:var(--mono);
        font-size:13px;
        outline:none;
        letter-spacing:.01em;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .search-bar input:hover{border-color:var(--hair-strong)}
    .search-bar input:focus{border-color:var(--ember);background:var(--canvas-3)}
    .search-bar input::placeholder{
        color:var(--soot);
        text-transform:uppercase;
        letter-spacing:.06em;
        font-size:11px;
    }
    .search-bar .si{
        position:absolute;left:15px;top:50%;transform:translateY(-50%);
        color:var(--ash);font-size:.8rem;pointer-events:none;
    }

    /* ============ TABS — tag-like nav ============ */
    .tabs{
        display:flex;gap:6px;margin-bottom:22px;
        padding:0;
        background:transparent;
        border:0;
        border-radius:0;
    }
    .tab-btn{
        padding:9px 16px;
        background:transparent;
        border:1px solid var(--hair);
        border-radius:var(--r-sm);
        color:var(--ash);
        font-family:var(--mono);
        font-size:11px;
        font-weight:400;
        text-transform:uppercase;
        letter-spacing:.14em;
        cursor:pointer;
        transition:all var(--dur) var(--ease);
        white-space:nowrap;
        display:inline-flex;align-items:center;gap:7px;
    }
    .tab-btn i{font-size:.7rem}
    .tab-btn:hover{
        color:var(--bone);
        border-color:var(--hair-strong);
    }
    .tab-btn.on{
        color:var(--canvas);
        background:var(--bone);
        border-color:var(--bone);
        font-weight:700;
    }
    .tpanel{display:none;animation:fi .2s var(--ease)}
    .tpanel.on{display:block}
    @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

    /* ============ CATEGORY SECTION ============ */
    .cat-sec{
        margin-bottom:16px;
        background:var(--canvas-2);
        border:1px solid var(--hair);
        border-radius:var(--r-lg);
        padding:0;
        overflow:hidden;
        transition:border-color var(--dur) var(--ease);
    }
    .cat-sec:hover{border-color:var(--hair-strong)}
    .cat-hd{
        display:flex;align-items:center;gap:12px;
        padding:12px 18px;
        cursor:pointer;user-select:none;
        border-bottom:1px solid var(--hair);
        transition:background var(--dur) var(--ease);
    }
    .cat-hd:hover{background:rgba(255,255,255,.015)}
    .cat-dot{
        width:6px;height:6px;border-radius:0;
        flex-shrink:0;
    }
    .cat-nm{
        font-family:var(--mono);
        font-size:12px;
        font-weight:700;
        letter-spacing:.14em;
        color:var(--bone);
        text-transform:uppercase;
        transition:color var(--dur) var(--ease);
        display:inline-flex;align-items:center;gap:10px;
    }
    .cat-nm i{color:var(--ember);font-size:.72rem}
    .cat-hd:hover .cat-nm{color:var(--ember)}
    .cat-cnt{
        font-family:var(--mono);
        font-size:10px;
        color:var(--ash);
        border:1px solid var(--hair);
        padding:2px 8px;
        border-radius:var(--r-sm);
        margin-left:auto;
        font-weight:400;
        letter-spacing:.08em;
    }
    .ct{
        color:var(--ash);font-size:.65rem;
        transition:transform var(--dur) var(--ease),color var(--dur) var(--ease);
        margin-left:4px;
    }
    .cat-hd:hover .ct{color:var(--ember)}
    .cat-body{padding:12px 12px 4px;transition:opacity var(--dur) var(--ease)}
    .cat-body.hide{display:none}

    /* ============ PRODUCT ROW — flat, hairline-bordered ============ */
    .prow{
        display:flex;align-items:center;gap:14px;
        padding:12px 14px;
        background:transparent;
        border:1px solid var(--hair);
        border-left:2px solid transparent;
        border-radius:var(--r-sm);
        margin-bottom:6px;
        transition:all var(--dur) var(--ease);
        flex-wrap:wrap;
    }
    .prow:hover{
        background:rgba(255,255,255,.02);
        border-color:var(--hair-strong);
        border-left-color:var(--hair-strong);
    }
    .prow.st-low{
        border-left-color:var(--red);
    }
    .prow.st-low .badge{
        color:var(--red);border-color:var(--red);
    }
    .prow.st-high{
        border-left-color:var(--amber);
    }
    .prow.st-high .badge{
        color:var(--amber);border-color:var(--amber);
    }
    .prow.st-ok{
        border-left-color:var(--ok);
    }
    .prow.st-ok .badge{
        color:var(--ok);border-color:var(--ok);
    }
    .prow.hidden{display:none}

    .pinfo{flex:1 1 220px;min-width:0}
    .pname{
        font-family:var(--mono);
        font-size:12.5px;
        font-weight:700;
        letter-spacing:.04em;
        color:var(--bone);
        line-height:1.3;
        text-transform:uppercase;
    }
    .ppres{
        font-family:var(--mono);
        font-size:10.5px;
        color:var(--ash);
        margin-top:5px;
        line-height:1.5;
        font-weight:400;
        letter-spacing:.04em;
        display:flex;align-items:center;gap:8px;flex-wrap:wrap;
        text-transform:uppercase;
    }
    .ppres > i{color:var(--ember);font-size:.65rem;flex-shrink:0}
    .ppres .tag{
        color:var(--ember);
        border:1px solid var(--ember-line);
        padding:1px 6px;
        border-radius:var(--r-sm);
        font-size:9.5px;
        font-weight:700;
        letter-spacing:.08em;
    }
    .ppres .minmax{
        color:var(--soot);
        font-size:9.5px;
        letter-spacing:.06em;
    }

    .pinputs{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
    .icell{display:flex;flex-direction:column;gap:4px}
    .ilabel{
        font-family:var(--mono);
        font-size:9.5px;
        color:var(--ash);
        text-transform:uppercase;
        letter-spacing:.14em;
        font-weight:700;
        text-align:center;
    }
    .icell input{
        width:70px;
        padding:8px 6px;
        background:var(--canvas);
        border:1px solid var(--hair);
        border-radius:var(--r-sm);
        color:var(--bone);
        font-family:var(--mono);
        font-size:13px;
        font-weight:700;
        text-align:center;
        outline:0;
        transition:all var(--dur) var(--ease);
        -moz-appearance:textfield;
        letter-spacing:.02em;
    }
    .icell input:hover{border-color:var(--hair-strong)}
    .icell input:focus{
        border-color:var(--ember);
        background:var(--canvas-3);
        box-shadow:0 0 0 3px var(--ember-soft);
    }
    .icell input::placeholder{color:var(--soot);font-weight:400}
    .icell input::-webkit-inner-spin-button,
    .icell input::-webkit-outer-spin-button{-webkit-appearance:none}

    /* Total box — outlined ember, no fill (Foundry CTA style) */
    .total-box{
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:1px;
        padding:6px 12px;min-width:88px;
        background:transparent;
        border:1px solid var(--ember-line);
        border-radius:var(--r-sm);
        transition:all var(--dur) var(--ease);
    }
    .total-box .tlabel{
        font-family:var(--mono);
        font-size:9px;
        color:var(--ember);
        text-transform:uppercase;
        letter-spacing:.14em;
        font-weight:700;
    }
    .total-box .tval{
        font-family:var(--mono);
        font-size:1.05rem;
        font-weight:700;
        color:var(--ember);
        line-height:1.1;
        letter-spacing:-.01em;
    }
    .total-box .tunit{
        font-family:var(--mono);
        font-size:9px;
        color:var(--ember);
        opacity:.7;
        font-weight:400;
        letter-spacing:.08em;
        text-transform:uppercase;
    }
    .prow.st-low .total-box{border-color:var(--red)}
    .prow.st-low .total-box .tlabel,
    .prow.st-low .total-box .tval,
    .prow.st-low .total-box .tunit{color:var(--red)}
    .prow.st-high .total-box{border-color:var(--amber)}
    .prow.st-high .total-box .tlabel,
    .prow.st-high .total-box .tval,
    .prow.st-high .total-box .tunit{color:var(--amber)}
    .prow.st-ok .total-box{border-color:var(--ok)}
    .prow.st-ok .total-box .tlabel,
    .prow.st-ok .total-box .tval,
    .prow.st-ok .total-box .tunit{color:var(--ok)}

    .badge{
        font-family:var(--mono);
        font-size:9.5px;
        padding:4px 9px;
        border-radius:var(--r-sm);
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.14em;
        background:transparent;
        border:1px solid var(--hair);
        color:var(--ash);
        flex-shrink:0;white-space:nowrap;
        transition:all var(--dur) var(--ease);
        align-self:center;
    }

    /* ============ ACTION BAR ============ */
    .act-bar{
        position:fixed;bottom:0;left:0;right:0;
        padding:16px 20px 18px;
        background:linear-gradient(to top, var(--canvas) 60%, rgba(18,18,18,0));
        display:flex;gap:8px;flex-wrap:wrap;
        z-index:10;
        justify-content:center;
        max-width:1200px;margin:0 auto;
    }
    .btn{
        display:inline-flex;align-items:center;gap:8px;
        padding:11px 18px;
        border:1px solid transparent;
        border-radius:var(--r-sm);
        font-family:var(--mono);
        font-size:11px;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.14em;
        cursor:pointer;
        transition:all var(--dur) var(--ease);
        background:transparent;
        color:var(--bone);
    }
    .btn:active{transform:translateY(1px)}
    .btn i{font-size:.75rem}

    /* Primary — bone white fill (inverted) */
    .btn-p{
        background:var(--bone);
        color:var(--canvas);
        border-color:var(--bone);
    }
    .btn-p:hover{
        background:var(--ember);
        border-color:var(--ember);
        color:var(--canvas);
    }

    /* Secondary — ghost outline bone */
    .btn-s{
        background:transparent;
        color:var(--bone);
        border-color:var(--hair-strong);
    }
    .btn-s:hover{
        border-color:var(--bone);
        color:var(--bone);
    }

    /* Danger — outlined red */
    .btn-d{
        background:transparent;
        color:var(--red);
        border-color:rgba(239,68,68,.4);
    }
    .btn-d:hover{
        border-color:var(--red);
        background:var(--red);
        color:var(--canvas);
    }

    .act-bar .btn{flex:1;min-width:120px;justify-content:center}

    /* ============ MODAL — inverted bone panel ============ */
    .modal-bg{
        display:none;position:fixed;inset:0;
        background:rgba(0,0,0,.78);
        backdrop-filter:blur(4px);
        -webkit-backdrop-filter:blur(4px);
        z-index:1000;
        justify-content:center;align-items:flex-start;
        padding:20px;overflow-y:auto;
        animation:p-fadein .2s var(--ease);
    }
    .modal-bg.show{display:flex}
    .modal-box{
        background:var(--canvas-2);
        color:var(--bone);
        border:1px solid var(--hair-strong);
        border-radius:var(--r-lg);
        width:100%;max-width:980px;margin-top:16px;
        animation:mi .25s var(--ease);
        overflow:hidden;
    }
    @keyframes mi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes p-fadein{0%{opacity:0}100%{opacity:1}}
    .modal-hd{
        display:flex;align-items:center;justify-content:space-between;
        padding:16px 20px;
        border-bottom:1px solid var(--hair);
    }
    .modal-hd h2{
        font-family:var(--mono);
        font-size:12px;
        font-weight:700;
        color:var(--bone);
        letter-spacing:.14em;
        text-transform:uppercase;
        display:flex;align-items:center;gap:10px;
    }
    .modal-hd h2 i{color:var(--ember);font-size:.9rem}
    .modal-x{
        width:32px;height:32px;
        background:transparent;
        border:1px solid var(--hair);
        border-radius:var(--r-sm);
        font-size:.85rem;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        color:var(--ash);
        transition:all var(--dur) var(--ease);
    }
    .modal-x:hover{border-color:var(--ember);color:var(--ember)}
    .modal-bd{padding:20px;max-height:66vh;overflow-y:auto}
    .modal-ft{
        display:flex;gap:8px;padding:14px 20px;
        border-top:1px solid var(--hair);
        background:var(--canvas);
    }
    .modal-ft .btn{flex:1;justify-content:center}

    /* ============ REPORT ============ */
    .rpt{
        font-family:var(--mono);
        color:var(--bone);
        font-size:11.5px;
    }
    .rpt .rh{
        text-align:left;
        margin-bottom:20px;
        padding-bottom:14px;
        border-bottom:1px solid var(--hair);
    }
    .rpt .rh h2{
        font-family:var(--mono);
        font-size:14px;font-weight:700;
        letter-spacing:.14em;
        text-transform:uppercase;
        color:var(--bone);
    }
    .rpt .rh h2::before{
        content:'// ';color:var(--ember);
    }
    .rpt .rm{
        display:flex;justify-content:flex-start;flex-wrap:wrap;
        gap:24px;margin-top:10px;
        font-size:10.5px;color:var(--ash);
        text-transform:uppercase;letter-spacing:.06em;
    }
    .rpt .rm strong{color:var(--ember);font-weight:700;margin-right:5px}
    .rpt table{width:100%;border-collapse:collapse;font-size:10.5px}
    .rpt thead th{
        background:transparent;
        color:var(--ash);
        padding:8px 6px;
        text-align:left;
        font-weight:700;
        font-size:9.5px;
        text-transform:uppercase;
        letter-spacing:.14em;
        border-bottom:1px solid var(--hair-strong);
    }
    .rpt .cr td{
        background:rgba(85,200,0,.05);
        padding:8px 6px;
        font-weight:700;
        font-size:10.5px;
        color:var(--ember);
        text-transform:uppercase;
        letter-spacing:.14em;
        border-bottom:1px solid var(--hair);
    }
    .rpt tbody td{
        padding:7px 6px;
        border-bottom:1px solid var(--hair-softer);
        color:var(--bone);
        vertical-align:top;
    }
    .rpt tbody tr:hover td{background:rgba(255,255,255,.015)}
    .rpt .pres{font-size:9.5px;color:var(--ash);letter-spacing:.04em;text-transform:uppercase}
    .rpt .cl{color:var(--red);font-weight:700}
    .rpt .ch{color:var(--amber);font-weight:700}
    .rpt .co{color:var(--ember);font-weight:700}
    .rpt .ev{color:var(--soot);font-style:normal}
    .rpt .tr td{
        background:transparent;
        color:var(--ember);
        padding:11px 6px;
        font-weight:700;
        font-size:10.5px;
        text-transform:uppercase;
        letter-spacing:.14em;
        border-top:1px solid var(--ember-line);
        border-bottom:0;
    }

    /* ============ HISTORY ============ */
    .hlist{display:flex;flex-direction:column;gap:6px}
    .hcard{
        background:transparent;
        border:1px solid var(--hair);
        border-left:2px solid transparent;
        border-radius:var(--r-sm);
        padding:14px 18px;
        cursor:pointer;
        transition:all var(--dur) var(--ease);
        display:flex;align-items:center;gap:14px;
    }
    .hcard:hover{
        background:rgba(255,255,255,.02);
        border-color:var(--hair-strong);
        border-left-color:var(--ember);
    }
    .hico{
        width:40px;height:40px;
        border:1px solid var(--ember-line);
        border-radius:var(--r-sm);
        display:flex;align-items:center;justify-content:center;
        color:var(--ember);font-size:.9rem;flex-shrink:0;
        transition:all var(--dur) var(--ease);
    }
    .hcard:hover .hico{background:var(--ember);color:var(--canvas)}
    .hinfo{flex:1;min-width:0}
    .hinfo h4{
        font-family:var(--mono);
        font-size:12px;font-weight:700;
        color:var(--bone);
        letter-spacing:.06em;
        text-transform:uppercase;
    }
    .hinfo p{
        font-family:var(--mono);
        font-size:10px;color:var(--ash);
        margin-top:4px;
        letter-spacing:.06em;
        text-transform:uppercase;
        line-height:1.5;
    }
    .hacts{display:flex;gap:4px}
    .hacts button{
        width:30px;height:30px;
        background:transparent;
        border:1px solid var(--hair);
        border-radius:var(--r-sm);
        color:var(--ash);cursor:pointer;font-size:.72rem;
        transition:all var(--dur) var(--ease);
    }
    .hacts button:hover{
        color:var(--ember);
        border-color:var(--ember);
    }
    .hacts button.del:hover{
        color:var(--red);
        border-color:var(--red);
    }

    /* ============ EMPTY ============ */
    .empty{
        text-align:center;padding:56px 16px;color:var(--ash);
        border:1px dashed var(--hair);
        border-radius:var(--r-lg);
    }
    .empty i{
        font-size:2rem;margin-bottom:14px;
        color:var(--ember);opacity:.5;
    }
    .empty h3{
        font-family:var(--mono);
        font-size:12px;margin-bottom:6px;
        color:var(--bone);font-weight:700;
        text-transform:uppercase;letter-spacing:.14em;
    }
    .empty p{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}

    /* ============ TOAST ============ */
    .toast-c{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:6px}
    .toast{
        background:var(--canvas-2);
        border:1px solid var(--hair-strong);
        border-radius:var(--r-sm);
        padding:11px 16px;
        font-family:var(--mono);
        font-size:11px;color:var(--bone);
        display:flex;align-items:center;gap:10px;
        animation:moveinright .25s var(--ease), to .25s var(--ease) 2.7s forwards;
        min-width:230px;
        letter-spacing:.06em;
        text-transform:uppercase;
    }
    .toast.ok{border-left:2px solid var(--ember)}
    .toast.err{border-left:2px solid var(--red)}
    .toast.ok i{color:var(--ember)}
    .toast.err i{color:var(--red)}
    @keyframes moveinright{0%{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes to{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

    /* ============ CONFIRM MODAL — reuse modal chrome ============ */
    .cfbox{
        background:var(--canvas-2);
        border:1px solid var(--hair-strong);
        border-radius:var(--r-lg);
        padding:24px;max-width:380px;width:100%;
        text-align:left;
    }
    .cfbox .cfico{
        width:44px;height:44px;
        border:1px solid var(--ember-line);
        border-radius:var(--r-sm);
        display:flex;align-items:center;justify-content:center;
        margin-bottom:14px;
        color:var(--ember);font-size:1.05rem;
    }
    .cfbox .cfmsg{
        font-family:var(--mono);
        font-size:12px;color:var(--bone);
        margin-bottom:20px;font-weight:400;
        line-height:1.5;
        text-transform:uppercase;
        letter-spacing:.06em;
    }
    .cfbox .cfact{display:flex;gap:8px}
    .cfbox .cfact .btn{flex:1;justify-content:center}

    /* ============ RESPONSIVE ============ */
    @media(max-width:720px){
        .wrap{padding:14px 14px 120px}
        header{padding:18px}
        header .badge-top{display:none}
        .stats-bar{grid-template-columns:repeat(2,1fr)}
        .stat-card{border-right:0}
        .stat-card:nth-child(1),
        .stat-card:nth-child(3){border-right:1px solid var(--hair)}
        .stat-card:nth-child(1),
        .stat-card:nth-child(2){border-bottom:1px solid var(--hair)}
        .prow{flex-direction:column;align-items:stretch;gap:10px;padding:12px}
        .pinfo{flex:0 0 auto}
        .pinputs{justify-content:flex-start;width:100%}
        .icell input{width:64px}
        .total-box{min-width:80px}
        .modal-bd{padding:16px}
        .modal-hd,.modal-ft{padding:12px 16px}
        .tab-btn{padding:8px 12px;font-size:10px}
        .btn{padding:10px 14px;font-size:10px}
        .act-bar{padding:12px 12px 14px;gap:6px}
        .act-bar .btn{min-width:90px}
        .rpt table{font-size:9.5px}
        .rpt thead th{padding:6px 4px;font-size:8.5px}
        .rpt tbody td{padding:5px 4px}
    }
    @media(max-width:420px){
        header h1{font-size:.9rem;letter-spacing:.1em}
        header p{font-size:10px}
        header .ico{width:44px;height:44px;font-size:16px}
        .stat-card .num{font-size:1.3rem}
        .stat-card .lbl{font-size:9px}
        .legend{gap:14px;font-size:10px}
        .legend span:nth-child(2){display:none}
        .icell input{width:56px;font-size:12px}
        .total-box .tval{font-size:.9rem}
        .hacts button{width:26px;height:26px}
        .hico{width:34px;height:34px;font-size:.75rem}
    }
    @media print{
        body{background:#fff!important}
        .wrap,.modal-bg,.bg-fx,.toast-c,.act-bar,.tabs{display:none!important}
        #printArea{display:block!important;position:fixed;inset:0;background:#fff;z-index:99999;padding:14px;color:#121212}
        #printArea .rpt{color:#121212}
        #printArea .rpt .rh h2{color:#121212}
        #printArea .rpt .rh h2::before{color:#121212}
        #printArea .rpt .rm{color:#555}
        #printArea .rpt .rm strong{color:#121212}
        #printArea .rpt thead th{color:#121212;border-bottom:2px solid #121212}
        #printArea .rpt .cr td{background:#f0f0f0;color:#121212;border-bottom:1px solid #ccc}
        #printArea .rpt tbody td{color:#121212;border-bottom:1px solid #e0e0e0}
        #printArea .rpt .pres{color:#555}
        #printArea .rpt .cl{color:#c0392b}
        #printArea .rpt .ch{color:#b45309}
        #printArea .rpt .co{color:#3c8c00}
        #printArea .rpt .tr td{color:#121212;border-top:2px solid #121212}
    }
    #printArea{display:none}

    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--canvas)}
    ::-webkit-scrollbar-thumb{background:var(--soot);border-radius:0}
    ::-webkit-scrollbar-thumb:hover{background:var(--ember)}

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
            transform:none!important;
        }
    }
</style>
</head>
<body>
<div class="bg-fx"></div>
<div class="wrap">
    <header>
        <div class="ico"><i class="fas fa-clipboard-check"></i></div>
        <div class="htxt">
            <h1>Conteo Fisico de Inventario<span class="dot">.</span></h1>
            <p>Registra paquetes + piezas sueltas · El total se calcula automaticamente</p>
        </div>
        <span class="badge-top">v1.0 / LIVE</span>
    </header>

    <div class="top-row">
        <div class="fld"><label>Fecha</label><input type="date" id="cDate"></div>
        <div class="fld"><label>Responsable</label><input type="text" id="cResp" placeholder="NOMBRE"></div>
        <div class="fld"><label>Sede</label><input type="text" id="cLoc" placeholder="SUCURSAL"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-card s-total"><div class="num" id="sTotal">0</div><div class="lbl">Total Productos</div></div>
        <div class="stat-card s-ok"><div class="num" id="sOk">0</div><div class="lbl">En Rango</div></div>
        <div class="stat-card s-low"><div class="num" id="sLow">0</div><div class="lbl">Bajo Minimo</div></div>
        <div class="stat-card s-high"><div class="num" id="sHigh">0</div><div class="lbl">Sobre Maximo</div></div>
    </div>

    <div class="prog-wrap">
        <div class="prog-lbl"><span>Progreso del conteo</span><strong id="pTxt">0 / 0</strong></div>
        <div class="prog-trk"><div class="prog-fill" id="pFill"></div></div>
    </div>

    <div class="legend">
        <span><i class="fas fa-square lg-red"></i> Bajo minimo</span>
        <span><i class="fas fa-square lg-amber"></i> Sobre maximo</span>
        <span><i class="fas fa-square lg-ok"></i> En rango correcto</span>
    </div>

    <div class="search-bar">
        <i class="fas fa-search si"></i>
        <input type="text" id="searchInput" placeholder="Buscar producto o presentacion">
    </div>

    <nav class="tabs" id="navTabs">
        <button class="tab-btn on" data-tab="conteo"><i class="fas fa-pen"></i> Conteo</button>
        <button class="tab-btn" data-tab="historial"><i class="fas fa-clock-rotate-left"></i> Historial</button>
    </nav>

    <div class="tpanel on" id="p-conteo"><main id="invForm"></main></div>
    <div class="tpanel" id="p-historial"><div id="histCont"></div></div>
</div>

<div class="act-bar">
    <button class="btn btn-d" onclick="clearAll()"><i class="fas fa-eraser"></i> Limpiar</button>
    <button class="btn btn-s" onclick="saveCount()"><i class="fas fa-floppy-disk"></i> Guardar</button>
    <button class="btn btn-p" onclick="genReport()"><i class="fas fa-file-lines"></i> Vista / PDF</button>
</div>

<div class="modal-bg" id="rptModal">
    <div class="modal-box">
        <div class="modal-hd"><h2><i class="fas fa-file-lines"></i> Reporte de Conteo</h2><button class="modal-x" onclick="closeMod()"><i class="fas fa-xmark"></i></button></div>
        <div class="modal-bd"><div class="rpt" id="rptCont"></div></div>
        <div class="modal-ft">
            <button class="btn btn-s" onclick="closeMod()"><i class="fas fa-xmark"></i> Cerrar</button>
            <button class="btn btn-s" onclick="printRpt()"><i class="fas fa-print"></i> Imprimir</button>
            <button class="btn btn-p" onclick="dlPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
    </div>
</div>

<div id="printArea"></div>
<div class="toast-c" id="toastC"></div>

// ====== Init ======
function init(){
    document.getElementById('cDate').value=new Date().toISOString().split('T')[0];
    buildForm();
    renderHist();
}
function fmtN(n){
    if(n==null||n==='')return '--';
    const num=Number(n);
    if(isNaN(num))return '--';
    return num.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
}

// ====== Build form ======
function buildForm(){
    const C=document.getElementById('invForm');C.innerHTML='';
    let total=0;
    DB.forEach((cat,ci)=>{
        total+=cat.items.length;
        const sec=document.createElement('div');sec.className='cat-sec';
        sec.innerHTML=`<div class="cat-hd" onclick="togCat(${ci})"><div class="cat-dot" style="background:${cat.clr}"></div><span class="cat-nm"><i class="fas ${cat.ico}"></i> ${cat.c}</span><span class="cat-cnt">${cat.items.length} SKU</span><i class="fas fa-chevron-down ct" id="ct${ci}"></i></div><div class="cat-body" id="cb${ci}"></div>`;
        C.appendChild(sec);
        const body=sec.querySelector('.cat-body');
        cat.items.forEach((p,pi)=>{body.insertAdjacentHTML('beforeend',mkRow(ci,pi,p))});
    });
    C.querySelectorAll('.qpaq, .qsuelt').forEach(inp=>{
        inp.addEventListener('input',()=>{
            const ci=+inp.dataset.c, pi=+inp.dataset.p;
            recalcRow(ci,pi);
            updStats();
        });
    });
    document.getElementById('sTotal').textContent=total;
    updStats();
}

function mkRow(ci,pi,p){
    const presText=p.pres||'';
    const minmax=(p.mn===0&&p.mx===0)?'SIN MIN/MAX':`MIN ${fmtN(p.mn)} / MAX ${fmtN(p.mx)} ${p.u}`;
    const ppTag=p.pp!==1?`<span class="tag">${fmtN(p.pp)} ${p.u}/PAQ</span>`:'';
    return `<div class="prow" id="r${ci}_${pi}" data-name="${p.n.toLowerCase()} ${presText.toLowerCase()}">
        <div class="pinfo">
            <div class="pname">${p.n}</div>
            <div class="ppres">
                <i class="fas fa-cube"></i>
                <span>${presText}</span>
                ${ppTag}
                <span class="minmax">${minmax}</span>
            </div>
        </div>
        <div class="pinputs">
            <div class="icell">
                <span class="ilabel">Paq / Caja</span>
                <input type="number" class="qpaq" id="paq${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="icell">
                <span class="ilabel">Pz Sueltas</span>
                <input type="number" class="qsuelt" id="sue${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="total-box">
                <span class="tlabel">Total</span>
                <span class="tval" id="tot${ci}_${pi}">0</span>
                <span class="tunit">${p.u}</span>
            </div>
            <span class="badge" id="b${ci}_${pi}">--</span>
        </div>
    </div>`;
}

function recalcRow(ci,pi){
    const row=document.getElementById(`r${ci}_${pi}`);
    if(!row)return;
    const qpaq=document.getElementById(`paq${ci}_${pi}`);
    const qsue=document.getElementById(`sue${ci}_${pi}`);
    const totEl=document.getElementById(`tot${ci}_${pi}`);
    const badge=document.getElementById(`b${ci}_${pi}`);
    const p=DB[ci].items[pi];

    const paq=parseFloat(qpaq.value)||0;
    const sue=parseFloat(qsue.value)||0;
    const total=(paq*p.pp)+sue;

    totEl.textContent=total>0?fmtN(total):'0';

    row.classList.remove('st-low','st-high','st-ok');

    if(total<=0){
        badge.textContent='--';
        return;
    }
    if(p.mn===0&&p.mx===0){
        badge.textContent='N/A';
        return;
    }
    if(total<p.mn){
        row.classList.add('st-low');
        badge.textContent='BAJO';
    } else if(total>p.mx){
        row.classList.add('st-high');
        badge.textContent='EXCESO';
    } else {
        row.classList.add('st-ok');
        badge.textContent='OK';
    }
}

function updStats(){
    let filled=0,low=0,high=0,ok=0,total=0;
    DB.forEach((cat,ci)=>{
        cat.items.forEach((p,pi)=>{
            total++;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            const paq=parseFloat(qpaq?.value)||0;
            const sue=parseFloat(qsue?.value)||0;
            const t=(paq*p.pp)+sue;
            if(t>0){
                filled++;
                if(p.mn===0&&p.mx===0){}
                else if(t<p.mn){low++}
                else if(t>p.mx){high++}
                else{ok++}
            }
        });
    });
    const pct=total>0?(filled/total*100):0;
    document.getElementById('pFill').style.width=pct+'%';
    document.getElementById('pTxt').textContent=`${filled} / ${total}`;
    document.getElementById('sOk').textContent=ok;
    document.getElementById('sLow').textContent=low;
    document.getElementById('sHigh').textContent=high;
}

function togCat(ci){
    const body=document.getElementById(`cb${ci}`);
    const tog=document.getElementById(`ct${ci}`);
    body.classList.toggle('hide');
    tog.style.transform=body.classList.contains('hide')?'rotate(-90deg)':'';
}

document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    document.querySelectorAll('.prow').forEach(row=>{
        const name=row.dataset.name||'';
        row.classList.toggle('hidden',q!==''&&!name.includes(q));
    });
    DB.forEach((cat,ci)=>{
        const body=document.getElementById(`cb${ci}`);
        if(!body)return;
        const visible=body.querySelectorAll('.prow:not(.hidden)');
        const sec=body.closest('.cat-sec');
        sec.style.display=visible.length===0&&q!==''?'none':'';
    });
});

function collect(){
    return{
        date:document.getElementById('cDate').value,
        resp:document.getElementById('cResp').value,
        loc:document.getElementById('cLoc').value,
        ts:new Date().toISOString(),
        cats:DB.map((cat,ci)=>({
            name:cat.c,clr:cat.clr,
            items:cat.items.map((p,pi)=>{
                const qpaq=document.getElementById(`paq${ci}_${pi}`);
                const qsue=document.getElementById(`sue${ci}_${pi}`);
                const paq=parseFloat(qpaq?.value)||0;
                const sue=parseFloat(qsue?.value)||0;
                const total=(paq*p.pp)+sue;
                let status='--';
                if(total>0){
                    if(p.mn===0&&p.mx===0)status='N/A';
                    else if(total<p.mn)status='BAJO';
                    else if(total>p.mx)status='EXCESO';
                    else status='OK';
                }
                return{n:p.n,pres:p.pres,pp:p.pp,mn:p.mn,mx:p.mx,u:p.u,paq,sue,total,status}
            })
        }))
    };
}

function saveCount(){
    const d=collect();
    if(!d.date){toast('Selecciona una fecha','err');return}
    const hasAny=d.cats.some(c=>c.items.some(p=>p.total>0));
    if(!hasAny){toast('Ingresa al menos una cantidad','err');return}
    let h=JSON.parse(localStorage.getItem('invHist')||'[]');
    d.id='cnt_'+Date.now();
    d.summary={
        total:d.cats.reduce((s,c)=>s+c.items.length,0),
        filled:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.total>0).length,0),
        low:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='BAJO').length,0),
        high:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='EXCESO').length,0),
        ok:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='OK').length,0)
    };
    h.unshift(d);localStorage.setItem('invHist',JSON.stringify(h));
    toast('Conteo guardado correctamente','ok');renderHist();
}

function clearAll(){
    confirm2('LIMPIAR TODOS LOS CAMPOS DEL CONTEO ACTUAL?').then(y=>{
        if(!y)return;
        document.querySelectorAll('#invForm .qpaq, #invForm .qsuelt').forEach(inp=>inp.value='');
        DB.forEach((cat,ci)=>cat.items.forEach((p,pi)=>{
            const row=document.getElementById(`r${ci}_${pi}`);
            const b=document.getElementById(`b${ci}_${pi}`);
            const t=document.getElementById(`tot${ci}_${pi}`);
            if(row)row.classList.remove('st-low','st-high','st-ok');
            if(b)b.textContent='--';
            if(t)t.textContent='0';
        }));
        document.getElementById('cResp').value='';
        document.getElementById('cLoc').value='';
        updStats();
        toast('Campos limpiados','ok');
    });
}

function confirm2(msg){
    return new Promise(res=>{
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;animation:p-fadein .2s var(--ease)';
        ov.innerHTML=`<div class="cfbox">
            <div class="cfico"><i class="fas fa-triangle-exclamation"></i></div>
            <p class="cfmsg">${msg}</p>
            <div class="cfact">
                <button class="btn btn-s" id="cfN">Cancelar</button>
                <button class="btn btn-d" id="cfY">Confirmar</button>
            </div>
        </div>`;
        document.body.appendChild(ov);
        ov.querySelector('#cfY').onclick=()=>{ov.remove();res(true)};
        ov.querySelector('#cfN').onclick=()=>{ov.remove();res(false)};
    });
}

function genReport(saved){
    const d=saved||collect();
    const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'Sin fecha';
    let tot=0,fill=0,low=0,high=0,ok=0,rows='';
    d.cats.forEach(cat=>{
        rows+=`<tr class="cr"><td colspan="7">${cat.name}</td></tr>`;
        cat.items.forEach(p=>{
            tot++;
            let qd,sc='co';
            if(p.total>0){
                fill++;
                if(p.status==='BAJO'){sc='cl';low++}
                else if(p.status==='EXCESO'){sc='ch';high++}
                else if(p.status==='OK'){ok++}
                qd=`<span class="${sc}">${fmtN(p.total)}</span>`;
            }else{qd='<span class="ev">--</span>'}
            const stTxt=p.total>0?
                (p.status==='BAJO'?'<span style="color:#ef4444;font-weight:700">BAJO</span>'
                :p.status==='EXCESO'?'<span style="color:#f59e0b;font-weight:700">EXCESO</span>'
                :p.status==='OK'?'<span style="color:#55C800;font-weight:700">OK</span>'
                :'<span style="color:#3a3a3a">--</span>'):'';
            const minmax=(p.mn===0&&p.mx===0)?'--':`${fmtN(p.mn)} / ${fmtN(p.mx)}`;
            rows+=`<tr>
                <td style="padding-left:16px">${p.n}</td>
                <td class="pres">${p.pres||''}</td>
                <td style="text-align:center">${fmtN(p.paq)}</td>
                <td style="text-align:center">${fmtN(p.sue)}</td>
                <td style="text-align:right"><strong>${fmtN(p.total)}</strong> <span style="font-size:.85em;color:#747474">${p.u||''}</span></td>
                <td style="text-align:center;color:#747474">${minmax}</td>
                <td style="text-align:center">${stTxt}</td>
            </tr>`;
        });
    });
    document.getElementById('rptCont').innerHTML=`
        <div class="rh"><h2>CONTEO FISICO DE INVENTARIO</h2>
        <div class="rm"><span><strong>FECHA</strong> ${ds}</span><span><strong>RESPONSABLE</strong> ${d.resp||'NO ASIGNADO'}</span><span><strong>SEDE</strong> ${d.loc||'NO ASIGNADA'}</span></div></div>
        <table><thead><tr>
            <th>PRODUCTO</th>
            <th>PRESENTACION</th>
            <th style="text-align:center">PAQ/CAJA</th>
            <th style="text-align:center">PZ SUELTAS</th>
            <th style="text-align:right">TOTAL</th>
            <th style="text-align:center">MIN / MAX</th>
            <th style="text-align:center">ESTADO</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="tr"><td colspan="2">TOTAL: ${tot} | CONTADOS: ${fill}</td><td colspan="2">OK: ${ok}</td><td>BAJO: ${low}</td><td>EXCESO: ${high}</td><td style="text-align:center">${Math.round(fill/tot*100)}%</td></tr></tfoot></table>`;
    document.getElementById('rptModal').classList.add('show');
}

function closeMod(){document.getElementById('rptModal').classList.remove('show')}
function printRpt(){
    const c=document.getElementById('rptCont').innerHTML;
    const pa=document.getElementById('printArea');
    pa.innerHTML=`<div class="rpt" style="padding:14px;font-family:'JetBrains Mono',monospace;color:#121212">${c}</div>`;
    pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none'},800);
}
function dlPDF(){
    const dv=document.getElementById('cDate').value||'sin_fecha';
    html2pdf().set({margin:[8,8,8,8],filename:`conteo_inventario_${dv}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#121212'},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}}).from(document.getElementById('rptCont')).save();
    toast('PDF generado','ok');
}

function renderHist(){
    const C=document.getElementById('histCont');
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');
    if(!h.length){C.innerHTML='<div class="empty"><i class="fas fa-clock-rotate-left"></i><h3>Sin registros</h3><p>Guarda un conteo para verlo aqui</p></div>';return}
    C.innerHTML='<div class="hlist">'+h.map((item,i)=>{
        return`<div class="hcard" onclick="viewHist(${i})">
            <div class="hico"><i class="fas fa-clipboard-check"></i></div>
            <div class="hinfo">
                <h4>${item.date||'SIN FECHA'}</h4>
                <p>${item.resp||'SIN RESPONSABLE'} · ${item.loc||'SIN SEDE'} · ${item.summary?.filled||0}/${item.summary?.total||0} CONTADOS · ${item.summary?.low||0} BAJO · ${item.summary?.high||0} EXCESO</p>
            </div>
            <div class="hacts">
                <button onclick="event.stopPropagation();loadHist(${i})" title="Cargar"><i class="fas fa-upload"></i></button>
                <button class="del" onclick="event.stopPropagation();delHist(${i})" title="Eliminar"><i class="fas fa-trash"></i></button>
            </div>
        </div>`
    }).join('')+'</div>';
}

function viewHist(i){const h=JSON.parse(localStorage.getItem('invHist')||'[]');if(h[i])genReport(h[i])}

function loadHist(i){
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');const item=h[i];if(!item)return;
    document.getElementById('cDate').value=item.date||'';
    document.getElementById('cResp').value=item.resp||'';
    document.getElementById('cLoc').value=item.loc||'';
    item.cats.forEach((cat,ci)=>{
        if(!DB[ci])return;
        cat.items.forEach((p,pi)=>{
            if(!DB[ci].items[pi])return;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            if(qpaq) qpaq.value = p.paq>0 ? p.paq : '';
            if(qsue) qsue.value = p.sue>0 ? p.sue : '';
            recalcRow(ci,pi);
        });
    });
    updStats();
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab=conteo]').classList.add('on');
    document.getElementById('p-conteo').classList.add('on');
    toast('Registro cargado','ok');
}

function delHist(i){
    confirm2('ELIMINAR ESTE REGISTRO DEL HISTORIAL?').then(y=>{
        if(!y)return;
        let h=JSON.parse(localStorage.getItem('invHist')||'[]');
        h.splice(i,1);localStorage.setItem('invHist',JSON.stringify(h));
        renderHist();toast('Registro eliminado','ok');
    });
}

document.querySelectorAll('.tab-btn').forEach(t=>{
    t.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
        document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
        t.classList.add('on');
        document.getElementById('p-'+t.dataset.tab).classList.add('on');
        if(t.dataset.tab==='historial')renderHist();
    });
});

function toast(msg,type='ok'){
    const C=document.getElementById('toastC');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const ic=type==='ok'?'fa-check':'fa-exclamation';
    t.innerHTML=`<i class="fas ${ic}"></i><span>${msg}</span>`;
    C.appendChild(t);setTimeout(()=>t.remove(),3100);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
document.getElementById('rptModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMod()});

init();
