<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conteo Fisico de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    :root{
        --obsidian:#000000;
        --graphite:#0e0e0e;
        --carbon:#1d1d1f;
        --steel:#333336;
        --slate:#6e6e73;
        --ash:#86868b;
        --porcelain:#f5f5f7;
        --white:#ffffff;

        --ember:#55C800;
        --ember-2:#48aa00;
        --ember-3:#3c8c00;
        --ember-soft:rgba(85,200,0,.10);
        --ember-line:rgba(85,200,0,.55);

        --red:#ef4444;
        --red-line:rgba(239,68,68,.45);

        --hair:rgba(255,255,255,.10);
        --hair-strong:rgba(255,255,255,.24);
        --hair-softer:rgba(255,255,255,.06);

        --r-card:28px;
        --r-nav:20px;
        --r-pill:9999px;
        --r-input:980px;
        --r-btn:170px;
        --r-compact:36px;
        --r-link:10px;

        --ease:cubic-bezier(0,0,.2,1);
        --dur:.2s;
        --dur-acc:.35s;

        --font:'Inter',"SF Pro Text","SF Pro Display",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    html{
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
        touch-action:manipulation;
        color-scheme:dark;
    }
    body{
        font-family:var(--font);
        background:var(--obsidian);
        color:var(--porcelain);
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-size:16px;
        line-height:1.29;
        letter-spacing:-.224px;
        touch-action:manipulation;
        overscroll-behavior-y:none;
    }

    /* =========================================================
       ANTI-ZOOM iOS: todo input/select/textarea DEBE ser >=16px
       ========================================================= */
    input,
    select,
    textarea,
    button,
    .btn,
    .tab-btn{
        font-family:var(--font);
        font-size:16px;      /* clave: evita el auto-zoom en iOS */
        touch-action:manipulation;
    }

    .bg-fx{
        position:fixed;inset:0;z-index:0;pointer-events:none;
        background:linear-gradient(#1d1d1f, #000000 288px);
    }

    .wrap{
        position:relative;z-index:1;
        max-width:1200px;margin:0 auto;
        padding:28px 24px 150px;
    }

    /* ============ HEADER ============ */
    header{
        display:flex;align-items:center;gap:20px;
        padding:26px 28px;
        background:var(--graphite);
        border:1px solid var(--hair);
        border-radius:var(--r-card);
        margin-bottom:24px;
    }
    header .ico{
        width:56px;height:56px;
        background:transparent;
        border:1px solid var(--ember-line);
        border-radius:var(--r-nav);
        display:flex;align-items:center;justify-content:center;
        font-size:22px;color:var(--ember);
        flex-shrink:0;
        transition:background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    header .ico:hover{background:var(--ember);border-color:var(--ember);color:var(--obsidian)}
    header .htxt{flex:1;min-width:0}
    header h1{
        font-family:var(--font);
        font-size:clamp(22px,3.2vw,32px);
        font-weight:600;
        letter-spacing:.128px;
        line-height:1.13;
        color:var(--porcelain);
    }
    header h1 .dot{color:var(--ember)}
    header p{
        color:var(--ash);
        margin-top:8px;
        font-size:14px;
        font-weight:400;
        letter-spacing:-.224px;
        line-height:1.47;
    }
    header .badge-top{
        font-size:12px;
        color:var(--ember);
        letter-spacing:-.12px;
        font-weight:500;
        border:1px solid var(--ember-line);
        padding:6px 14px;
        border-radius:var(--r-pill);
        flex-shrink:0;
        align-self:flex-start;
        white-space:nowrap;
    }

    /* ============ TOP FORM ============ */
    .top-row{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:16px;
        margin-bottom:24px;
        padding:20px 24px;
        border:1px solid var(--hair);
        border-radius:var(--r-card);
        background:var(--carbon);
    }
    .top-row .fld{min-width:0}
    .top-row label{
        display:block;
        font-family:var(--font);
        font-size:12px;
        color:var(--ash);
        letter-spacing:-.12px;
        font-weight:400;
        margin-bottom:8px;
    }
    .top-row input{
        width:100%;
        height:48px;
        background:rgba(255,255,255,.04);
        border:1px solid var(--slate);
        border-radius:var(--r-input);
        padding:0 18px;
        color:var(--porcelain);
        font-family:var(--font);
        font-size:16px;         /* >=16px para iOS */
        font-weight:400;
        letter-spacing:-.224px;
        outline:none;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        -webkit-appearance:none;
        appearance:none;
    }
    .top-row input:hover{border-color:var(--hair-strong)}
    .top-row input:focus{
        border-color:var(--ember);
        box-shadow:0 0 0 1px var(--ember);
        background:rgba(255,255,255,.06);
    }
    .top-row input::placeholder{color:var(--slate)}
    .top-row input[type="date"]{color-scheme:dark}

    /* ============ STATS ============ */
    .stats-bar{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:16px;
        margin-bottom:24px;
    }
    .stat-card{
        padding:24px;
        background:var(--carbon);
        border:1px solid var(--hair);
        border-radius:var(--r-card);
        transition:border-color var(--dur) var(--ease);
    }
    .stat-card:hover{border-color:var(--hair-strong)}
    .stat-card .num{
        font-family:var(--font);
        font-size:28px;
        font-weight:600;
        line-height:1;
        letter-spacing:-.4px;
        color:var(--porcelain);
        font-variant-numeric:tabular-nums;
    }
    .stat-card .lbl{
        font-family:var(--font);
        font-size:12px;
        color:var(--ash);
        letter-spacing:-.12px;
        margin-top:10px;
        font-weight:400;
    }

    /* ============ PROGRESS ============ */
    .prog-wrap{
        margin-bottom:24px;
        padding:20px 24px;
        background:var(--carbon);
        border:1px solid var(--hair);
        border-radius:var(--r-card);
    }
    .prog-lbl{
        display:flex;justify-content:space-between;align-items:baseline;
        font-family:var(--font);
        font-size:14px;color:var(--ash);
        letter-spacing:-.224px;
        margin-bottom:12px;font-weight:400;
    }
    .prog-lbl strong{
        color:var(--ember);
        font-size:14px;font-weight:600;
        letter-spacing:-.224px;
        font-variant-numeric:tabular-nums;
    }
    .prog-trk{
        height:6px;
        background:rgba(255,255,255,.08);
        border-radius:var(--r-pill);
        overflow:hidden;
    }
    .prog-fill{
        height:100%;
        background:var(--ember);
        border-radius:var(--r-pill);
        transition:width .35s var(--ease);
        width:0%;
    }

    /* ============ SEARCH ============ */
    .search-bar{position:relative;margin-bottom:24px}
    .search-bar input{
        width:100%;
        height:52px;
        padding:0 20px 0 46px;
        background:rgba(255,255,255,.04);
        border:1px solid var(--slate);
        border-radius:var(--r-input);
        color:var(--porcelain);
        font-family:var(--font);
        font-size:16px;          /* >=16px para iOS */
        letter-spacing:-.224px;
        outline:none;
        -webkit-appearance:none;
        appearance:none;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .search-bar input:hover{border-color:var(--hair-strong)}
    .search-bar input:focus{
        border-color:var(--ember);
        box-shadow:0 0 0 1px var(--ember);
        background:rgba(255,255,255,.06);
    }
    .search-bar input::placeholder{color:var(--slate)}
    .search-bar .si{
        position:absolute;left:19px;top:50%;transform:translateY(-50%);
        color:var(--ash);font-size:.85rem;pointer-events:none;
    }

    /* ============ TABS ============ */
    .tabs{
        display:flex;gap:10px;margin-bottom:24px;
        flex-wrap:wrap;
    }
    .tab-btn{
        height:44px;
        padding:0 22px;
        background:transparent;
        border:1px solid var(--slate);
        border-radius:var(--r-pill);
        color:var(--porcelain);
        font-family:var(--font);
        font-size:14px;
        font-weight:500;
        letter-spacing:-.12px;
        cursor:pointer;
        transition:all var(--dur) var(--ease);
        white-space:nowrap;
        display:inline-flex;align-items:center;gap:8px;
        touch-action:manipulation;
    }
    .tab-btn i{font-size:.78rem}
    .tab-btn:hover{border-color:var(--porcelain)}
    .tab-btn.on{
        color:var(--obsidian);
        background:var(--porcelain);
        border-color:var(--porcelain);
        font-weight:600;
    }
    .tpanel{display:none;animation:fi .25s var(--ease)}
    .tpanel.on{display:block}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* =========================================================
       CATEGORÍA + ACORDEÓN SUAVE
       ========================================================= */
    .cat-sec{
        margin-bottom:20px;
        background:var(--carbon);
        border:1px solid var(--hair);
        border-radius:var(--r-card);
        overflow:hidden;
        transition:border-color var(--dur) var(--ease);
    }
    .cat-sec:hover{border-color:var(--hair-strong)}
    .cat-hd{
        display:flex;align-items:center;gap:14px;
        padding:20px 24px;
        cursor:pointer;user-select:none;
        -webkit-tap-highlight-color:transparent;
        transition:background var(--dur) var(--ease);
    }
    .cat-hd:hover{background:rgba(255,255,255,.02)}
    .cat-dot{
        width:8px;height:8px;border-radius:var(--r-pill);
        flex-shrink:0;
    }
    .cat-nm{
        font-family:var(--font);
        font-size:17px;
        font-weight:500;
        letter-spacing:-.374px;
        color:var(--porcelain);
        transition:color var(--dur) var(--ease);
        display:inline-flex;align-items:center;gap:12px;
        min-width:0;
    }
    .cat-nm i{color:var(--ember);font-size:.85rem}
    .cat-hd:hover .cat-nm{color:var(--ember)}
    .cat-nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cat-cnt{
        font-family:var(--font);
        font-size:12px;
        color:var(--ash);
        border:1px solid var(--hair);
        padding:4px 12px;
        border-radius:var(--r-pill);
        margin-left:auto;
        font-weight:400;
        letter-spacing:-.12px;
        white-space:nowrap;
    }
    .ct{
        color:var(--ash);font-size:.72rem;
        transition:transform var(--dur-acc) var(--ease), color var(--dur) var(--ease);
        margin-left:6px;
        flex-shrink:0;
    }
    .cat-hd:hover .ct{color:var(--ember)}
    /* Acordeón: colapsa con max-height + opacidad + padding */
    .cat-body{
        max-height:8000px;
        opacity:1;
        overflow:hidden;
        padding:0 16px 16px;
        transition:
            max-height var(--dur-acc) var(--ease),
            opacity var(--dur) var(--ease),
            padding-top var(--dur-acc) var(--ease),
            padding-bottom var(--dur-acc) var(--ease);
    }
    .cat-body.hide{
        max-height:0;
        opacity:0;
        padding-top:0;
        padding-bottom:0;
    }
    /* chevron rota */
    .cat-hd[aria-expanded="false"] .ct{transform:rotate(-90deg)}

    /* ============ PRODUCT ROW ============ */
    .prow{
        display:flex;align-items:center;gap:18px;
        padding:16px 20px;
        background:var(--obsidian);
        border:1px solid var(--hair);
        border-radius:var(--r-nav);
        margin-bottom:8px;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
        flex-wrap:wrap;
    }
    .prow:hover{
        border-color:var(--hair-strong);
        background:#050505;
    }
    .prow.hidden{display:none}

    .pinfo{flex:1 1 240px;min-width:0}
    .pname{
        font-family:var(--font);
        font-size:15px;
        font-weight:600;
        letter-spacing:-.224px;
        color:var(--porcelain);
        line-height:1.29;
    }
    .ppres{
        font-family:var(--font);
        font-size:12px;
        color:var(--ash);
        margin-top:6px;
        line-height:1.5;
        font-weight:400;
        letter-spacing:-.12px;
        display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    }
    .ppres > i{color:var(--ember);font-size:.68rem;flex-shrink:0}
    .ppres .tag{
        color:var(--ember);
        border:1px solid var(--ember-line);
        padding:2px 10px;
        border-radius:var(--r-pill);
        font-size:11px;
        font-weight:500;
        letter-spacing:-.12px;
        white-space:nowrap;
    }
    .ppres .tag-sp{
        color:#f0a13a;
        border-color:rgba(240,161,58,.5);
    }

    /* =========================================================
       INPUTS DE PRODUCTO — CORREGIDOS
       ========================================================= */
    .pinputs{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
    .icell{display:flex;flex-direction:column;gap:6px}
    .ilabel{
        font-family:var(--font);
        font-size:11px;
        color:var(--ash);
        letter-spacing:-.12px;
        font-weight:400;
        text-align:center;
    }
    .icell input{
        width:96px;
        height:48px;
        padding:0 12px;
        background:rgba(255,255,255,.04);
        border:1px solid var(--slate);
        border-radius:var(--r-input);
        color:var(--porcelain);
        font-family:var(--font);
        font-size:16px;          /* >=16px para iOS */
        font-weight:600;
        text-align:center;
        outline:0;
        letter-spacing:-.3px;
        font-variant-numeric:tabular-nums;
        -webkit-appearance:none;
        appearance:none;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        -moz-appearance:textfield;
        touch-action:manipulation;
    }
    .icell input:hover{border-color:var(--hair-strong)}
    .icell input:focus{
        border-color:var(--ember);
        box-shadow:0 0 0 1px var(--ember);
        background:rgba(255,255,255,.06);
    }
    .icell input::placeholder{color:var(--slate);font-weight:400}
    .icell input::-webkit-inner-spin-button,
    .icell input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

    .total-box{
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:2px;
        min-width:112px;
        height:48px;
        padding:0 18px;
        background:var(--ember-soft);
        border:1px solid var(--ember-line);
        border-radius:var(--r-pill);
    }
    .total-box .tlabel{
        font-family:var(--font);
        font-size:10px;
        color:var(--ember);
        letter-spacing:-.12px;
        font-weight:500;
    }
    .total-box .tval{
        font-family:var(--font);
        font-size:18px;
        font-weight:600;
        color:var(--ember);
        line-height:1.1;
        letter-spacing:-.4px;
        font-variant-numeric:tabular-nums;
    }
    .total-box .tunit{
        font-family:var(--font);
        font-size:9px;
        color:var(--ember);
        opacity:.7;
        font-weight:400;
        letter-spacing:-.12px;
    }

    /* =========================================================
       ACTION BAR — BOTONES EN UNA SOLA FILA
       ========================================================= */
    .act-bar{
        position:fixed;bottom:0;left:0;right:0;
        padding:20px 20px 22px;
        padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));
        background:linear-gradient(to top, var(--obsidian) 55%, rgba(0,0,0,0));
        display:flex;
        gap:8px;
        flex-wrap:nowrap;           /* nunca se apilan */
        z-index:10;
        justify-content:center;
        align-items:stretch;
        max-width:1200px;margin:0 auto;
    }
    .btn{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        height:48px;
        padding:0 18px;
        border:1px solid transparent;
        border-radius:var(--r-btn);
        font-family:var(--font);
        font-size:13px;
        font-weight:500;
        letter-spacing:-.12px;
        cursor:pointer;
        transition:background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
        background:transparent;
        color:var(--porcelain);
        white-space:nowrap;
        touch-action:manipulation;
        -webkit-appearance:none;
        appearance:none;
        user-select:none;
        -webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:translateY(1px)}
    .btn i{font-size:.82rem;flex-shrink:0}

    .btn-p{
        background:var(--porcelain);
        color:var(--obsidian);
        border-color:var(--porcelain);
    }
    .btn-p:hover{
        background:var(--white);
        border-color:var(--white);
        color:var(--obsidian);
    }
    .btn-s{
        background:transparent;
        color:var(--porcelain);
        border-color:var(--slate);
    }
    .btn-s:hover{border-color:var(--porcelain)}
    .btn-d{
        background:transparent;
        color:var(--red);
        border-color:var(--red-line);
    }
    .btn-d:hover{
        border-color:var(--red);
        background:var(--red);
        color:var(--obsidian);
    }
    .btn-e{
        background:var(--ember);
        color:var(--obsidian);
        border-color:var(--ember);
        font-weight:600;
    }
    .btn-e:hover{
        background:var(--ember-2);
        border-color:var(--ember-2);
    }
    .btn-e:disabled{
        opacity:.5;
        cursor:not-allowed;
        background:var(--ember)!important;
        color:var(--obsidian)!important;
        border-color:var(--ember)!important;
    }

    /* Cada botón ocupa el mismo ancho flexible, pero encoge si es necesario */
    .act-bar .btn{
        flex:1 1 0;
        min-width:0;
        padding:0 10px;
        overflow:hidden;
        text-overflow:ellipsis;
    }
    /* El texto puede truncarse en pantallas muy pequeñas, pero sigue visible */
    .act-bar .btn span.btxt{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        min-width:0;
    }

    /* ============ MODAL ============ */
    .modal-bg{
        display:none;position:fixed;inset:0;
        background:rgba(0,0,0,.82);
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        z-index:1000;
        justify-content:center;align-items:flex-start;
        padding:24px;overflow-y:auto;
        animation:p-fadein .25s var(--ease);
    }
    .modal-bg.show{display:flex}
    .modal-box{
        background:var(--carbon);
        color:var(--porcelain);
        border:1px solid var(--hair);
        border-radius:var(--r-card);
        width:100%;max-width:1000px;margin-top:24px;
        animation:mi .3s var(--ease);
        overflow:hidden;
    }
    @keyframes mi{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes p-fadein{0%{opacity:0}100%{opacity:1}}
    .modal-hd{
        display:flex;align-items:center;justify-content:space-between;
        padding:22px 28px;
        border-bottom:1px solid var(--hair);
    }
    .modal-hd h2{
        font-family:var(--font);
        font-size:17px;
        font-weight:600;
        color:var(--porcelain);
        letter-spacing:-.374px;
        display:flex;align-items:center;gap:12px;
    }
    .modal-hd h2 i{color:var(--ember);font-size:1rem}
    .modal-x{
        width:40px;height:40px;
        background:transparent;
        border:1px solid var(--slate);
        border-radius:var(--r-pill);
        font-size:.9rem;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        color:var(--porcelain);
        transition:all var(--dur) var(--ease);
        touch-action:manipulation;
        -webkit-appearance:none;
        appearance:none;
    }
    .modal-x:hover{border-color:var(--ember);color:var(--ember)}
    .modal-bd{padding:28px;max-height:66vh;overflow-y:auto}
    .modal-ft{
        display:flex;gap:10px;padding:18px 28px;
        border-top:1px solid var(--hair);
        background:var(--graphite);
        flex-wrap:nowrap;
    }
    .modal-ft .btn{flex:1 1 0;min-width:0;justify-content:center}

    /* ============ REPORT ============ */
    .rpt{
        font-family:var(--font);
        color:var(--porcelain);
        font-size:13px;
        letter-spacing:-.12px;
    }
    .rpt .rh{
        text-align:left;
        margin-bottom:24px;
        padding-bottom:18px;

        letter-spacing:-.4px;
        color:var(--porcelain);
    }
    .rpt .rm{
        display:flex;justify-content:flex-start;flex-wrap:wrap;
        gap:28px;margin-top:14px;
        font-size:12px;color:var(--ash);
        letter-spacing:-.12px;
    }
    .rpt .rm strong{color:var(--ember);font-weight:600;margin-right:6px}
    .rpt table{width:100%;border-collapse:collapse;font-size:12.5px}
    .rpt thead th{
        background:transparent;
        color:var(--ash);
        padding:10px 8px;
        text-align:left;
        font-weight:500;
        font-size:11px;
        letter-spacing:-.12px;
        border-bottom:1px solid var(--hair-strong);
    }
    .rpt .cr td{
        background:rgba(85,200,0,.06);
        padding:10px 8px;
        font-weight:600;
        font-size:12px;
        color:var(--ember);
        letter-spacing:-.12px;
        border-bottom:1px solid var(--hair);
    }
    .rpt tbody td{
        padding:9px 8px;
        border-bottom:1px solid var(--hair-softer);
        color:var(--porcelain);
        vertical-align:top;
    }
    .rpt tbody tr:hover td{background:rgba(255,255,255,.02)}
    .rpt .pres{font-size:11.5px;color:var(--ash);letter-spacing:-.12px}
    .rpt .co{color:var(--ember);font-weight:600}
    .rpt .ev{color:var(--steel)}
    .rpt .tr td{
        background:transparent;
        color:var(--ember);
        padding:14px 8px;
        font-weight:600;
        font-size:12.5px;
        letter-spacing:-.12px;
        border-top:1px solid var(--ember-line);
        border-bottom:0;
    }

    /* ============ HISTORY ============ */
    .hlist{display:flex;flex-direction:column;gap:10px}
    .hcard{
        background:var(--carbon);
        border:1px solid var(--hair);
        border-radius:var(--r-nav);
        padding:18px 22px;
        cursor:pointer;
        transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
        display:flex;align-items:center;gap:18px;
        touch-action:manipulation;
    }
    .hcard:hover{
        border-color:var(--hair-strong);
        background:#151517;
    }
    .hico{
        width:44px;height:44px;
        background:var(--ember-soft);
        border:1px solid var(--ember-line);
        border-radius:var(--r-nav);
        display:flex;align-items:center;justify-content:center;
        color:var(--ember);font-size:1rem;flex-shrink:0;
        transition:all var(--dur) var(--ease);
    }
    .hcard:hover .hico{background:var(--ember);color:var(--obsidian)}
    .hinfo{flex:1;min-width:0}
    .hinfo h4{
        font-family:var(--font);
        font-size:15px;font-weight:600;
        color:var(--porcelain);
        letter-spacing:-.224px;
        font-variant-numeric:tabular-nums;
    }
    .hinfo p{
        font-family:var(--font);
        font-size:12px;color:var(--ash);
        margin-top:5px;
        letter-spacing:-.12px;
        line-height:1.5;
    }
    .hacts{display:flex;gap:8px}
    .hacts button{
        width:40px;height:40px;
        background:transparent;
        border:1px solid var(--slate);
        border-radius:var(--r-pill);
        color:var(--porcelain);cursor:pointer;font-size:.78rem;
        transition:all var(--dur) var(--ease);
        touch-action:manipulation;
        -webkit-appearance:none;
        appearance:none;
    }
    .hacts button:hover{color:var(--ember);border-color:var(--ember)}
    .hacts button.del:hover{color:var(--red);border-color:var(--red)}

    /* ============ EMPTY ============ */
    .empty{
        text-align:center;padding:72px 20px;color:var(--ash);
        border:1px dashed var(--slate);
        border-radius:var(--r-card);
    }
    .empty i{font-size:2.2rem;margin-bottom:18px;color:var(--ember);opacity:.6}
    .empty h3{
        font-family:var(--font);
        font-size:17px;margin-bottom:8px;
        color:var(--porcelain);font-weight:600;
        letter-spacing:-.374px;
    }
    .empty p{font-family:var(--font);font-size:13px;letter-spacing:-.12px}

    /* ============ TOAST ============ */
    .toast-c{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px}
    .toast{
        background:var(--graphite);
        border:1px solid var(--hair-strong);
        border-radius:var(--r-nav);
        padding:14px 20px;
        font-family:var(--font);
        font-size:13px;color:var(--porcelain);
        font-weight:500;
        display:flex;align-items:center;gap:12px;
        animation:moveinright .3s var(--ease), to .3s var(--ease) 2.7s forwards;
        min-width:250px;
        letter-spacing:-.12px;
        backdrop-filter:blur(20px);
        -webkit-backdrop-filter:blur(20px);
    }
    .toast.ok i{color:var(--ember)}
    .toast.err i{color:var(--red)}
    @keyframes moveinright{0%{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes to{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

    /* ============ CONFIRM ============ */
    .cfbox{
        background:var(--carbon);
        border:1px solid var(--hair-strong);
        border-radius:var(--r-card);
        padding:32px;max-width:400px;width:100%;
        text-align:left;
    }
    .cfbox .cfico{
        width:48px;height:48px;
        background:var(--ember-soft);
        border:1px solid var(--ember-line);
        border-radius:var(--r-nav);
        display:flex;align-items:center;justify-content:center;
        margin-bottom:18px;
        color:var(--ember);font-size:1.15rem;
    }
    .cfbox .cfmsg{
        font-family:var(--font);
        font-size:15px;color:var(--porcelain);
        margin-bottom:26px;font-weight:500;
        line-height:1.47;
        letter-spacing:-.224px;
    }
    .cfbox .cfact{display:flex;gap:10px;flex-wrap:nowrap}
    .cfbox .cfact .btn{flex:1 1 0;min-width:0;justify-content:center}

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media(max-width:860px){
        .stats-bar{grid-template-columns:repeat(2,1fr)}
        .top-row{grid-template-columns:1fr 1fr}
        .top-row .fld:nth-child(3){grid-column:1 / -1}
    }
    @media(max-width:720px){
        .wrap{padding:20px 16px 150px}
        header{padding:20px;gap:16px}
        header .badge-top{display:none}
        header .ico{width:48px;height:48px;font-size:18px;border-radius:16px}
        .top-row{padding:18px;gap:14px}
        .stat-card{padding:20px}
        .prow{flex-direction:column;align-items:stretch;gap:14px;padding:18px}
        .pinfo{flex:0 0 auto}
        .pinputs{justify-content:space-between;width:100%;gap:10px}
        .icell{flex:1 1 0;min-width:0}
        .icell input{width:100%;min-width:0}
        .total-box{flex:0 0 auto}
        .modal-bd{padding:20px}
        .modal-hd,.modal-ft{padding:16px 20px}
        .tab-btn{padding:0 18px;font-size:13px;height:42px}
        .btn{padding:0 14px;font-size:13px}
        .act-bar{padding:16px 12px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));gap:6px}
        .rpt table{font-size:11px}
        .rpt thead th{padding:8px 5px;font-size:10px}
        .rpt tbody td{padding:7px 5px}
    }
    @media(max-width:560px){
        .top-row{grid-template-columns:1fr}
        .top-row .fld:nth-child(3){grid-column:auto}
        /* Reducir etiquetas de botones en pantallas pequeñas */
        .act-bar .btn{padding:0 8px;font-size:12px;gap:6px}
        .act-bar .btn i{font-size:.78rem}
    }
    @media(max-width:400px){
        header h1{font-size:20px;letter-spacing:0}
        header p{font-size:12px}

        .stat-card .lbl{font-size:11px}

        .hico{width:38px;height:38px;font-size:.85rem}
        /* Texto solo visible en botones anchos */
        .act-bar .btn span.btxt{display:none}
        .act-bar .btn{padding:0 6px}
        .act-bar .btn i{font-size:.95rem}
    }
    @media print{
        body{background:#fff!important}
        .wrap,.modal-bg,.bg-fx,.toast-c,.act-bar,.tabs{display:none!important}
        #printArea{display:block!important;position:fixed;inset:0;background:#fff;z-index:99999;padding:18px;color:#1d1d1f}
        #printArea .rpt{color:#1d1d1f}
        #printArea .rpt .rh h2{color:#1d1d1f}
        #printArea .rpt .rm{color:#6e6e73}
        #printArea .rpt .rm strong{color:#1d1d1f}

        #printArea .rpt .cr td{background:#f5f5f7;color:#1d1d1f;border-bottom:1px solid #d2d2d7}

        #printArea .rpt .pres{color:#6e6e73}
        #printArea .rpt .co{color:#3c8c00}
        #printArea .rpt .tr td{color:#1d1d1f;border-top:2px solid #1d1d1f}
    }
    #printArea{display:none}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:var(--obsidian)}
    ::-webkit-scrollbar-thumb{background:var(--steel);border-radius:var(--r-pill)}
    ::-webkit-scrollbar-thumb:hover{background:var(--ember)}

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
            transform:none!important;
        }
    }
</style>

<div class="wrap">
    <header>

</div>

</div>

function init(){
    document.getElementById('cDate').value=new Date().toISOString().split('T')[0];
    buildForm();
    renderHist();
}
function fmtN(n){
    if(n==null||n==='')return '--';
    const num=Number(n);
    if(isNaN(num))return '--';
    return num.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
}

function spTag(p){
    if(p.sp==null||p.sp===1)return '';
    if(p.u==='L'||p.u==='Kg'){
        const g=p.sp*1000;
        return `<span class="tag tag-sp">×${fmtN(g)} g/pz</span>`;
    }
    return `<span class="tag tag-sp">×${fmtN(p.sp)} ${p.u}/pz</span>`;
}

function buildForm(){
    const C=document.getElementById('invForm');C.innerHTML='';
    let total=0;
    DB.forEach((cat,ci)=>{
        total+=cat.items.length;
        const sec=document.createElement('div');sec.className='cat-sec';
        sec.innerHTML=`
            <div class="cat-hd" role="button" tabindex="0" aria-expanded="true" aria-controls="cb${ci}" onclick="togCat(${ci})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togCat(${ci});}">
                <div class="cat-dot" style="background:${cat.clr}"></div>
                <span class="cat-nm"><i class="fas ${cat.ico}"></i><span>${cat.c}</span></span>
                <span class="cat-cnt">${cat.items.length} SKU</span>
                <i class="fas fa-chevron-down ct" id="ct${ci}"></i>
            </div>
            <div class="cat-body" id="cb${ci}"></div>`;
        C.appendChild(sec);
        const body=sec.querySelector('.cat-body');
        cat.items.forEach((p,pi)=>{body.insertAdjacentHTML('beforeend',mkRow(ci,pi,p))});
    });
    C.querySelectorAll('.qpaq, .qsuelt').forEach(inp=>{
        inp.addEventListener('input',()=>{
            const ci=+inp.dataset.c, pi=+inp.dataset.p;
            recalcRow(ci,pi);
            updStats();
        });
        /* Enfocar el input tras el blur previene el zoom residual */
        inp.addEventListener('focus',()=>{
            if(window.visualViewport && window.visualViewport.scale>1){
                window.scrollTo({top:window.scrollY,behavior:'instant'});
            }
        });
    });
    document.getElementById('sTotal').textContent=total;
    updStats();
}

function mkRow(ci,pi,p){
    const presText=p.pres||'';
    const ppTag=p.pp!==1?`<span class="tag">${fmtN(p.pp)} ${p.u}/paq</span>`:'';
    const spT=spTag(p);
    return `<div class="prow" id="r${ci}_${pi}" data-name="${p.n.toLowerCase()} ${presText.toLowerCase()}">
        <div class="pinfo">
            <div class="pname">${p.n}</div>
            <div class="ppres">
                <i class="fas fa-cube"></i>
                <span>${presText}</span>
                ${ppTag}
                ${spT}
            </div>
        </div>
        <div class="pinputs">
            <div class="icell">
                <span class="ilabel">Paq / Caja</span>
                <input type="number" class="qpaq" id="paq${ci}_${pi}" inputmode="decimal" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="icell">
                <span class="ilabel">Pz sueltas</span>
                <input type="number" class="qsuelt" id="sue${ci}_${pi}" inputmode="decimal" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="total-box">
                <span class="tlabel">Total</span>
                <span class="tval" id="tot${ci}_${pi}">0</span>
                <span class="tunit">${p.u}</span>
            </div>
        </div>
    </div>`;
}

function recalcRow(ci,pi){
    const qpaq=document.getElementById(`paq${ci}_${pi}`);
    const qsue=document.getElementById(`sue${ci}_${pi}`);
    const totEl=document.getElementById(`tot${ci}_${pi}`);
    const p=DB[ci].items[pi];

    const paq=parseFloat(qpaq.value)||0;
    const sue=parseFloat(qsue.value)||0;
    const sp=p.sp!=null?p.sp:1;
    const total=(paq*p.pp)+(sue*sp);

    totEl.textContent=total>0?fmtN(total):'0';
}

function updStats(){
    let filled=0,total=0,units=0;
    DB.forEach((cat,ci)=>{
        cat.items.forEach((p,pi)=>{
            total++;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            const paq=parseFloat(qpaq?.value)||0;
            const sue=parseFloat(qsue?.value)||0;
            const sp=p.sp!=null?p.sp:1;
            const t=(paq*p.pp)+(sue*sp);
            if(paq>0||sue>0)filled++;
            if(t>0)units+=t;
        });
    });
    const pct=total>0?(filled/total*100):0;
    document.getElementById('pFill').style.width=pct+'%';
    document.getElementById('pTxt').textContent=`${filled} / ${total}`;
    document.getElementById('sFilled').textContent=filled;
    document.getElementById('sPending').textContent=total-filled;
    document.getElementById('sUnits').textContent=fmtN(Math.round(units));
}

/* =========================================================
   ACORDEÓN: colapsa con transición suave (max-height + opacity)
   ========================================================= */
function togCat(ci){
    const body=document.getElementById(`cb${ci}`);
    const hd=body.previousElementSibling;
    const isHidden=body.classList.toggle('hide');
    hd.setAttribute('aria-expanded', isHidden?'false':'true');
}

document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    document.querySelectorAll('.prow').forEach(row=>{
        const name=row.dataset.name||'';
        row.classList.toggle('hidden',q!==''&&!name.includes(q));
    });
    DB.forEach((cat,ci)=>{
        const body=document.getElementById(`cb${ci}`);
        if(!body)return;
        const visible=body.querySelectorAll('.prow:not(.hidden)');
        const sec=body.closest('.cat-sec');
        sec.style.display=visible.length===0&&q!==''?'none':'';
    });
});

function collect(){
    return{
        date:document.getElementById('cDate').value,
        resp:document.getElementById('cResp').value,
        loc:document.getElementById('cLoc').value,
        ts:new Date().toISOString(),
        cats:DB.map((cat,ci)=>({
            name:cat.c,clr:cat.clr,
            items:cat.items.map((p,pi)=>{
                const qpaq=document.getElementById(`paq${ci}_${pi}`);
                const qsue=document.getElementById(`sue${ci}_${pi}`);
                const paq=parseFloat(qpaq?.value)||0;
                const sue=parseFloat(qsue?.value)||0;
                const sp=p.sp!=null?p.sp:1;
                const total=(paq*p.pp)+(sue*sp);
                return{n:p.n,pres:p.pres,pp:p.pp,sp,u:p.u,paq,sue,total}
            })
        }))
    };
}

function saveCount(){
    const d=collect();
    if(!d.date){toast('Selecciona una fecha','err');return}
    const hasAny=d.cats.some(c=>c.items.some(p=>p.total>0));
    if(!hasAny){toast('Ingresa al menos una cantidad','err');return}
    let h=JSON.parse(localStorage.getItem('invHist')||'[]');
    d.id='cnt_'+Date.now();
    d.summary={
        total:d.cats.reduce((s,c)=>s+c.items.length,0),
        filled:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.total>0).length,0),
        units:Math.round(d.cats.reduce((s,c)=>s+c.items.reduce((a,p)=>a+p.total,0),0))
    };
    h.unshift(d);localStorage.setItem('invHist',JSON.stringify(h));
    toast('Conteo guardado correctamente','ok');renderHist();
}

async function sendWebhook(){
    const btn = document.getElementById('btnSend');
    const originalHTML = btn.innerHTML;

    const d = collect();
    if(!d.date){toast('Selecciona una fecha','err');return}

    const itemsConDatos = [];
    d.cats.forEach(cat=>{
        cat.items.forEach(p=>{
            if(p.paq > 0 || p.sue > 0){
                itemsConDatos.push({
                    categoria: cat.name,
                    producto: p.n,
                    presentacion: p.pres || '',
                    paquetes: p.paq,
                    piezasPorPaquete: p.pp,
                    multiplicadorSueltas: p.sp != null ? p.sp : 1,
                    piezasSueltas: p.sue,
                    total: p.total,
                    unidad: p.u
                });
            }
        });
    });

    if(!itemsConDatos.length){
        toast('Ingresa al menos una cantidad','err');
        return;
    }

    const totalProductos = d.cats.reduce((s,c)=>s+c.items.length,0);
    const unidadesTotales = Math.round(itemsConDatos.reduce((s,p)=>s+p.total,0));

    const payload = {
        fecha: d.date,
        responsable: d.resp || '',
        sede: d.loc || '',
        timestamp: d.ts,
        items: itemsConDatos,
        resumen: {
            totalProductos,
            contados: itemsConDatos.length,
            pendientes: totalProductos - itemsConDatos.length,
            unidadesTotales
        }
    };

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="btxt">Enviando</span>';

    try{
        const res = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if(!res.ok) throw new Error('HTTP '+res.status);

        toast('Conteo enviado correctamente','ok');
        btn.innerHTML = '<i class="fas fa-check"></i><span class="btxt">Enviado</span>';
        setTimeout(()=>{ btn.innerHTML = originalHTML; }, 1800);
    }catch(err){
        console.error('Error webhook:', err);
        toast('Error al enviar: '+err.message,'err');
        btn.innerHTML = '<i class="fas fa-triangle-exclamation"></i><span class="btxt">Reintentar</span>';
        setTimeout(()=>{ btn.innerHTML = originalHTML; }, 2200);
    }finally{
        setTimeout(()=>{ btn.disabled = false; }, 1500);
    }
}

function clearAll(){
    confirm2('¿Limpiar todos los campos del conteo actual?').then(y=>{
        if(!y)return;
        document.querySelectorAll('#invForm .qpaq, #invForm .qsuelt').forEach(inp=>inp.value='');
        DB.forEach((cat,ci)=>cat.items.forEach((p,pi)=>{
            const t=document.getElementById(`tot${ci}_${pi}`);
            if(t)t.textContent='0';
        }));
        document.getElementById('cResp').value='';
        document.getElementById('cLoc').value='';
        updStats();
        toast('Campos limpiados','ok');
    });
}

function confirm2(msg){
    return new Promise(res=>{
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:24px;animation:p-fadein .25s var(--ease)';
        ov.innerHTML=`<div class="cfbox">
            <div class="cfico"><i class="fas fa-triangle-exclamation"></i></div>
            <p class="cfmsg">${msg}</p>
            <div class="cfact">
                <button class="btn btn-s" id="cfN">Cancelar</button>
                <button class="btn btn-d" id="cfY">Confirmar</button>
            </div>
        </div>`;
        document.body.appendChild(ov);
        ov.querySelector('#cfY').onclick=()=>{ov.remove();res(true)};
        ov.querySelector('#cfN').onclick=()=>{ov.remove();res(false)};
    });
}

function genReport(saved){
    const d=saved||collect();
    const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'Sin fecha';
    let tot=0,fill=0,units=0,rows='';
    d.cats.forEach(cat=>{
        rows+=`<tr class="cr"><td colspan="5">${cat.name}</td></tr>`;
        cat.items.forEach(p=>{
            tot++;
            const hasVal=p.paq>0||p.sue>0;
            let qd;
            if(hasVal){
                fill++;
                units+=p.total;
                qd=`<span class="co">${fmtN(p.total)}</span>`;
            }else{qd='<span class="ev">--</span>'}
            rows+=`<tr>
                <td style="padding-left:18px">${p.n}</td>
                <td class="pres">${p.pres||''}</td>
                <td style="text-align:center">${hasVal?fmtN(p.paq):'<span class="ev">--</span>'}</td>
                <td style="text-align:center">${hasVal?fmtN(p.sue):'<span class="ev">--</span>'}</td>
                <td style="text-align:right">${qd} <span style="font-size:.85em;color:#6e6e73">${p.u||''}</span></td>
            </tr>`;
        });
    });
    document.getElementById('rptCont').innerHTML=`
        <div class="rh"><h2>Conteo físico de inventario</h2>
        <div class="rm"><span><strong>Fecha</strong> ${ds}</span><span><strong>Responsable</strong> ${d.resp||'No asignado'}</span><span><strong>Sede</strong> ${d.loc||'No asignada'}</span></div></div>
        <table><thead><tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th style="text-align:center">Paq/Caja</th>
            <th style="text-align:center">Pz sueltas</th>
            <th style="text-align:right">Total</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="tr"><td colspan="2">Total: ${tot} · Contados: ${fill}</td><td colspan="2" style="text-align:right">Unidades totales:</td><td style="text-align:right">${fmtN(Math.round(units))}</td></tr></tfoot></table>`;
    document.getElementById('rptModal').classList.add('show');
}

function closeMod(){document.getElementById('rptModal').classList.remove('show')}
function printRpt(){
    const c=document.getElementById('rptCont').innerHTML;
    const pa=document.getElementById('printArea');
    pa.innerHTML=`<div class="rpt" style="padding:18px;color:#1d1d1f">${c}</div>`;
    pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none'},800);
}
function dlPDF(){
    const dv=document.getElementById('cDate').value||'sin_fecha';
    html2pdf().set({margin:[8,8,8,8],filename:`conteo_inventario_${dv}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#1d1d1f'},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}}).from(document.getElementById('rptCont')).save();
    toast('PDF generado','ok');
}

function renderHist(){
    const C=document.getElementById('histCont');
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');
    if(!h.length){C.innerHTML='<div class="empty"><i class="fas fa-clock-rotate-left"></i><h3>Sin registros</h3><p>Guarda un conteo para verlo aquí</p></div>';return}
    C.innerHTML='<div class="hlist">'+h.map((item,i)=>{
        return`<div class="hcard" onclick="viewHist(${i})">
            <div class="hico"><i class="fas fa-clipboard-check"></i></div>
            <div class="hinfo">
                <h4>${item.date||'Sin fecha'}</h4>
                <p>${item.resp||'Sin responsable'} · ${item.loc||'Sin sede'} · ${item.summary?.filled||0}/${item.summary?.total||0} contados · ${item.summary?.units||0} uds</p>
            </div>
            <div class="hacts">
                <button onclick="event.stopPropagation();loadHist(${i})" title="Cargar"><i class="fas fa-upload"></i></button>
                <button class="del" onclick="event.stopPropagation();delHist(${i})" title="Eliminar"><i class="fas fa-trash"></i></button>
            </div>
        </div>`
    }).join('')+'</div>';
}

function viewHist(i){const h=JSON.parse(localStorage.getItem('invHist')||'[]');if(h[i])genReport(h[i])}

function loadHist(i){
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');const item=h[i];if(!item)return;
    document.getElementById('cDate').value=item.date||'';
    document.getElementById('cResp').value=item.resp||'';
    document.getElementById('cLoc').value=item.loc||'';
    item.cats.forEach((cat,ci)=>{
        if(!DB[ci])return;
        cat.items.forEach((p,pi)=>{
            if(!DB[ci].items[pi])return;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            if(qpaq) qpaq.value = p.paq>0 ? p.paq : '';
            if(qsue) qsue.value = p.sue>0 ? p.sue : '';
            recalcRow(ci,pi);
        });
    });
    updStats();
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab=conteo]').classList.add('on');
    document.getElementById('p-conteo').classList.add('on');
    toast('Registro cargado','ok');
}

function delHist(i){
    confirm2('¿Eliminar este registro del historial?').then(y=>{
        if(!y)return;
        let h=JSON.parse(localStorage.getItem('invHist')||'[]');
        h.splice(i,1);localStorage.setItem('invHist',JSON.stringify(h));
        renderHist();toast('Registro eliminado','ok');
    });
}

document.querySelectorAll('.tab-btn').forEach(t=>{
    t.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
        document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
        t.classList.add('on');
        document.getElementById('p-'+t.dataset.tab).classList.add('on');
        if(t.dataset.tab==='historial')renderHist();
    });
});

function toast(msg,type='ok'){
    const C=document.getElementById('toastC');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const ic=type==='ok'?'fa-check':'fa-exclamation';
    t.innerHTML=`<i class="fas ${ic}"></i><span>${msg}</span>`;
    C.appendChild(t);setTimeout(()=>t.remove(),3100);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
document.getElementById('rptModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMod()});

init();
