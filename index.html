<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Conteo Fisico de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* ============================================================
       APPLE-INSPIRED DARK GALLERY
       — Obsidian stage, Carbon panels, 28px media corners
       — Accent: #55C800 (replaces Apple Blue #0071e3)
       ============================================================ */
    :root{
        /* Apple palette */
        --obsidian:#000000;
        --graphite:#0e0e0e;
        --carbon:#1d1d1f;
        --steel:#333336;
        --slate:#6e6e73;
        --ash:#86868b;
        --porcelain:#f5f5f7;
        --white:#ffffff;

        /* Accent — GREEN keeps Apple Blue's structural role */
        --accent:#55C800;
        --accent-2:#48aa00;
        --accent-3:#3c8c00;
        --accent-link:#8ee64a;   /* Electric-link equivalent on dark */
        --accent-soft:rgba(85,200,0,.14);
        --accent-line:rgba(85,200,0,.55);

        --red:#ff453a;
        --red-line:rgba(255,69,58,.5);

        /* Hairlines / keylines */
        --line:rgba(255,255,255,.10);
        --line-2:rgba(255,255,255,.18);
        --line-3:rgba(255,255,255,.05);

        /* Radius — Apple exact */
        --r-pill:9999px;
        --r-card:28px;
        --r-nav:20px;
        --r-btn:170px;
        --r-btn-compact:36px;
        --r-input:980px;
        --r-soft:14px;
        --r-tag:10px;

        /* Type */
        --sans:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
        --mono:ui-monospace,'SF Mono',Menlo,Monaco,'Cascadia Code',Consolas,monospace;

        /* Motion */
        --ease:cubic-bezier(0,0,.2,1);
        --dur:.28s;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    html{
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
        touch-action:manipulation;
    }
    body{
        font-family:var(--sans);
        background:var(--obsidian);
        color:var(--porcelain);
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-size:14px;
        line-height:1.29;
        letter-spacing:-.224px;
        touch-action:manipulation;
        overscroll-behavior-y:none;
    }

    input,select,textarea,button,.btn,.tab-btn{
        font-size:16px;
        touch-action:manipulation;
        font-family:inherit;
    }

    /* Subtle ambient glow using accent, extremely restrained */
    .bg-fx{
        position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
        background:
            radial-gradient(1200px 600px at 50% -10%, rgba(85,200,0,.06), transparent 60%),
            radial-gradient(800px 500px at 100% 110%, rgba(85,200,0,.03), transparent 60%),
            var(--obsidian);
    }

    .wrap{
        position:relative;z-index:1;
        max-width:1120px;margin:0 auto;
        padding:20px 20px 130px;
    }

    /* ============ HEADER — Apple hero ============ */
    header{
        padding:40px 8px 32px;
        text-align:left;
        border-bottom:1px solid var(--line-3);
        margin-bottom:28px;
    }
    header .hero-top{
        display:flex;align-items:center;gap:12px;
        margin-bottom:16px;
    }
    header .ico{
        width:44px;height:44px;
        background:transparent;
        border:1px solid var(--accent-line);
        border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        font-size:16px;color:var(--accent);
        flex-shrink:0;
        transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
    }
    header .ico:hover{background:var(--accent);color:var(--obsidian)}
    header .kicker{
        font-size:12px;
        font-weight:400;
        letter-spacing:-.12px;
        color:var(--ash);
        text-transform:uppercase;
    }
    header h1{
        font-family:var(--sans);
        font-size:clamp(2rem,6vw,3.5rem);
        font-weight:600;
        letter-spacing:-.84px;
        line-height:1.05;
        color:var(--porcelain);
        margin-bottom:10px;
    }
    header h1 .dot{color:var(--accent)}
    header p{
        color:var(--ash);
        font-size:17px;
        line-height:1.47;
        letter-spacing:-.374px;
        font-weight:400;
        max-width:560px;
    }

    /* ============ TOP FORM — floating capsule ============ */
    .top-row{
        display:flex;gap:10px;flex-wrap:wrap;
        margin-bottom:20px;
    }
    .top-row .fld{
        flex:1;min-width:180px;
        padding:12px 20px;
        background:var(--carbon);
        border-radius:var(--r-nav);
        border:1px solid transparent;
        transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
    }
    .top-row .fld:focus-within{border-color:var(--accent)}
    .top-row .fld:hover{background:#242426}
    .top-row label{
        display:block;
        font-size:12px;
        font-weight:400;
        color:var(--ash);
        letter-spacing:-.12px;
        margin-bottom:4px;
    }
    .top-row input{
        width:100%;
        background:transparent;
        border:0;
        padding:2px 0;
        color:var(--porcelain);
        font-family:inherit;
        font-size:16px;
        font-weight:500;
        letter-spacing:-.224px;
        outline:none;
    }
    .top-row input::placeholder{color:var(--slate);font-weight:400}

    /* ============ STATS — Apple feature tiles ============ */
    .stats-bar{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:12px;
        margin-bottom:20px;
    }
    .stat-card{
        padding:20px;
        background:var(--carbon);
        border-radius:var(--r-card);
        transition:background var(--dur) var(--ease);
    }
    .stat-card:hover{background:#242426}
    .stat-card .num{
        font-family:var(--sans);
        font-size:clamp(1.5rem,3.5vw,2rem);
        font-weight:600;
        line-height:1;
        letter-spacing:-.24px;
        color:var(--porcelain);
    }
    .stat-card:first-child .num{color:var(--accent)}
    .stat-card .lbl{
        font-family:var(--sans);
        font-size:12px;
        color:var(--ash);
        letter-spacing:-.12px;
        margin-top:8px;
        font-weight:400;
    }

    /* ============ PROGRESS ============ */
    .prog-wrap{
        margin-bottom:20px;
        padding:20px 24px;
        background:var(--carbon);
        border-radius:var(--r-card);
    }
    .prog-lbl{
        display:flex;justify-content:space-between;
        font-size:12px;color:var(--ash);
        letter-spacing:-.12px;
        margin-bottom:12px;font-weight:400;
    }
    .prog-lbl strong{
        color:var(--porcelain);
        font-size:12px;font-weight:600;
        letter-spacing:-.224px;
    }
    .prog-trk{
        height:4px;
        background:rgba(255,255,255,.08);
        border-radius:var(--r-pill);
        overflow:hidden;
    }
    .prog-fill{
        height:100%;
        background:var(--accent);
        border-radius:var(--r-pill);
        transition:width .35s var(--ease);
        width:0%;
    }

    /* ============ SEARCH — Apple pill ============ */
    .search-bar{position:relative;margin-bottom:20px}
    .search-bar input{
        width:100%;
        padding:14px 22px 14px 48px;
        background:var(--carbon);
        border:1px solid transparent;
        border-radius:var(--r-input);
        color:var(--porcelain);
        font-family:inherit;
        font-size:16px;
        font-weight:400;
        letter-spacing:-.224px;
        outline:none;
        transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
    }
    .search-bar input:hover{background:#242426}
    .search-bar input:focus{border-color:var(--accent);background:#242426}
    .search-bar input::placeholder{
        color:var(--slate);
        font-size:16px;
        letter-spacing:-.224px;
    }
    .search-bar .si{
        position:absolute;left:20px;top:50%;transform:translateY(-50%);
        color:var(--ash);font-size:.9rem;pointer-events:none;
    }

    /* ============ TABS — Apple pill nav ============ */
    .tabs{
        display:inline-flex;gap:4px;margin-bottom:24px;
        padding:4px;
        background:var(--carbon);
        border-radius:var(--r-pill);
    }
    .tab-btn{
        padding:10px 22px;
        background:transparent;
        border:0;
        border-radius:var(--r-pill);
        color:var(--ash);
        font-family:inherit;
        font-size:14px;
        font-weight:500;
        letter-spacing:-.224px;
        cursor:pointer;
        transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
        white-space:nowrap;
        display:inline-flex;align-items:center;gap:8px;
        touch-action:manipulation;
    }
    .tab-btn i{font-size:.75rem}
    .tab-btn:hover{color:var(--porcelain)}
    .tab-btn.on{
        color:var(--obsidian);
        background:var(--accent);
        font-weight:600;
    }
    .tpanel{display:none;animation:fi .3s var(--ease)}
    .tpanel.on{display:block}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ============ CATEGORY — accordion, 28px cards ============ */
    .cat-sec{
        margin-bottom:12px;
        background:var(--carbon);
        border-radius:var(--r-card);
        overflow:hidden;
        transition:background var(--dur) var(--ease);
    }
    .cat-hd{
        display:flex;align-items:center;gap:14px;
        padding:18px 24px;
        cursor:pointer;user-select:none;
        transition:background var(--dur) var(--ease);
        touch-action:manipulation;
    }
    .cat-hd:hover{background:#242426}
    .cat-dot{
        width:8px;height:8px;border-radius:50%;
        flex-shrink:0;
    }
    .cat-nm{
        font-family:var(--sans);
        font-size:17px;
        font-weight:600;
        letter-spacing:-.374px;
        color:var(--porcelain);
        text-transform:none;
        transition:color var(--dur) var(--ease);
        display:inline-flex;align-items:center;gap:12px;
    }
    .cat-nm i{color:var(--accent);font-size:.85rem;opacity:.9}
    .cat-cnt{
        font-family:var(--sans);
        font-size:12px;
        color:var(--ash);
        padding:2px 10px;
        border-radius:var(--r-pill);
        background:rgba(255,255,255,.05);
        margin-left:auto;
        font-weight:500;
        letter-spacing:-.12px;
    }
    .ct{
        color:var(--ash);font-size:.75rem;
        transition:transform var(--dur) var(--ease),color var(--dur) var(--ease);
        margin-left:12px;
    }
    .cat-hd:hover .ct{color:var(--accent)}

    /* Accordion body — smooth open/close with grid trick */
    .cat-body{
        display:grid;
        grid-template-rows:0fr;
        transition:grid-template-rows .35s var(--ease);
    }
    .cat-body.open{
        grid-template-rows:1fr;
    }
    .cat-body-inner{
        overflow:hidden;
        min-height:0;
    }
    .cat-body-pad{
        padding:4px 12px 14px;
    }

    /* ============ PRODUCT ROW ============ */
    .prow{
        display:flex;align-items:center;gap:14px;
        padding:14px 16px;
        background:rgba(255,255,255,.02);
        border-radius:var(--r-soft);
        margin-bottom:6px;
        transition:background var(--dur) var(--ease);
        flex-wrap:wrap;
    }
    .prow:hover{background:rgba(255,255,255,.045)}
    .prow.hidden{display:none}

    .pinfo{flex:1 1 220px;min-width:0}
    .pname{
        font-family:var(--sans);
        font-size:14px;
        font-weight:600;
        letter-spacing:-.224px;
        color:var(--porcelain);
        line-height:1.35;
    }
    .ppres{
        font-family:var(--sans);
        font-size:12px;
        color:var(--ash);
        margin-top:4px;
        line-height:1.4;
        font-weight:400;
        letter-spacing:-.12px;
        display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    }
    .ppres > i{color:var(--accent);font-size:.7rem;flex-shrink:0}
    .ppres .tag{
        color:var(--accent);
        padding:1px 8px;
        border-radius:var(--r-pill);
        background:var(--accent-soft);
        font-size:11px;
        font-weight:600;
        letter-spacing:-.06px;
    }

    .pinputs{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
    .icell{display:flex;flex-direction:column;gap:4px}
    .ilabel{
        font-family:var(--sans);
        font-size:11px;
        color:var(--ash);
        letter-spacing:-.06px;
        font-weight:500;
        text-align:center;
    }
    .icell input{
        width:84px;
        padding:10px 8px;
        background:rgba(255,255,255,.05);
        border:1px solid transparent;
        border-radius:12px;
        color:var(--porcelain);
        font-family:var(--sans);
        font-size:16px;
        font-weight:600;
        letter-spacing:-.224px;
        text-align:center;
        outline:0;
        transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
        -moz-appearance:textfield;
        touch-action:manipulation;
    }
    .icell input:hover{background:rgba(255,255,255,.08)}
    .icell input:focus{
        border-color:var(--accent);
        background:rgba(255,255,255,.08);
    }
    .icell input::placeholder{color:var(--slate);font-weight:400}
    .icell input::-webkit-inner-spin-button,
    .icell input::-webkit-outer-spin-button{-webkit-appearance:none}

    .total-box{
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:2px;
        padding:8px 16px;min-width:96px;
        background:transparent;
        border:1px solid var(--accent-line);
        border-radius:12px;
        transition:background var(--dur) var(--ease);
    }
    .total-box .tlabel{
        font-family:var(--sans);
        font-size:10px;
        color:var(--accent);
        letter-spacing:-.06px;
        font-weight:600;
        text-transform:uppercase;
        opacity:.9;
    }
    .total-box .tval{
        font-family:var(--sans);
        font-size:1.05rem;
        font-weight:600;
        color:var(--accent);
        line-height:1.1;
        letter-spacing:-.224px;
    }
    .total-box .tunit{
        font-family:var(--sans);
        font-size:10px;
        color:var(--accent);
        opacity:.65;
        font-weight:500;
        letter-spacing:-.06px;
        text-transform:uppercase;
    }

    /* ============ ACTION BAR ============ */
    .act-bar{
        position:fixed;bottom:0;left:0;right:0;
        padding:20px 20px 24px;
        padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
        background:linear-gradient(to top, var(--obsidian) 55%, rgba(0,0,0,0));
        display:flex;gap:10px;flex-wrap:wrap;
        z-index:10;
        justify-content:center;
        max-width:1120px;margin:0 auto;
    }
    .btn{
        display:inline-flex;align-items:center;gap:8px;
        padding:12px 22px;
        border:1px solid transparent;
        border-radius:var(--r-btn);
        font-family:var(--sans);
        font-size:14px;
        font-weight:500;
        letter-spacing:-.224px;
        cursor:pointer;
        transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),transform .12s var(--ease);
        background:transparent;
        color:var(--porcelain);
        touch-action:manipulation;
    }
    .btn:active{transform:scale(.97)}
    .btn i{font-size:.85rem}

    /* Primary — Apple Blue slot, now GREEN */
    .btn-p{
        background:var(--accent);
        color:var(--obsidian);
        font-weight:600;
    }
    .btn-p:hover{background:#66d916;color:var(--obsidian)}

    /* Secondary — outlined */
    .btn-s{
        background:transparent;
        color:var(--porcelain);
        border-color:var(--slate);
    }
    .btn-s:hover{
        border-color:var(--porcelain);
    }

    /* Danger — outlined red */
    .btn-d{
        background:transparent;
        color:var(--red);
        border-color:var(--red-line);
    }
    .btn-d:hover{
        border-color:var(--red);
        background:var(--red);
        color:var(--white);
    }

    /* Send — outlined green */
    .btn-e{
        background:transparent;
        color:var(--accent);
        border-color:var(--accent-line);
    }
    .btn-e:hover{
        background:var(--accent);
        color:var(--obsidian);
        border-color:var(--accent);
    }
    .btn-e:disabled{
        opacity:.5;
        cursor:not-allowed;
        background:transparent!important;
        color:var(--accent)!important;
        border-color:var(--accent-line)!important;
    }

    .act-bar .btn{flex:1;min-width:110px;justify-content:center}

    /* ============ MODAL ============ */
    .modal-bg{
        display:none;position:fixed;inset:0;
        background:rgba(0,0,0,.8);
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        z-index:1000;
        justify-content:center;align-items:flex-start;
        padding:20px;overflow-y:auto;
        animation:p-fadein .25s var(--ease);
    }
    .modal-bg.show{display:flex}
    .modal-box{
        background:var(--carbon);
        color:var(--porcelain);
        border:1px solid var(--line);
        border-radius:var(--r-card);
        width:100%;max-width:960px;margin-top:16px;
        animation:mi .3s var(--ease);
        overflow:hidden;
    }
    @keyframes mi{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes p-fadein{0%{opacity:0}100%{opacity:1}}
    .modal-hd{
        display:flex;align-items:center;justify-content:space-between;
        padding:20px 24px;
        border-bottom:1px solid var(--line-3);
    }
    .modal-hd h2{
        font-family:var(--sans);
        font-size:19px;
        font-weight:600;
        color:var(--porcelain);
        letter-spacing:.228px;
        display:flex;align-items:center;gap:10px;
    }
    .modal-hd h2 i{color:var(--accent);font-size:.95rem}
    .modal-x{
        width:36px;height:36px;
        background:rgba(255,255,255,.06);
        border:0;
        border-radius:50%;
        font-size:.85rem;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        color:var(--ash);
        transition:all var(--dur) var(--ease);
        touch-action:manipulation;
    }
    .modal-x:hover{background:rgba(255,255,255,.12);color:var(--porcelain)}
    .modal-bd{padding:24px;max-height:66vh;overflow-y:auto}
    .modal-ft{
        display:flex;gap:10px;padding:16px 24px;
        border-top:1px solid var(--line-3);
        background:var(--graphite);
    }
    .modal-ft .btn{flex:1;justify-content:center}

    /* ============ REPORT ============ */
    .rpt{
        font-family:var(--sans);
        color:var(--porcelain);
        font-size:13px;
        letter-spacing:-.224px;
    }
    .rpt .rh{
        text-align:left;
        margin-bottom:24px;
        padding-bottom:18px;
        border-bottom:1px solid var(--line-2);
    }
    .rpt .rh h2{
        font-family:var(--sans);
        font-size:24px;font-weight:600;
        letter-spacing:-.24px;
        color:var(--porcelain);
    }
    .rpt .rh h2::before{
        content:'';display:inline-block;
        width:6px;height:6px;border-radius:50%;
        background:var(--accent);
        margin-right:10px;
        vertical-align:middle;
    }
    .rpt .rm{
        display:flex;justify-content:flex-start;flex-wrap:wrap;
        gap:28px;margin-top:12px;
        font-size:12px;color:var(--ash);
        letter-spacing:-.12px;
    }
    .rpt .rm strong{color:var(--porcelain);font-weight:600;margin-right:6px}
    .rpt table{width:100%;border-collapse:collapse;font-size:12px}
    .rpt thead th{
        background:transparent;
        color:var(--ash);
        padding:10px 8px;
        text-align:left;
        font-weight:500;
        font-size:11px;
        letter-spacing:-.06px;
        text-transform:uppercase;
        border-bottom:1px solid var(--line-2);
    }
    .rpt .cr td{
        background:rgba(85,200,0,.08);
        padding:12px 10px;
        font-weight:600;
        font-size:13px;
        color:var(--accent);
        letter-spacing:-.224px;
        border-radius:0;
        border-bottom:1px solid var(--line-3);
    }
    .rpt tbody td{
        padding:9px 8px;
        border-bottom:1px solid var(--line-3);
        color:var(--porcelain);
        vertical-align:top;
        letter-spacing:-.224px;
    }
    .rpt tbody tr:hover td{background:rgba(255,255,255,.02)}
    .rpt .pres{font-size:11px;color:var(--ash);letter-spacing:-.06px}
    .rpt .co{color:var(--accent);font-weight:600}
    .rpt .ev{color:var(--slate);font-style:normal}
    .rpt .tr td{
        background:transparent;
        color:var(--accent);
        padding:16px 8px;
        font-weight:600;
        font-size:12px;
        letter-spacing:-.12px;
        border-top:1px solid var(--accent-line);
        border-bottom:0;
    }

    /* ============ HISTORY ============ */

        padding:20px 24px;
        cursor:pointer;
        transition:background var(--dur) var(--ease);
        display:flex;align-items:center;gap:16px;
        touch-action:manipulation;
    }
    .hcard:hover{background:#242426}
    .hico{
        width:44px;height:44px;
        background:var(--accent-soft);
        border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        color:var(--accent);font-size:.95rem;flex-shrink:0;
        transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
    }
    .hcard:hover .hico{background:var(--accent);color:var(--obsidian)}
    .hinfo{flex:1;min-width:0}
    .hinfo h4{
        font-family:var(--sans);
        font-size:15px;font-weight:600;
        color:var(--porcelain);
        letter-spacing:-.224px;
    }
    .hinfo p{
        font-family:var(--sans);
        font-size:12px;color:var(--ash);
        margin-top:4px;
        letter-spacing:-.12px;
        line-height:1.5;
    }
    .hacts{display:flex;gap:6px}
    .hacts button{
        width:36px;height:36px;
        background:rgba(255,255,255,.05);
        border:0;
        border-radius:50%;
        color:var(--ash);cursor:pointer;font-size:.75rem;
        transition:all var(--dur) var(--ease);
        touch-action:manipulation;
    }
    .hacts button:hover{
        background:var(--accent-soft);
        color:var(--accent);
    }
    .hacts button.del:hover{
        background:rgba(255,69,58,.15);
        color:var(--red);
    }

    /* ============ EMPTY ============ */
    .empty{
        text-align:center;padding:64px 24px;color:var(--ash);
        background:var(--carbon);
        border-radius:var(--r-card);
    }
    .empty i{
        font-size:2.2rem;margin-bottom:16px;
        color:var(--accent);opacity:.6;
    }
    .empty h3{
        font-family:var(--sans);
        font-size:19px;margin-bottom:6px;
        color:var(--porcelain);font-weight:600;
        letter-spacing:.228px;
    }
    .empty p{font-family:var(--sans);font-size:14px;letter-spacing:-.224px}

    /* ============ TOAST ============ */
    .toast-c{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
    .toast{
        background:rgba(29,29,31,.95);
        backdrop-filter:blur(20px);
        -webkit-backdrop-filter:blur(20px);
        border:1px solid var(--line);
        border-radius:var(--r-nav);
        padding:14px 20px;
        font-family:var(--sans);
        font-size:13px;color:var(--porcelain);
        display:flex;align-items:center;gap:12px;
        animation:moveinright .3s var(--ease), to .3s var(--ease) 2.7s forwards;
        min-width:240px;
        letter-spacing:-.224px;
        font-weight:500;
    }
    .toast.ok{border-left:2px solid var(--accent)}
    .toast.err{border-left:2px solid var(--red)}
    .toast.ok i{color:var(--accent)}
    .toast.err i{color:var(--red)}
    @keyframes moveinright{0%{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes to{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

    /* ============ CONFIRM ============ */
    .cfbox{
        background:var(--carbon);
        border:1px solid var(--line);
        border-radius:var(--r-card);
        padding:28px;max-width:400px;width:100%;
        text-align:left;
    }
    .cfbox .cfico{
        width:48px;height:48px;
        background:var(--accent-soft);
        border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        margin-bottom:16px;
        color:var(--accent);font-size:1.1rem;
    }
    .cfbox .cfmsg{
        font-family:var(--sans);
        font-size:15px;color:var(--porcelain);
        margin-bottom:24px;font-weight:400;
        line-height:1.5;
        letter-spacing:-.224px;
    }
    .cfbox .cfact{display:flex;gap:10px}
    .cfbox .cfact .btn{flex:1;justify-content:center}

    /* ============ RESPONSIVE ============ */
    @media(max-width:720px){
        .wrap{padding:14px 16px 140px}
        header{padding:28px 4px 24px}
        header h1{font-size:clamp(1.75rem,7vw,2.4rem);letter-spacing:-.5px}
        header p{font-size:15px;letter-spacing:-.224px}
        .stats-bar{grid-template-columns:repeat(2,1fr);gap:10px}
        .stat-card{padding:16px}
        .stat-card .num{font-size:1.5rem}
        .top-row .fld{min-width:100%}
        .cat-hd{padding:16px 20px;gap:12px}
        .cat-nm{font-size:15px;letter-spacing:-.28px}
        .cat-nm i{font-size:.75rem}
        .cat-cnt{font-size:11px;padding:2px 8px}
        .cat-body-pad{padding:4px 10px 12px}
        .prow{flex-direction:column;align-items:stretch;gap:12px;padding:14px}
        .pinfo{flex:0 0 auto}
        .pinputs{justify-content:space-between;width:100%}
        .icell{flex:1}
        .icell input{width:100%}
        .total-box{flex:1;min-width:0}
        .modal-bd{padding:20px}
        .modal-hd,.modal-ft{padding:16px 20px}
        .tab-btn{padding:9px 16px;font-size:13px}
        .btn{padding:12px 16px;font-size:13px}
        .act-bar{padding:14px 12px 18px;gap:8px}
        .act-bar .btn{min-width:0;padding:12px 12px;font-size:12px;gap:6px}
        .act-bar .btn i{font-size:.75rem}
        .rpt table{font-size:11px}
        .rpt thead th{padding:8px 4px;font-size:10px}
        .rpt tbody td{padding:7px 4px}
        .toast-c{left:16px;right:16px}
        .toast{min-width:0;width:100%}
    }
    @media(max-width:420px){
        .act-bar .btn span{display:none}
        .act-bar .btn{padding:12px 14px}
        .act-bar .btn i{font-size:.9rem}
    }
    @media print{
        body{background:#fff!important}
        .wrap,.modal-bg,.bg-fx,.toast-c,.act-bar,.tabs{display:none!important}
        #printArea{display:block!important;position:fixed;inset:0;background:#fff;z-index:99999;padding:14px;color:#1d1d1f}
        #printArea .rpt{color:#1d1d1f}
        #printArea .rpt .rh h2{color:#1d1d1f}

        #printArea .rpt tbody td{color:#1d1d1f;border-bottom:1px solid #e0e0e0}
        #printArea .rpt .pres{color:#555}
        #printArea .rpt .co{color:#3c8c00}
        #printArea .rpt .tr td{color:#3c8c00;border-top:2px solid #3c8c00}
    }
    #printArea{display:none}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(85,200,0,.35)}

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
            transform:none!important;
        }
    }
</style>

<body>
<div class="bg-fx"></div>
<div class="wrap">
    <header>
        <div class="hero-top">
            <div class="ico"><i class="fas fa-clipboard-check"></i></div>
            <span class="kicker">Inventario · v2.2</span>
        </div>
        <h1>Conteo Físico<span class="dot">.</span></h1>
        <p>Registra paquetes y piezas sueltas. El total se calcula automáticamente.</p>
    </header>

    <div class="top-row">
        <div class="fld"><label>Fecha</label><input type="date" id="cDate"></div>
        <div class="fld"><label>Responsable</label><input type="text" id="cResp" placeholder="Nombre"></div>
        <div class="fld"><label>Sede</label><input type="text" id="cLoc" placeholder="Sucursal"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-card"><div class="num" id="sTotal">0</div><div class="lbl">Total Productos</div></div>
        <div class="stat-card"><div class="num" id="sFilled">0</div><div class="lbl">Contados</div></div>
        <div class="stat-card"><div class="num" id="sPending">0</div><div class="lbl">Pendientes</div></div>
        <div class="stat-card"><div class="num" id="sUnits">0</div><div class="lbl">Unidades</div></div>
    </div>

    <div class="prog-wrap">
        <div class="prog-lbl"><span>Progreso del conteo</span><strong id="pTxt">0 / 0</strong></div>
        <div class="prog-trk"><div class="prog-fill" id="pFill"></div></div>
    </div>

    <div class="search-bar">
        <i class="fas fa-search si"></i>
        <input type="text" id="searchInput" placeholder="Buscar producto o presentación">
    </div>

    <nav class="tabs" id="navTabs">
        <button class="tab-btn on" data-tab="conteo"><i class="fas fa-pen"></i> Conteo</button>
        <button class="tab-btn" data-tab="historial"><i class="fas fa-clock-rotate-left"></i> Historial</button>

</div>

<div class="act-bar">
    <button class="btn btn-d" onclick="clearAll()"><i class="fas fa-eraser"></i> <span>Limpiar</span></button>
    <button class="btn btn-s" onclick="saveCount()"><i class="fas fa-floppy-disk"></i> <span>Guardar</span></button>
    <button class="btn btn-e" id="btnSend" onclick="sendWebhook()"><i class="fas fa-paper-plane"></i> <span>Enviar</span></button>
    <button class="btn btn-p" onclick="genReport()"><i class="fas fa-file-lines"></i> <span>PDF</span></button>
</div>

<div class="modal-bg" id="rptModal">
    <div class="modal-box">
        <div class="modal-hd"><h2><i class="fas fa-file-lines"></i> Reporte de Conteo</h2><button class="modal-x" onclick="closeMod()"><i class="fas fa-xmark"></i></button></div>
        <div class="modal-bd"><div class="rpt" id="rptCont"></div></div>
        <div class="modal-ft">
            <button class="btn btn-s" onclick="closeMod()">Cerrar</button>
            <button class="btn btn-s" onclick="printRpt()"><i class="fas fa-print"></i> Imprimir</button>
            <button class="btn btn-p" onclick="dlPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
    </div>
</div>

<div id="printArea"></div>
<div class="toast-c" id="toastC"></div>

{n:"Popotes",pres:"PAQUETE 100 Pz",pp:100,u:"Pza"},
{n:"Tenedor De Bambu",pres:"PAQUETE CON 500 Pz",pp:500,u:"Pza"},
{n:"Rollo Para Malteada",pres:"PAQUETE PARA 1600 SELLADOS",pp:1600,u:"Pza"},
{n:"Servicios Hechos",pres:"PIEZA",pp:1,u:"Pza"}
]}
];

let currentOpenCat = null;

function init(){
    document.getElementById('cDate').value=new Date().toISOString().split('T')[0];
    buildForm();
    renderHist();
}
function fmtN(n){
    if(n==null||n==='')return '--';
    const num=Number(n);
    if(isNaN(num))return '--';
    return num.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
}

function buildForm(){
    const C=document.getElementById('invForm');C.innerHTML='';
    let total=0;
    DB.forEach((cat,ci)=>{
        total+=cat.items.length;
        const sec=document.createElement('div');sec.className='cat-sec';
        sec.innerHTML=`
            <div class="cat-hd" onclick="togCat(${ci})">
                <div class="cat-dot" style="background:${cat.clr}"></div>
                <span class="cat-nm"><i class="fas ${cat.ico}"></i> ${cat.c}</span>
                <span class="cat-cnt">${cat.items.length} SKU</span>
                <i class="fas fa-chevron-down ct" id="ct${ci}"></i>
            </div>
            <div class="cat-body" id="cb${ci}">
                <div class="cat-body-inner">
                    <div class="cat-body-pad" id="pad${ci}"></div>
                </div>
            </div>`;
        C.appendChild(sec);
        const body=document.getElementById(`pad${ci}`);
        cat.items.forEach((p,pi)=>{body.insertAdjacentHTML('beforeend',mkRow(ci,pi,p))});
    });
    C.querySelectorAll('.qpaq, .qsuelt').forEach(inp=>{
        inp.addEventListener('input',()=>{
            const ci=+inp.dataset.c, pi=+inp.dataset.p;
            recalcRow(ci,pi);
            updStats();
        });
    });
    document.getElementById('sTotal').textContent=total;
    updStats();
}

function mkRow(ci,pi,p){
    const presText=p.pres||'';
    const ppTag=p.pp!==1?`<span class="tag">${fmtN(p.pp)} ${p.u}/PAQ</span>`:'';
    return `<div class="prow" id="r${ci}_${pi}" data-name="${p.n.toLowerCase()} ${presText.toLowerCase()}">
        <div class="pinfo">
            <div class="pname">${p.n}</div>
            <div class="ppres">
                <i class="fas fa-cube"></i>
                <span>${presText}</span>
                ${ppTag}
            </div>
        </div>
        <div class="pinputs">
            <div class="icell">
                <span class="ilabel">Paq / Caja</span>
                <input type="number" class="qpaq" id="paq${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="icell">
                <span class="ilabel">Pz Sueltas</span>
                <input type="number" class="qsuelt" id="sue${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="total-box">
                <span class="tlabel">Total</span>
                <span class="tval" id="tot${ci}_${pi}">0</span>
                <span class="tunit">${p.u}</span>
            </div>
        </div>
    </div>`;
}

function recalcRow(ci,pi){
    const qpaq=document.getElementById(`paq${ci}_${pi}`);
    const qsue=document.getElementById(`sue${ci}_${pi}`);
    const totEl=document.getElementById(`tot${ci}_${pi}`);
    const p=DB[ci].items[pi];

    const paq=parseFloat(qpaq.value)||0;
    const sue=parseFloat(qsue.value)||0;
    const sp=p.sp!=null?p.sp:1;
    const total=(paq*p.pp)+(sue*sp);

    totEl.textContent=total>0?fmtN(total):'0';
}

function updStats(){
    let filled=0,total=0,units=0;
    DB.forEach((cat,ci)=>{
        cat.items.forEach((p,pi)=>{
            total++;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            const paq=parseFloat(qpaq?.value)||0;
            const sue=parseFloat(qsue?.value)||0;
            const sp=p.sp!=null?p.sp:1;
            const t=(paq*p.pp)+(sue*sp);
            if(paq>0||sue>0)filled++;
            if(t>0)units+=t;
        });
    });
    const pct=total>0?(filled/total*100):0;
    document.getElementById('pFill').style.width=pct+'%';
    document.getElementById('pTxt').textContent=`${filled} / ${total}`;
    document.getElementById('sFilled').textContent=filled;
    document.getElementById('sPending').textContent=total-filled;
    document.getElementById('sUnits').textContent=fmtN(Math.round(units));
}

// ====================================================
// ACORDEÓN — solo una sección abierta a la vez
// ====================================================
function togCat(ci){
    const body=document.getElementById(`cb${ci}`);
    const chev=document.getElementById(`ct${ci}`);
    const wasOpen=body.classList.contains('open');

    // Cerrar todas
    DB.forEach((cat,i)=>{
        const b=document.getElementById(`cb${i}`);
        const c=document.getElementById(`ct${i}`);
        if(b){b.classList.remove('open')}
        if(c){c.style.transform=''}
    });
    currentOpenCat=null;

    // Si no estaba abierta, abrirla
    if(!wasOpen){
        body.classList.add('open');
        chev.style.transform='rotate(180deg)';
        currentOpenCat=ci;
    }
}

document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();

    // Filtrar filas
    document.querySelectorAll('.prow').forEach(row=>{
        const name=row.dataset.name||'';
        row.classList.toggle('hidden',q!==''&&!name.includes(q));
    });

    // Auto-abrir categorías con coincidencias, cerrar las vacías
    DB.forEach((cat,ci)=>{
        const body=document.getElementById(`cb${ci}`);
        if(!body)return;
        const pad=document.getElementById(`pad${ci}`);
        const visible=pad.querySelectorAll('.prow:not(.hidden)');
        const sec=body.closest('.cat-sec');
        const chev=document.getElementById(`ct${ci}`);

        if(q===''){
            // Reset: cerrar todo cuando se limpia la búsqueda
            sec.style.display='';
            body.classList.remove('open');
            chev.style.transform='';
        }else{
            if(visible.length===0){
                sec.style.display='none';
                body.classList.remove('open');
                chev.style.transform='';
            }else{
                sec.style.display='';
                body.classList.add('open');
                chev.style.transform='rotate(180deg)';
            }
        }
    });
});

function collect(){
    return{
        date:document.getElementById('cDate').value,
        resp:document.getElementById('cResp').value,
        loc:document.getElementById('cLoc').value,
        ts:new Date().toISOString(),
        cats:DB.map((cat,ci)=>({
            name:cat.c,clr:cat.clr,
            items:cat.items.map((p,pi)=>{
                const qpaq=document.getElementById(`paq${ci}_${pi}`);
                const qsue=document.getElementById(`sue${ci}_${pi}`);
                const paq=parseFloat(qpaq?.value)||0;
                const sue=parseFloat(qsue?.value)||0;
                const sp=p.sp!=null?p.sp:1;
                const total=(paq*p.pp)+(sue*sp);
                return{n:p.n,pres:p.pres,pp:p.pp,sp,u:p.u,paq,sue,total}
            })
        }))
    };
}

function saveCount(){
    const d=collect();
    if(!d.date){toast('Selecciona una fecha','err');return}
    const hasAny=d.cats.some(c=>c.items.some(p=>p.total>0));
    if(!hasAny){toast('Ingresa al menos una cantidad','err');return}
    let h=JSON.parse(localStorage.getItem('invHist')||'[]');
    d.id='cnt_'+Date.now();
    d.summary={
        total:d.cats.reduce((s,c)=>s+c.items.length,0),
        filled:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.total>0).length,0),
        units:Math.round(d.cats.reduce((s,c)=>s+c.items.reduce((a,p)=>a+p.total,0),0))
    };
    h.unshift(d);localStorage.setItem('invHist',JSON.stringify(h));
    toast('Conteo guardado correctamente','ok');renderHist();
}

// ====== Enviar al Webhook ======
async function sendWebhook(){
    const btn = document.getElementById('btnSend');
    const originalHTML = btn.innerHTML;

    const d = collect();
    if(!d.date){toast('Selecciona una fecha','err');return}

    const itemsConDatos = [];
    d.cats.forEach(cat=>{
        cat.items.forEach(p=>{
            if(p.paq > 0 || p.sue > 0){
                itemsConDatos.push({
                    categoria: cat.name,
                    producto: p.n,
                    presentacion: p.pres || '',
                    paquetes: p.paq,
                    piezasPorPaquete: p.pp,
                    multiplicadorSueltas: p.sp != null ? p.sp : 1,
                    piezasSueltas: p.sue,
                    total: p.total,
                    unidad: p.u
                });
            }
        });
    });

    if(!itemsConDatos.length){
        toast('Ingresa al menos una cantidad','err');
        return;
    }

    const totalProductos = d.cats.reduce((s,c)=>s+c.items.length,0);
    const unidadesTotales = Math.round(itemsConDatos.reduce((s,p)=>s+p.total,0));

    const payload = {
        fecha: d.date,
        responsable: d.resp || '',
        sede: d.loc || '',
        timestamp: d.ts,
        items: itemsConDatos,
        resumen: {
            totalProductos,
            contados: itemsConDatos.length,
            pendientes: totalProductos - itemsConDatos.length,
            unidadesTotales
        }
    };

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Enviando</span>';

    try{
        const res = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if(!res.ok) throw new Error('HTTP '+res.status);

        toast('Conteo enviado correctamente','ok');
        btn.innerHTML = '<i class="fas fa-check"></i> <span>Enviado</span>';
        setTimeout(()=>{ btn.innerHTML = originalHTML; }, 1800);
    }catch(err){
        console.error('Error webhook:', err);
        toast('Error al enviar: '+err.message,'err');
        btn.innerHTML = '<i class="fas fa-triangle-exclamation"></i> <span>Reintentar</span>';
        setTimeout(()=>{ btn.innerHTML = originalHTML; }, 2200);
    }finally{
        setTimeout(()=>{ btn.disabled = false; }, 1500);
    }
}

function clearAll(){
    confirm2('¿Limpiar todos los campos del conteo actual?').then(y=>{
        if(!y)return;
        document.querySelectorAll('#invForm .qpaq, #invForm .qsuelt').forEach(inp=>inp.value='');
        DB.forEach((cat,ci)=>cat.items.forEach((p,pi)=>{
            const t=document.getElementById(`tot${ci}_${pi}`);
            if(t)t.textContent='0';
        }));
        document.getElementById('cResp').value='';
        document.getElementById('cLoc').value='';
        updStats();
        toast('Campos limpiados','ok');
    });
}

function confirm2(msg){
    return new Promise(res=>{
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;animation:p-fadein .25s var(--ease)';
        ov.innerHTML=`<div class="cfbox">
            <div class="cfico"><i class="fas fa-triangle-exclamation"></i></div>
            <p class="cfmsg">${msg}</p>
            <div class="cfact">
                <button class="btn btn-s" id="cfN">Cancelar</button>
                <button class="btn btn-d" id="cfY">Confirmar</button>
            </div>
        </div>`;
        document.body.appendChild(ov);
        ov.querySelector('#cfY').onclick=()=>{ov.remove();res(true)};
        ov.querySelector('#cfN').onclick=()=>{ov.remove();res(false)};
    });
}

function genReport(saved){
    const d=saved||collect();
    const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'Sin fecha';
    let tot=0,fill=0,units=0,rows='';
    d.cats.forEach(cat=>{
        rows+=`<tr class="cr"><td colspan="5">${cat.name}</td></tr>`;
        cat.items.forEach(p=>{
            tot++;
            const hasVal=p.paq>0||p.sue>0;
            let qd;
            if(hasVal){
                fill++;
                units+=p.total;
                qd=`<span class="co">${fmtN(p.total)}</span>`;
            }else{qd='<span class="ev">--</span>'}
            rows+=`<tr>
                <td style="padding-left:16px">${p.n}</td>
                <td class="pres">${p.pres||''}</td>
                <td style="text-align:center">${hasVal?fmtN(p.paq):'<span class="ev">--</span>'}</td>
                <td style="text-align:center">${hasVal?fmtN(p.sue):'<span class="ev">--</span>'}</td>
                <td style="text-align:right">${qd} <span style="font-size:.85em;color:#86868b">${p.u||''}</span></td>
            </tr>`;
        });
    });
    document.getElementById('rptCont').innerHTML=`
        <div class="rh"><h2>Conteo Físico de Inventario</h2>
        <div class="rm"><span><strong>Fecha</strong> ${ds}</span><span><strong>Responsable</strong> ${d.resp||'No asignado'}</span><span><strong>Sede</strong> ${d.loc||'No asignada'}</span></div></div>
        <table><thead><tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th style="text-align:center">Paq/Caja</th>
            <th style="text-align:center">Pz Sueltas</th>
            <th style="text-align:right">Total</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="tr"><td colspan="2">Total: ${tot} · Contados: ${fill}</td><td colspan="2" style="text-align:right">Unidades totales:</td><td style="text-align:right">${fmtN(Math.round(units))}</td></tr></tfoot></table>`;
    document.getElementById('rptModal').classList.add('show');
}

function closeMod(){document.getElementById('rptModal').classList.remove('show')}
function printRpt(){
    const c=document.getElementById('rptCont').innerHTML;
    const pa=document.getElementById('printArea');
    pa.innerHTML=`<div class="rpt" style="padding:14px;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;color:#1d1d1f">${c}</div>`;
    pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none'},800);
}
function dlPDF(){
    const dv=document.getElementById('cDate').value||'sin_fecha';
    html2pdf().set({margin:[8,8,8,8],filename:`conteo_inventario_${dv}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#1d1d1f'},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}}).from(document.getElementById('rptCont')).save();
    toast('PDF generado','ok');
}

function renderHist(){
    const C=document.getElementById('histCont');
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');
    if(!h.length){C.innerHTML='<div class="empty"><i class="fas fa-clock-rotate-left"></i><h3>Sin registros</h3><p>Guarda un conteo para verlo aquí</p></div>';return}
    C.innerHTML='<div class="hlist">'+h.map((item,i)=>{
        return`<div class="hcard" onclick="viewHist(${i})">
            <div class="hico"><i class="fas fa-clipboard-check"></i></div>
            <div class="hinfo">
                <h4>${item.date||'Sin fecha'}</h4>
                <p>${item.resp||'Sin responsable'} · ${item.loc||'Sin sede'} · ${item.summary?.filled||0}/${item.summary?.total||0} contados · ${item.summary?.units||0} uds</p>
            </div>
            <div class="hacts">
                <button onclick="event.stopPropagation();loadHist(${i})" title="Cargar"><i class="fas fa-upload"></i></button>
                <button class="del" onclick="event.stopPropagation();delHist(${i})" title="Eliminar"><i class="fas fa-trash"></i></button>
            </div>
        </div>`
    }).join('')+'</div>';
}

function viewHist(i){const h=JSON.parse(localStorage.getItem('invHist')||'[]');if(h[i])genReport(h[i])}

function loadHist(i){
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');const item=h[i];if(!item)return;
    document.getElementById('cDate').value=item.date||'';
    document.getElementById('cResp').value=item.resp||'';
    document.getElementById('cLoc').value=item.loc||'';
    item.cats.forEach((cat,ci)=>{
        if(!DB[ci])return;
        cat.items.forEach((p,pi)=>{
            if(!DB[ci].items[pi])return;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            if(qpaq) qpaq.value = p.paq>0 ? p.paq : '';
            if(qsue) qsue.value = p.sue>0 ? p.sue : '';
            recalcRow(ci,pi);
        });
    });
    updStats();
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab=conteo]').classList.add('on');
    document.getElementById('p-conteo').classList.add('on');
    toast('Registro cargado','ok');
}

function delHist(i){
    confirm2('¿Eliminar este registro del historial?').then(y=>{
        if(!y)return;
        let h=JSON.parse(localStorage.getItem('invHist')||'[]');
        h.splice(i,1);localStorage.setItem('invHist',JSON.stringify(h));
        renderHist();toast('Registro eliminado','ok');
    });
}

document.querySelectorAll('.tab-btn').forEach(t=>{
    t.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
        document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
        t.classList.add('on');
        document.getElementById('p-'+t.dataset.tab).classList.add('on');
        if(t.dataset.tab==='historial')renderHist();
    });
});

function toast(msg,type='ok'){
    const C=document.getElementById('toastC');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const ic=type==='ok'?'fa-check':'fa-exclamation';
    t.innerHTML=`<i class="fas ${ic}"></i><span>${msg}</span>`;
    C.appendChild(t);setTimeout(()=>t.remove(),3100);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
document.getElementById('rptModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMod()});

init();
</script>
