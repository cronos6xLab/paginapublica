<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteo Fisico de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    :root{
        --bg:#eef3f8;--bg2:#f8fafc;
        --card:rgba(255,255,255,.92);--card-solid:#ffffff;--card2:#f6f9fc;
        --border:#dfe7ef;--border-strong:#cbd5e1;
        --fg:#1e293b;--fg-strong:#0f172a;
        --muted:#64748b;--muted2:#94a3b8;
        --primary:#55C800;--primary-400:#75d230;--primary-300:#96dd61;
        --primary-200:#b6e791;--primary-100:#d6f2c2;--primary-50:#f7fcf2;
        --primary-600:#48aa00;--primary-700:#3c8c00;
        --accent:#55C800;--accent2:#75d230;--accent-glow:rgba(85,200,0,.15);
        --red:#e24c4c;--red-bg:rgba(226,76,76,.08);--red-bdr:rgba(226,76,76,.35);
        --amber:#f59e0b;--amber-bg:rgba(245,158,11,.08);--amber-bdr:rgba(245,158,11,.35);
        --green:#22c55e;--green-bg:rgba(34,197,94,.08);--green-bdr:rgba(34,197,94,.35);
        --r:10px;--r-lg:16px;--r-pill:99px;
        --shadow-sm:0 3px 5px rgba(0,0,0,.02),0 0 2px rgba(0,0,0,.05),0 1px 4px rgba(0,0,0,.08);
        --shadow-md:0 4px 10px rgba(0,0,0,.03),0 0 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.12);
        --shadow-lg:0 7px 30px rgba(0,0,0,.08),0 22px 30px 2px rgba(0,0,0,.15),0 8px 10px rgba(0,0,0,.15);
        --shadow-xl:0 9px 46px 8px rgba(0,0,0,.12),0 24px 38px 3px rgba(0,0,0,.14),0 11px 15px rgba(0,0,0,.2);
        --shadow-brand:0 10px 24px rgba(85,202,0,.28);
        --shadow-brand-hover:0 14px 34px rgba(85,202,0,.38);
        --ease:cubic-bezier(0,0,.2,1);--dur:.2s;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
        font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        background:var(--bg);color:var(--fg);min-height:100vh;
        -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
        letter-spacing:-.005em;line-height:1.45;
    }
    .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .bg-fx::before{
        content:'';position:absolute;inset:0;
        background:
            radial-gradient(1000px 620px at 8% -10%, rgba(85,200,0,.16), transparent 62%),
            radial-gradient(900px 520px at 100% 0%, rgba(117,210,48,.10), transparent 60%),
            radial-gradient(700px 700px at 50% 110%, rgba(85,200,0,.10), transparent 60%),
            linear-gradient(180deg,#f8fafc,#eef3f8 60%);
    }
    .bg-fx .o{position:absolute;border-radius:50%;filter:blur(130px);opacity:.28;animation:orbF 22s ease-in-out infinite alternate}
    .bg-fx .o:nth-child(1){width:540px;height:540px;background:var(--primary-300);top:-180px;left:-80px}
    .bg-fx .o:nth-child(2){width:440px;height:440px;background:var(--primary-200);bottom:-120px;right:-80px;animation-delay:-8s}
    .bg-fx .o:nth-child(3){width:340px;height:340px;background:var(--primary-100);top:50%;left:55%;animation-delay:-15s}
    @keyframes orbF{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}100%{transform:translate(-15px,15px) scale(.94)}}

    .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:16px 14px 120px}

    header{
        text-align:center;padding:24px 20px 22px;
        background:rgba(255,255,255,.72);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.65);border-radius:var(--r-lg);
        box-shadow:var(--shadow-md);margin-bottom:16px;animation:p-fadein .3s var(--ease);
    }
    header .ico{
        width:56px;height:56px;
        background:linear-gradient(140deg,var(--primary-400),var(--primary) 55%,var(--primary-600));
        border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
        font-size:24px;color:#fff;margin-bottom:12px;box-shadow:var(--shadow-brand);
        transition:transform .3s var(--ease);
    }
    header .ico:hover{transform:translateY(-3px) rotate(-4deg)}
    header h1{
        font-family:'Poppins',sans-serif;font-size:clamp(1.4rem,4.6vw,2rem);
        font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--fg-strong);
        background:linear-gradient(135deg,#1e293b 30%, var(--primary-700) 95%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    header p{color:var(--muted);margin-top:6px;font-size:.85rem;font-weight:400}

    .top-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .top-row .fld{
        flex:1;min-width:150px;background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);padding:10px 14px;
        box-shadow:var(--shadow-sm);transition:box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .top-row .fld:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .top-row label{display:block;font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600;margin-bottom:5px}
    .top-row input{width:100%;background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--fg);font-family:inherit;font-size:.85rem;outline:none;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
    .top-row input:hover{border-color:var(--border-strong)}
    .top-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(85,200,0,.18)}

    .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .stat-card{
        flex:1;min-width:104px;background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);padding:13px 14px;
        text-align:center;box-shadow:var(--shadow-sm);
        transition:transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .stat-card .num{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;line-height:1;letter-spacing:-.02em}
    .stat-card .lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:7px;font-weight:600}
    .stat-card.s-total .num{color:var(--primary-700)}
    .stat-card.s-ok .num{color:var(--green)}
    .stat-card.s-low .num{color:var(--red)}
    .stat-card.s-high .num{color:var(--amber)}

    .prog-wrap{
        margin-bottom:16px;background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);
        padding:13px 16px;box-shadow:var(--shadow-sm);
    }
    .prog-lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:8px;font-weight:500}
    .prog-lbl strong{color:var(--primary-700);font-size:.85rem;font-weight:700;font-family:'JetBrains Mono',monospace}
    .prog-trk{height:8px;background:rgba(85,200,0,.12);border-radius:var(--r-pill);overflow:hidden}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--primary-400),var(--primary));border-radius:var(--r-pill);transition:width .45s var(--ease);width:0%;box-shadow:0 0 12px rgba(85,200,0,.5)}

    .legend{
        display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:11px 16px;
        background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);
        font-size:.74rem;color:var(--muted);font-weight:500;box-shadow:var(--shadow-sm);
    }
    .legend i{margin-right:5px}
    .lg-red{color:var(--red)}.lg-amber{color:var(--amber)}.lg-ok{color:var(--green)}

    .search-bar{margin-bottom:16px;position:relative}
    .search-bar input{
        width:100%;padding:12px 16px 12px 44px;background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);
        color:var(--fg);font-family:inherit;font-size:.88rem;outline:none;
        box-shadow:var(--shadow-sm);
        transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    }
    .search-bar input:hover{border-color:var(--primary-200)}
    .search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(85,200,0,.18),var(--shadow-sm)}
    .search-bar input::placeholder{color:var(--muted2)}
    .search-bar .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:.88rem;pointer-events:none}

    .tabs{
        display:flex;gap:4px;margin-bottom:18px;background:rgba(255,255,255,.65);
        backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r-pill);
        padding:5px;box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab-btn{
        flex:1;min-width:fit-content;padding:10px 20px;background:0;border:0;
        color:var(--muted);font-family:inherit;font-size:.82rem;font-weight:600;
        border-radius:var(--r-pill);cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap;
    }
    .tab-btn:hover{color:var(--fg);background:rgba(255,255,255,.7)}
    .tab-btn.on{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-400));font-weight:700;box-shadow:var(--shadow-brand)}
    .tpanel{display:none;animation:fi .28s var(--ease)}.tpanel.on{display:block}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes p-fadein{0%{opacity:0}100%{opacity:1}}

    .cat-sec{
        margin-bottom:18px;background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r-lg);
        padding:4px 12px 12px;box-shadow:var(--shadow-sm);
        transition:box-shadow var(--dur) var(--ease);
    }
    .cat-sec:hover{box-shadow:var(--shadow-md)}
    .cat-hd{display:flex;align-items:center;gap:10px;padding:13px 4px;cursor:pointer;user-select:none}
    .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
    .cat-nm{
        font-family:'Poppins',sans-serif;font-size:.94rem;font-weight:700;letter-spacing:-.01em;
        color:var(--fg-strong);transition:color var(--dur) var(--ease);
        display:inline-flex;align-items:center;gap:8px;
    }
    .cat-nm i{color:var(--primary);font-size:.82rem}
    .cat-hd:hover .cat-nm{color:var(--primary-700)}
    .cat-cnt{
        font-size:.66rem;color:var(--primary-700);background:var(--primary-50);
        border:1px solid var(--primary-100);padding:3px 10px;border-radius:var(--r-pill);
        margin-left:auto;font-weight:700;font-family:'JetBrains Mono',monospace;
    }
    .ct{color:var(--muted2);font-size:.65rem;transition:transform var(--dur) var(--ease),color var(--dur) var(--ease);margin-left:4px}
    .cat-hd:hover .ct{color:var(--primary)}
    .cat-body{transition:opacity var(--dur) var(--ease)}.cat-body.hide{display:none}

    /* ---- PRODUCT ROW (nuevo layout con paquetes + sueltas + total) ---- */
    .prow{
        display:flex;align-items:center;gap:12px;
        padding:12px 14px;
        background:rgba(255,255,255,.7);
        border:1px solid var(--border);
        border-radius:var(--r);
        margin-bottom:6px;
        transition:all var(--dur) var(--ease);
        flex-wrap:wrap;
    }
    .prow:hover{background:#fff;border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
    .prow.st-low{background:var(--red-bg);border-color:var(--red-bdr);border-left:3px solid var(--red)}
    .prow.st-high{background:var(--amber-bg);border-color:var(--amber-bdr);border-left:3px solid var(--amber)}
    .prow.st-ok{background:var(--green-bg);border-color:var(--green-bdr);border-left:3px solid var(--green)}
    .prow.hidden{display:none}

    .pinfo{flex:1 1 200px;min-width:0}
    .pname{font-size:.82rem;font-weight:600;color:var(--fg-strong);line-height:1.25}
    .ppres{
        font-size:.65rem;color:var(--muted);margin-top:4px;line-height:1.4;
        font-family:'JetBrains Mono',monospace;font-weight:500;
        display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    }
    .ppres .tag{
        background:rgba(85,200,0,.10);color:var(--primary-700);
        padding:1px 6px;border-radius:4px;font-weight:700;font-size:.6rem;
        letter-spacing:.02em;
    }
    .ppres .minmax{color:var(--muted2);font-size:.62rem}

    .pinputs{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
    .icell{display:flex;flex-direction:column;gap:3px}
    .ilabel{
        font-size:.56rem;color:var(--muted);
        text-transform:uppercase;letter-spacing:.08em;font-weight:700;
        text-align:center;
    }
    .icell input{
        width:70px;padding:8px 6px;
        background:#fff;border:1px solid var(--border);border-radius:8px;
        color:var(--fg-strong);font-family:'JetBrains Mono',monospace;
        font-size:.9rem;font-weight:700;text-align:center;outline:0;
        transition:all var(--dur) var(--ease);
        -moz-appearance:textfield;
    }
    .icell input:hover{border-color:var(--border-strong)}
    .icell input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(85,200,0,.18)}
    .icell input::-webkit-inner-spin-button,.icell input::-webkit-outer-spin-button{-webkit-appearance:none}

    .total-box{
        display:flex;flex-direction:column;align-items:center;gap:2px;
        padding:6px 12px;min-width:86px;
        background:linear-gradient(135deg,var(--primary-50),var(--primary-100));
        border:1px solid var(--primary-200);border-radius:8px;
        transition:all var(--dur) var(--ease);
    }
    .total-box .tlabel{
        font-size:.55rem;color:var(--primary-700);
        text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    }
    .total-box .tval{
        font-family:'JetBrains Mono',monospace;font-size:1.05rem;
        font-weight:700;color:var(--primary-700);line-height:1;
    }
    .total-box .tunit{
        font-size:.55rem;color:var(--primary-700);opacity:.75;
        font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    }
    .prow.st-low .total-box{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca}
    .prow.st-low .total-box .tlabel,
    .prow.st-low .total-box .tval,
    .prow.st-low .total-box .tunit{color:var(--red)}
    .prow.st-high .total-box{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
    .prow.st-high .total-box .tlabel,
    .prow.st-high .total-box .tval,
    .prow.st-high .total-box .tunit{color:#b45309}
    .prow.st-ok .total-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#a7f3d0}
    .prow.st-ok .total-box .tlabel,
    .prow.st-ok .total-box .tval,
    .prow.st-ok .total-box .tunit{color:#047857}

    .badge{
        font-size:.54rem;padding:4px 9px;border-radius:var(--r-pill);
        font-weight:700;text-transform:uppercase;letter-spacing:.08em;
        background:rgba(0,0,0,.05);color:var(--muted);
        flex-shrink:0;white-space:nowrap;
        transition:all var(--dur) var(--ease);
        align-self:center;
    }
    .prow.st-low .badge{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(226,76,76,.35)}
    .prow.st-high .badge{background:var(--amber);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.35)}
    .prow.st-ok .badge{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.35)}

    .act-bar{
        position:fixed;bottom:0;left:0;right:0;
        background:linear-gradient(to top, rgba(238,243,248,.98) 55%, rgba(238,243,248,0));
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        padding:16px 14px 14px;display:flex;gap:9px;flex-wrap:wrap;
        z-index:10;justify-content:center;max-width:1080px;margin:0 auto;
    }
    .btn{
        display:inline-flex;align-items:center;gap:7px;padding:12px 20px;
        border:0;border-radius:var(--r);font-family:inherit;font-size:.82rem;
        font-weight:700;cursor:pointer;transition:all var(--dur) var(--ease);
        letter-spacing:.005em;
    }
    .btn:active{transform:scale(.96)}
    .btn-p{background:linear-gradient(135deg,var(--primary),var(--primary-400));color:#fff;box-shadow:var(--shadow-brand)}
    .btn-p:hover{transform:translateY(-2px);box-shadow:var(--shadow-brand-hover)}
    .btn-s{background:#fff;color:var(--fg);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
    .btn-s:hover{border-color:var(--primary);color:var(--primary-700);transform:translateY(-1px)}
    .btn-d{background:rgba(255,255,255,.65);color:var(--red);border:1px solid rgba(226,76,76,.25)}
    .btn-d:hover{background:var(--red);color:#fff;border-color:var(--red);transform:translateY(-1px)}
    .act-bar .btn{flex:1;min-width:110px;justify-content:center}

    .modal-bg{
        display:none;position:fixed;inset:0;
        background:rgba(33,33,33,.45);
        backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
        z-index:1000;justify-content:center;align-items:flex-start;
        padding:16px;overflow-y:auto;animation:p-fadein .2s var(--ease);
    }
    .modal-bg.show{display:flex}
    .modal-box{
        background:#fff;color:var(--fg);border-radius:var(--r-lg);
        width:100%;max-width:900px;margin-top:16px;
        box-shadow:var(--shadow-xl);animation:mi .3s var(--ease);overflow:hidden;
    }
    @keyframes mi{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-hd{
        display:flex;align-items:center;justify-content:space-between;
        padding:16px 22px;border-bottom:1px solid var(--border);
        background:linear-gradient(to bottom,var(--primary-50),rgba(255,255,255,0));
    }
    .modal-hd h2{font-family:'Poppins',sans-serif;font-size:1.05rem;font-weight:700;color:var(--fg-strong);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
    .modal-hd h2 i{color:var(--primary)}
    .modal-x{
        width:34px;height:34px;background:var(--card2);border:0;border-radius:50%;
        font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
        color:var(--muted);transition:all var(--dur) var(--ease);
    }
    .modal-x:hover{background:var(--red);color:#fff;transform:rotate(90deg)}
    .modal-bd{padding:22px;max-height:62vh;overflow-y:auto}
    .modal-ft{display:flex;gap:9px;padding:14px 22px;border-top:1px solid var(--border);background:var(--card2)}
    .modal-ft .btn{flex:1;justify-content:center}
    .btn-pr{background:#1e293b;color:#fff}
    .btn-pr:hover{background:#0f172a;transform:translateY(-1px);box-shadow:var(--shadow-md)}
    .btn-pf{background:linear-gradient(135deg,#e24c4c,#c73b3b);color:#fff;box-shadow:0 10px 24px rgba(226,76,76,.28)}
    .btn-pf:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(226,76,76,.4)}

    .rpt .rh{text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--fg-strong)}
    .rpt .rh h2{font-family:'Poppins',sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:-.01em;color:var(--fg-strong)}
    .rpt .rm{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:.74rem;color:var(--muted)}
    .rpt .rm strong{color:var(--fg-strong)}
    .rpt table{width:100%;border-collapse:collapse;font-size:.72rem}
    .rpt thead th{
        background:linear-gradient(135deg,#1e293b,#0f172a);
        color:#fff;padding:9px 8px;text-align:left;
        font-weight:700;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
    }
    .rpt .cr td{background:var(--primary-50);padding:8px 10px;font-weight:700;font-size:.74rem;color:var(--primary-700);border-bottom:2px solid var(--primary-100)}
    .rpt tbody td{padding:6px 8px;border-bottom:1px solid #eef2f7;color:var(--fg)}
    .rpt tbody tr:nth-child(even) td{background:#fafbfd}
    .rpt .pres{font-size:.62rem;color:#64748b;font-family:'JetBrains Mono',monospace}
    .rpt .cl{color:var(--red);font-weight:700}
    .rpt .ch{color:var(--amber);font-weight:700}
    .rpt .co{color:var(--green);font-weight:700}
    .rpt .ev{color:#cbd5e1;font-style:italic}
    .rpt .tr td{background:linear-gradient(135deg,var(--primary),var(--primary-600));color:#fff;padding:11px;font-weight:700;font-size:.72rem}

    .hlist{display:flex;flex-direction:column;gap:9px}
    .hcard{
        background:var(--card);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid rgba(255,255,255,.7);border-radius:var(--r);
        padding:14px 18px;cursor:pointer;transition:all var(--dur) var(--ease);
        display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);
    }
    .hcard:hover{border-color:var(--primary-200);background:#fff;transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .hico{
        width:44px;height:44px;
        background:linear-gradient(135deg,var(--primary-50),var(--primary-100));
        border:1px solid var(--primary-200);border-radius:12px;
        display:flex;align-items:center;justify-content:center;
        color:var(--primary-700);font-size:1rem;flex-shrink:0;
        transition:transform .3s var(--ease);
    }
    .hcard:hover .hico{transform:scale(1.06) rotate(-4deg)}
    .hinfo{flex:1;min-width:0}
    .hinfo h4{font-size:.86rem;font-weight:700;color:var(--fg-strong)}
    .hinfo p{font-size:.7rem;color:var(--muted);margin-top:3px}
    .hacts{display:flex;gap:5px}
    .hacts button{width:32px;height:32px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:.72rem;transition:all var(--dur) var(--ease)}
    .hacts button:hover{color:var(--primary-700);border-color:var(--primary);background:var(--primary-50);transform:translateY(-1px)}
    .hacts button.del:hover{color:#fff;background:var(--red);border-color:var(--red)}

    .empty{text-align:center;padding:48px 16px;color:var(--muted)}
    .empty i{font-size:2.4rem;margin-bottom:12px;opacity:.35;color:var(--primary)}
    .empty h3{font-size:1rem;margin-bottom:5px;color:var(--fg-strong);font-weight:700}
    .empty p{font-size:.82rem}

    .toast-c{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:7px}
    .toast{
        background:rgba(255,255,255,.96);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border:1px solid var(--border);border-radius:var(--r);
        padding:11px 16px;font-size:.82rem;color:var(--fg);
        display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);
        animation:moveinright .3s var(--ease),to .3s var(--ease) 2.7s forwards;
        min-width:220px;font-weight:500;
    }
    .toast.ok{border-left:4px solid var(--green)}
    .toast.err{border-left:4px solid var(--red)}
    .toast.ok i{color:var(--green)}
    .toast.err i{color:var(--red)}
    @keyframes moveinright{0%{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
    @keyframes to{from{opacity:1}to{opacity:0;transform:translateX(30px)}}

    @media(max-width:720px){
        .prow{flex-direction:column;align-items:stretch;gap:10px}
        .pinfo{flex:0 0 auto}
        .pinputs{justify-content:flex-start}
        .icell input{width:64px}
        .total-box{min-width:78px;padding:5px 10px}
        .total-box .tval{font-size:.95rem}
    }
    @media(max-width:640px){
        .wrap{padding:12px 12px 120px}
        header{padding:20px 14px 18px}
        header .ico{width:48px;height:48px;font-size:20px}
        header h1{font-size:1.35rem}
        header p{font-size:.78rem}
        .modal-box{border-radius:var(--r);margin-top:8px}
        .stats-bar{gap:6px}
        .stat-card{min-width:72px;padding:10px 8px}
        .stat-card .num{font-size:1.1rem}
        .stat-card .lbl{font-size:.54rem;letter-spacing:.08em}
        .tab-btn{padding:9px 14px;font-size:.78rem}
        .btn{padding:11px 14px;font-size:.78rem}
        .act-bar{padding:12px 10px 10px;gap:6px}
        .act-bar .btn{min-width:90px}
        .modal-bd{padding:16px}
        .modal-hd,.modal-ft{padding-left:16px;padding-right:16px}
    }
    @media(max-width:400px){
        .legend{font-size:.68rem;gap:10px}
        .search-bar input{padding-left:40px}
        .hacts button{width:28px;height:28px}
        .hico{width:36px;height:36px;font-size:.85rem}
        .icell input{width:58px;font-size:.82rem}
    }
    @media print{
        body{background:#fff!important}
        .wrap,.modal-bg,.bg-fx,.toast-c,.act-bar,.tabs{display:none!important}
        #printArea{display:block!important;position:fixed;inset:0;background:#fff;z-index:99999;padding:14px}
    }
    #printArea{display:none}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(85,200,0,.3);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--primary)}

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
            transform:none!important;
        }
    }
</style>
</head>
<body>
<div class="bg-fx"><div class="o"></div><div class="o"></div><div class="o"></div></div>
<div class="wrap">
    <header>
        <div class="ico"><i class="fas fa-clipboard-check"></i></div>
        <h1>Conteo Fisico de Inventario</h1>
        <p>Registra paquetes y piezas sueltas · El total se calcula automaticamente</p>
    </header>

    <div class="top-row">
        <div class="fld"><label>Fecha</label><input type="date" id="cDate"></div>
        <div class="fld"><label>Responsable</label><input type="text" id="cResp" placeholder="Nombre"></div>
        <div class="fld"><label>Sede</label><input type="text" id="cLoc" placeholder="Sucursal"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-card s-total"><div class="num" id="sTotal">0</div><div class="lbl">Total Productos</div></div>
        <div class="stat-card s-ok"><div class="num" id="sOk">0</div><div class="lbl">En Rango</div></div>
        <div class="stat-card s-low"><div class="num" id="sLow">0</div><div class="lbl">Bajo Minimo</div></div>
        <div class="stat-card s-high"><div class="num" id="sHigh">0</div><div class="lbl">Sobre Maximo</div></div>
    </div>

    <div class="prog-wrap">
        <div class="prog-lbl"><span>Progreso del conteo</span><strong id="pTxt">0 / 0</strong></div>
        <div class="prog-trk"><div class="prog-fill" id="pFill"></div></div>
    </div>

    <div class="legend">
        <span><i class="fas fa-circle lg-red"></i> Bajo minimo (reabastecer)</span>
        <span><i class="fas fa-circle lg-amber"></i> Sobre maximo (exceso)</span>
        <span><i class="fas fa-circle lg-ok"></i> En rango correcto</span>
    </div>

    <div class="search-bar">
        <i class="fas fa-search si"></i>
        <input type="text" id="searchInput" placeholder="Buscar producto o presentacion...">
    </div>

    <nav class="tabs" id="navTabs">
        <button class="tab-btn on" data-tab="conteo"><i class="fas fa-pen"></i> Conteo</button>
        <button class="tab-btn" data-tab="historial"><i class="fas fa-clock-rotate-left"></i> Historial</button>
    </nav>

    <div class="tpanel on" id="p-conteo"><main id="invForm"></main></div>
    <div class="tpanel" id="p-historial"><div id="histCont"></div></div>
</div>

<div class="act-bar">
    <button class="btn btn-d" onclick="clearAll()"><i class="fas fa-eraser"></i> Limpiar</button>
    <button class="btn btn-s" onclick="saveCount()"><i class="fas fa-floppy-disk"></i> Guardar</button>
    <button class="btn btn-p" onclick="genReport()"><i class="fas fa-file-lines"></i> Vista / PDF</button>
</div>

<div class="modal-bg" id="rptModal">
    <div class="modal-box">
        <div class="modal-hd"><h2><i class="fas fa-file-lines"></i> Reporte de Conteo</h2><button class="modal-x" onclick="closeMod()"><i class="fas fa-xmark"></i></button></div>
        <div class="modal-bd"><div class="rpt" id="rptCont"></div></div>
        <div class="modal-ft">
            <button class="btn btn-s" onclick="closeMod()"><i class="fas fa-xmark"></i> Cerrar</button>
            <button class="btn btn-pr" onclick="printRpt()"><i class="fas fa-print"></i> Imprimir</button>
            <button class="btn btn-pf" onclick="dlPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
    </div>
</div>

<div id="printArea"></div>
<div class="toast-c" id="toastC"></div>

// ====== Init ======
function init(){
    document.getElementById('cDate').value=new Date().toISOString().split('T')[0];
    buildForm();
    renderHist();
}
function fmtN(n){
    if(n==null||n==='')return '--';
    const num = Number(n);
    if(isNaN(num)) return '--';
    return num.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
}

// ====== Construir formulario ======
function buildForm(){
    const C=document.getElementById('invForm');C.innerHTML='';
    let total=0;
    DB.forEach((cat,ci)=>{
        total+=cat.items.length;
        const sec=document.createElement('div');sec.className='cat-sec';
        sec.innerHTML=`<div class="cat-hd" onclick="togCat(${ci})"><div class="cat-dot" style="background:${cat.clr}"></div><span class="cat-nm"><i class="fas ${cat.ico}"></i> ${cat.c}</span><span class="cat-cnt" id="cc${ci}">${cat.items.length}</span><i class="fas fa-chevron-down ct" id="ct${ci}"></i></div><div class="cat-body" id="cb${ci}"></div>`;
        C.appendChild(sec);
        const body=sec.querySelector('.cat-body');
        cat.items.forEach((p,pi)=>{body.insertAdjacentHTML('beforeend',mkRow(ci,pi,p))});
    });
    // Listeners
    C.querySelectorAll('.qpaq, .qsuelt').forEach(inp=>{
        inp.addEventListener('input',()=>{
            const ci=+inp.dataset.c, pi=+inp.dataset.p;
            recalcRow(ci,pi);
            updStats();
        });
    });
    document.getElementById('sTotal').textContent=total;
    updStats();
}

function mkRow(ci,pi,p){
    const presText = p.pres || '';
    const minmax = (p.mn===0&&p.mx===0) ? 'Sin min/max' : `Min ${fmtN(p.mn)} / Max ${fmtN(p.mx)} ${p.u}`;
    const ppTag = p.pp !== 1 ? `<span class="tag">${fmtN(p.pp)} ${p.u}/paq</span>` : '';
    return `<div class="prow" id="r${ci}_${pi}" data-name="${p.n.toLowerCase()} ${presText.toLowerCase()}">
        <div class="pinfo">
            <div class="pname">${p.n}</div>
            <div class="ppres">
                <i class="fas fa-box" style="color:var(--primary);font-size:.6rem"></i>
                <span>${presText}</span>
                ${ppTag}
                <span class="minmax">· ${minmax}</span>
            </div>
        </div>
        <div class="pinputs">
            <div class="icell">
                <span class="ilabel">Paq / Caja</span>
                <input type="number" class="qpaq" id="paq${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="icell">
                <span class="ilabel">Pz Sueltas</span>
                <input type="number" class="qsuelt" id="sue${ci}_${pi}" min="0" step="0.01" placeholder="0" data-c="${ci}" data-p="${pi}">
            </div>
            <div class="total-box">
                <span class="tlabel">Total</span>
                <span class="tval" id="tot${ci}_${pi}">0</span>
                <span class="tunit">${p.u}</span>
            </div>
            <span class="badge" id="b${ci}_${pi}">--</span>
        </div>
    </div>`;
}

// ====== Recalcular fila ======
function recalcRow(ci,pi){
    const row=document.getElementById(`r${ci}_${pi}`);
    if(!row) return;
    const qpaq=document.getElementById(`paq${ci}_${pi}`);
    const qsue=document.getElementById(`sue${ci}_${pi}`);
    const totEl=document.getElementById(`tot${ci}_${pi}`);
    const badge=document.getElementById(`b${ci}_${pi}`);
    const p=DB[ci].items[pi];

    const paq = parseFloat(qpaq.value)||0;
    const sue = parseFloat(qsue.value)||0;
    const total = (paq * p.pp) + sue;

    totEl.textContent = total>0 ? fmtN(total) : '0';

    row.classList.remove('st-low','st-high','st-ok');

    if(total<=0){
        badge.textContent='--';
        badge.style.background='';badge.style.color='';
        return;
    }
    // Sin min/max definidos: solo muestra el total, badge informativo
    if(p.mn===0 && p.mx===0){
        badge.textContent='N/A';
        badge.style.background='';badge.style.color='';
        return;
    }
    if(total<p.mn){
        row.classList.add('st-low');
        badge.textContent='BAJO';
    } else if(total>p.mx){
        row.classList.add('st-high');
        badge.textContent='EXCESO';
    } else {
        row.classList.add('st-ok');
        badge.textContent='OK';
    }
}

// ====== Actualizar estadisticas ======
function updStats(){
    let filled=0,low=0,high=0,ok=0,total=0;
    DB.forEach((cat,ci)=>{
        cat.items.forEach((p,pi)=>{
            total++;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            const paq=parseFloat(qpaq?.value)||0;
            const sue=parseFloat(qsue?.value)||0;
            const t=(paq*p.pp)+sue;
            if(t>0){
                filled++;
                if(p.mn===0 && p.mx===0){
                    // sin min/max, no cuenta en categorias
                } else if(t<p.mn){low++}
                else if(t>p.mx){high++}
                else{ok++}
            }
        });
    });
    const pct=total>0?(filled/total*100):0;
    document.getElementById('pFill').style.width=pct+'%';
    document.getElementById('pTxt').textContent=`${filled} / ${total}`;
    document.getElementById('sOk').textContent=ok;
    document.getElementById('sLow').textContent=low;
    document.getElementById('sHigh').textContent=high;
}

function togCat(ci){
    const body=document.getElementById(`cb${ci}`);
    const tog=document.getElementById(`ct${ci}`);
    body.classList.toggle('hide');
    tog.style.transform=body.classList.contains('hide')?'rotate(-90deg)':'';
}

document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    document.querySelectorAll('.prow').forEach(row=>{
        const name=row.dataset.name||'';
        row.classList.toggle('hidden',q!==''&&!name.includes(q));
    });
    DB.forEach((cat,ci)=>{
        const body=document.getElementById(`cb${ci}`);
        if(!body)return;
        const visible=body.querySelectorAll('.prow:not(.hidden)');
        const sec=body.closest('.cat-sec');
        sec.style.display=visible.length===0&&q!==''?'none':'';
    });
});

// ====== Recolectar datos ======
function collect(){
    return{
        date:document.getElementById('cDate').value,
        resp:document.getElementById('cResp').value,
        loc:document.getElementById('cLoc').value,
        ts:new Date().toISOString(),
        cats:DB.map((cat,ci)=>({
            name:cat.c,clr:cat.clr,
            items:cat.items.map((p,pi)=>{
                const qpaq=document.getElementById(`paq${ci}_${pi}`);
                const qsue=document.getElementById(`sue${ci}_${pi}`);
                const paq=parseFloat(qpaq?.value)||0;
                const sue=parseFloat(qsue?.value)||0;
                const total=(paq*p.pp)+sue;
                let status='--';
                if(total>0){
                    if(p.mn===0&&p.mx===0) status='N/A';
                    else if(total<p.mn) status='BAJO';
                    else if(total>p.mx) status='EXCESO';
                    else status='OK';
                }
                return{n:p.n,pres:p.pres,pp:p.pp,mn:p.mn,mx:p.mx,u:p.u,paq,sue,total,status}
            })
        }))
    };
}

// ====== Guardar ======
function saveCount(){
    const d=collect();
    if(!d.date){toast('Selecciona una fecha','err');return}
    const hasAny=d.cats.some(c=>c.items.some(p=>p.total>0));
    if(!hasAny){toast('Ingresa al menos una cantidad','err');return}
    let h=JSON.parse(localStorage.getItem('invHist')||'[]');
    d.id='cnt_'+Date.now();
    d.summary={
        total:d.cats.reduce((s,c)=>s+c.items.length,0),
        filled:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.total>0).length,0),
        low:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='BAJO').length,0),
        high:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='EXCESO').length,0),
        ok:d.cats.reduce((s,c)=>s+c.items.filter(p=>p.status==='OK').length,0)
    };
    h.unshift(d);localStorage.setItem('invHist',JSON.stringify(h));
    toast('Conteo guardado correctamente','ok');renderHist();
}

// ====== Limpiar ======
function clearAll(){
    confirm2('¿Limpiar todos los campos del conteo actual?').then(y=>{
        if(!y)return;
        document.querySelectorAll('#invForm .qpaq, #invForm .qsuelt').forEach(inp=>inp.value='');
        document.querySelectorAll('#invForm .prow').forEach(row=>{
            row.classList.remove('st-low','st-high','st-ok');
            const b=row.querySelector('.badge');
            if(b){b.textContent='--';b.style.background='';b.style.color='';}
            const t=row.querySelector('.totv, .tval');
            if(t) t.textContent='0';
        });
        // Reset total displays
        DB.forEach((cat,ci)=>cat.items.forEach((p,pi)=>{
            const el=document.getElementById(`tot${ci}_${pi}`);
            if(el) el.textContent='0';
        }));
        document.getElementById('cResp').value='';
        document.getElementById('cLoc').value='';
        updStats();toast('Campos limpiados','ok');
    });
}

function confirm2(msg){
    return new Promise(res=>{
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(33,33,33,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;animation:p-fadein .2s var(--ease)';
        ov.innerHTML=`<div style="background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-xl);animation:mi .25s var(--ease)"><div style="width:52px;height:52px;margin:0 auto 12px;background:linear-gradient(135deg,var(--primary-50),var(--primary-100));border:1px solid var(--primary-200);border-radius:14px;display:flex;align-items:center;justify-content:center"><i class="fas fa-triangle-exclamation" style="font-size:1.3rem;color:var(--primary-700)"></i></div><p style="color:var(--fg);font-size:.88rem;margin-bottom:18px;font-weight:500;line-height:1.45">${msg}</p><div style="display:flex;gap:8px"><button class="btn btn-s" style="flex:1;justify-content:center" id="cfN">Cancelar</button><button class="btn btn-pf" style="flex:1;justify-content:center" id="cfY">Confirmar</button></div></div>`;
        document.body.appendChild(ov);
        ov.querySelector('#cfY').onclick=()=>{ov.remove();res(true)};
        ov.querySelector('#cfN').onclick=()=>{ov.remove();res(false)};
    });
}

// ====== Reporte ======
function genReport(saved){
    const d=saved||collect();
    const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'Sin fecha';
    let tot=0,fill=0,low=0,high=0,ok=0,rows='';
    d.cats.forEach(cat=>{
        rows+=`<tr class="cr"><td colspan="7"><i class="fas fa-circle" style="font-size:6px;color:${cat.clr};margin-right:6px"></i>${cat.name}</td></tr>`;
        cat.items.forEach(p=>{
            tot++;
            let qd,sc='co';
            if(p.total>0){
                fill++;
                if(p.status==='BAJO'){sc='cl';low++}
                else if(p.status==='EXCESO'){sc='ch';high++}
                else if(p.status==='OK'){ok++}
                qd=`<span class="${sc}">${fmtN(p.total)}</span>`;
            }else{qd='<span class="ev">--</span>'}
            const stTxt=p.total>0?
                (p.status==='BAJO'?'<span style="color:#c0392b;font-weight:700">BAJO</span>'
                :p.status==='EXCESO'?'<span style="color:#f59e0b;font-weight:700">EXCESO</span>'
                :p.status==='OK'?'<span style="color:#22c55e;font-weight:700">OK</span>'
                :'<span style="color:#94a3b8">--</span>'):'';
            const minmax = (p.mn===0&&p.mx===0) ? '--' : `${fmtN(p.mn)} / ${fmtN(p.mx)}`;
            rows+=`<tr>
                <td style="padding-left:14px">${p.n}</td>
                <td class="pres">${p.pres||''}</td>
                <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600">${fmtN(p.pa q)}</td>
                <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600">${fmtN(p.sue)}</td>
                <td style="text-align:right"><strong style="font-family:'JetBrains Mono',monospace">${fmtN(p.total)}</strong> <span style="font-size:.6rem;color:#94a3b8">${p.u||''}</span></td>
                <td style="text-align:center;font-size:.62rem;color:#64748b">${minmax}</td>
                <td style="text-align:center;font-size:.66rem">${stTxt}</td>
            </tr>`;
        });
    });
    document.getElementById('rptCont').innerHTML=`
        <div class="rh"><h2>CONTEO FISICO DE INVENTARIO</h2>
        <div class="rm"><span><strong>Fecha:</strong> ${ds}</span><span><strong>Responsable:</strong> ${d.resp||'No asignado'}</span><span><strong>Sede:</strong> ${d.loc||'No asignada'}</span></div></div>
        <table><thead><tr>
            <th>Producto</th>
            <th>Presentacion</th>
            <th style="text-align:center">Paq/Caja</th>
            <th style="text-align:center">Pz Sueltas</th>
            <th style="text-align:right">Total</th>
            <th style="text-align:center">Min / Max</th>
            <th style="text-align:center">Estado</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="tr"><td colspan="2">Total: ${tot} | Contados: ${fill}</td><td colspan="2">OK: ${ok}</td><td>Bajo: ${low}</td><td>Exceso: ${high}</td><td style="text-align:center">${Math.round(fill/tot*100)}%</td></tr></tfoot></table>`;
    document.getElementById('rptModal').classList.add('show');
}

function closeMod(){document.getElementById('rptModal').classList.remove('show')}
function printRpt(){
    const c=document.getElementById('rptCont').innerHTML;
    const pa=document.getElementById('printArea');
    pa.innerHTML=`<div class="rpt" style="padding:14px;font-family:'Poppins',sans-serif;color:#1e293b">${c}</div>`;
    pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none'},800);
}
function dlPDF(){
    const dv=document.getElementById('cDate').value||'sin_fecha';
    html2pdf().set({margin:[8,8,8,8],filename:`conteo_inventario_${dv}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}}).from(document.getElementById('rptCont')).save();
    toast('PDF generado','ok');
}

// ====== Historial ======
function renderHist(){
    const C=document.getElementById('histCont');
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');
    if(!h.length){C.innerHTML='<div class="empty"><i class="fas fa-clock-rotate-left"></i><h3>Sin registros</h3><p>Guarda un conteo para verlo aqui</p></div>';return}
    C.innerHTML='<div class="hlist">'+h.map((item,i)=>{
        return`<div class="hcard" onclick="viewHist(${i})"><div class="hico"><i class="fas fa-clipboard-check"></i></div><div class="hinfo"><h4>${item.date||'Sin fecha'}</h4><p>${item.resp||'Sin responsable'} · ${item.loc||'Sin sede'} · ${item.summary?.filled||0}/${item.summary?.total||0} contados · ${item.summary?.low||0} bajo · ${item.summary?.high||0} exceso</p></div><div class="hacts"><button onclick="event.stopPropagation();loadHist(${i})" title="Cargar"><i class="fas fa-upload"></i></button><button class="del" onclick="event.stopPropagation();delHist(${i})" title="Eliminar"><i class="fas fa-trash"></i></button></div></div>`
    }).join('')+'</div>';
}

function viewHist(i){const h=JSON.parse(localStorage.getItem('invHist')||'[]');if(h[i])genReport(h[i])}

function loadHist(i){
    const h=JSON.parse(localStorage.getItem('invHist')||'[]');const item=h[i];if(!item)return;
    document.getElementById('cDate').value=item.date||'';
    document.getElementById('cResp').value=item.resp||'';
    document.getElementById('cLoc').value=item.loc||'';
    item.cats.forEach((cat,ci)=>{
        if(!DB[ci])return;
        cat.items.forEach((p,pi)=>{
            if(!DB[ci].items[pi])return;
            const qpaq=document.getElementById(`paq${ci}_${pi}`);
            const qsue=document.getElementById(`sue${ci}_${pi}`);
            if(qpaq) qpaq.value = p.paq>0 ? p.paq : '';
            if(qsue) qsue.value = p.sue>0 ? p.sue : '';
            recalcRow(ci,pi);
        });
    });
    updStats();
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab=conteo]').classList.add('on');
    document.getElementById('p-conteo').classList.add('on');
    toast('Registro cargado','ok');
}

function delHist(i){
    confirm2('¿Eliminar este registro del historial?').then(y=>{
        if(!y)return;
        let h=JSON.parse(localStorage.getItem('invHist')||'[]');
        h.splice(i,1);localStorage.setItem('invHist',JSON.stringify(h));
        renderHist();toast('Registro eliminado','ok');
    });
}

// ====== Navegación ======
document.querySelectorAll('.tab-btn').forEach(t=>{
    t.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
        document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
        t.classList.add('on');
        document.getElementById('p-'+t.dataset.tab).classList.add('on');
        if(t.dataset.tab==='historial')renderHist();
    });
});

function toast(msg,type='ok'){
    const C=document.getElementById('toastC');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const ic=type==='ok'?'fa-check-circle':'fa-exclamation-circle';
    t.innerHTML=`<i class="fas ${ic}"></i><span>${msg}</span>`;
    C.appendChild(t);setTimeout(()=>t.remove(),3100);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});
document.getElementById('rptModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMod()});

init();
</script>
